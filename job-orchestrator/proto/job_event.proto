syntax = "proto3";
package job;

// WARNING: This contract is duplicated in Job Orchestrator and Notification Service.
// Both copies must remain byte-identical.

// Định nghĩa thông điệp gửi từ Job-Proxy qua Redis Stream
message JobNotificationEvent {
  string job_id = 1;        // Mã định danh duy nhất của Job
  string user_id = 2;       // ID người nhận thông báo
  string status = 3;        // Trạng thái kết quả: SUCCESS hoặc FAILED
  string event_type = 4;    // Loại sự kiện để phục vụ log nghiệp vụ
  string title = 5;         // Tiêu đề của thông báo
  string message = 6;       // Nội dung chi tiết của thông báo
  int64 created_at = 7;     // Thời điểm xảy ra sự kiện dưới dạng Unix Epoch seconds
  string trace_parent = 8;  // W3C traceparent của Redis producer span
  string trace_state = 9;   // W3C tracestate; không truyền tới browser
  string resource_id = 10;  // Resource business để UI refresh đúng aggregate
  uint32 job_version = 11;  // Fence/ordering metadata, không dùng làm metric label
  uint32 attempt = 12;
  string notification_id = 13; // UUIDv5 stable identity của exact status delivery
}
