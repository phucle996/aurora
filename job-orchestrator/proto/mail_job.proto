syntax = "proto3";
package mail;

option go_package = "controlplane/internal/mail/transport/rpc/proto;mailproto";

// Cấu hình gửi email giao dịch/hệ thống dùng chung (generic mail job)
message SendMailConfig {
  map<string, string> template_variables = 1;
  string sender_profile_id = 2;
  uint32 sender_version = 3;
  string recipient = 4;
  string template_id = 5;
  string subject = 6;
  string text_body = 7;
  string html_body = 8;
}
