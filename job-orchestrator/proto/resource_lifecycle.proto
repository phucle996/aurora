syntax = "proto3";
package resource_lifecycle;

// [COMMENT]: Protobuf contract duy nhất cho lifecycle events của resource.
// Tuyệt đối không chứa secret key, policy JSON, hay bất kỳ credential nào.
// event_id PHẢI deterministic: UUID_v5(namespace, source_job_id_bytes || event_type_bytes).
// Owner phải được derive từ DB tại thời điểm xử lý kết quả — không dùng outbox.user_id.
message ResourceLifecycleEventV1 {
  // [COMMENT]: UUID bytes (16 bytes), deterministic từ source_job_id + event_type
  bytes  event_id        = 1;

  // [COMMENT]: "RESOURCE_CREATED" hoặc "RESOURCE_DELETED"
  string event_type      = 2;

  // [COMMENT]: Schema version — luôn = 1 cho message definition này
  int32  schema_version  = 3;

  // [COMMENT]: UUID bytes của resource (bucket id)
  bytes  resource_id     = 4;

  // [COMMENT]: "STORAGE_BUCKET" — mở rộng cho các resource type khác sau này
  string resource_type   = 5;

  // [COMMENT]: Tên vật lý bucket (e.g. "ws-abc123")
  string resource_name   = 6;

  // [COMMENT]: UUID bytes của owner — personal_workspaces.owner_id hoặc tenant_id
  bytes  owner_id        = 7;

  // [COMMENT]: "PERSONAL" hoặc "TENANT"
  string owner_type      = 8;

  // [COMMENT]: UUID bytes của zone
  bytes  zone_id         = 9;

  // [COMMENT]: Ownership version tăng dần; RESOURCE_CREATED=1, mỗi transfer tăng thêm
  int64  source_version  = 10;

  // [COMMENT]: RFC3339 UTC — thời điểm lifecycle event có hiệu lực
  string effective_at    = 11;

  // [COMMENT]: UUID bytes của job tạo ra event này (provisioning job)
  bytes  source_job_id   = 12;

  // [COMMENT]: W3C traceparent để distributed tracing end-to-end
  string traceparent     = 13;
}
