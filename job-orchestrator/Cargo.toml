[package]
name = "aurora-job-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["runtime", "with-uuid-1", "with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
postgres-protocol = "0.6"
pgwire-replication = "0.3.2"
redis = { version = "0.25", features = ["tokio-rustls-comp", "connection-manager"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }

chrono = { version = "0.4", features = ["serde"] }
prost = "0.12"
opentelemetry = { version = "0.23", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.16.0", features = ["grpc-tonic", "metrics", "tls-roots"] }
hostname = "0.4"
tonic = { version = "0.11", features = ["tls-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-nats = "0.33"
krafka = { version = "0.11.0", default-features = false, features = ["zstd", "native-tls-roots", "ring"] }
bytes = "1.7"
ahash = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }


[build-dependencies]
prost-build = "0.12"
tonic-build = "0.11"
protoc-bin-vendored = "3"
