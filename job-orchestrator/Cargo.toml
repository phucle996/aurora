[package]
name = "aurora-job-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["runtime", "with-uuid-1"] }
postgres-protocol = "0.6"
pgwire-replication = "0.3.2"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.12"
opentelemetry = { version = "0.23", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.16.0", features = ["grpc-tonic", "metrics"] }
hostname = "0.4"
tonic = { version = "0.11", features = ["tls"] }


[build-dependencies]
prost-build = "0.12"
tonic-build = "0.11"
