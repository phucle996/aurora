syntax = "proto3";
package mail;

option go_package = "controlplane/internal/mail/transport/rpc/proto;mailproto";

// Cấu hình gửi email giao dịch/hệ thống dùng chung (generic mail job)
message SendMailConfig {
  map<string, string> template_variables = 1;
  string sender_profile_id = 2; // Opaque sender đã được upstream authorize; Dataplane không nhận arbitrary From
  uint32 sender_version = 3;
  string recipient = 4;         // Một job tương ứng đúng một recipient để partial result/retry độc lập
  string template_id = 5;       // Có template_id hoặc explicit body
  string subject = 6;
  string text_body = 7;
  string html_body = 8;
}
