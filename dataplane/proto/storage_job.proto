syntax = "proto3";
package storage;

option go_package = "controlplane/internal/storage/transport/rpc/proto;storageproto";

// Cấu hình đồng bộ hóa Bucket vật lý từ Controlplane sang Dataplane
message BucketSync {
  string name = 1;                // Tên vật lý của bucket
  string access_key = 2;          // Access Key sẽ được tạo trên MinIO
  string secret_key = 3;          // Secret Key (plaintext trong payload, transit qua internal infra)
  string policy = 4;              // JSON policy giới hạn quyền truy cập chỉ vào bucket này
}

// Cấu hình đồng bộ hóa Credential vật lý từ Controlplane sang Dataplane
message CredentialSync {
  string id = 1;                  // ID credential dạng UUID string
  string access_key = 2;          // Access Key MinIO
  string secret_key = 3;          // Secret Key MinIO
  string policy = 4;              // JSON policy
}

// Cấu hình đồng bộ hóa thay đổi hạn mức (resize) Bucket
message BucketResizeSync {
  string bucket_id = 1;            // ID bucket dạng UUID string để DP ghi log
  string name = 2;                 // Tên vật lý của bucket
  int64 current_quota_bytes = 3;   // Quota hiện tại
  int64 requested_quota_bytes = 4; // Quota muốn thay đổi
}

// Cấu hình đồng bộ hóa xóa Bucket vật lý
message BucketDeleteSync {
  string name = 1;                  // Tên vật lý của bucket cần xóa
  repeated string access_keys = 2; // Danh sách access keys cần thu hồi/xóa sạch
}

// Cấu hình yêu cầu cấp khóa tạm thời (STS) cho đối tượng
message ObjectStsRequest {
  string bucket_name = 1;
  int64 duration_seconds = 2;
}

// Cấu hình phản hồi khóa tạm thời (STS) dạng nhị phân Protobuf
message ObjectStsResponse {
  string access_key = 1;
  string secret_key = 2;
  string session_token = 3;
  string expiration = 4;
  string endpoint = 5;
}

