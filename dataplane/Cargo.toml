[package]
name = "aurora-dataplane"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
async-nats = "0.33"
bytes = "1.7"
redis = { version = "0.25", features = ["tokio-rustls-comp", "connection-manager"] }
tonic = "0.11"
prost = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
arc-swap = "1.7"
notify = "6.1"
dotenvy = "0.15"
tokio-util = "0.7"
async-trait = "0.1"
opentelemetry = { version = "0.23", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.16.0", features = ["grpc-tonic", "metrics"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "v5"] }
hostname = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder"] }
rand = "0.8"
futures-util = "0.3"
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
zstd = "0.13"
krafka = { version = "0.11.0", default-features = false, features = ["gzip", "snappy", "lz4", "zstd", "native-tls-roots", "ring"] }
ahash = "0.8"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
lapin = "4.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.38"
aws-sdk-sts = "1.38"
aws-credential-types = { version = "1.2", features = ["hardcoded-credentials"] }

[build-dependencies]
prost-build = "0.11"
