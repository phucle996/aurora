[package]
name = "aurora-dataplane"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
tonic = "0.11"
prost = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
arc-swap = "1.7"
notify = "6.1"
dotenvy = "0.15"
tokio-util = "0.7"
async-trait = "0.1"
sha2 = "0.10"
opentelemetry = { version = "0.23", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.16.0", features = ["grpc-tonic", "metrics"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4"] }
hostname = "0.4"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "hostname", "smtp-transport", "builder"] }
rand = "0.8"
rustls-pemfile = "1.0"
rustls = "0.23"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.38"
aws-credential-types = { version = "1.2", features = ["hardcoded-credentials"] }

[build-dependencies]
prost-build = "0.11"
