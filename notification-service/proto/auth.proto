syntax = "proto3";
package auth;

// Dịch vụ xác thực Trinity Token gRPC kết nối giữa Notification Service (Rust) và Controlplane (Go)
service AuthService {
  // Xác thực Trinity credentials cho Admin/SRE quản trị hệ thống
  rpc VerifyAdminTrinityToken (VerifyAdminTrinityTokenRequest) returns (VerifyAdminTrinityTokenResponse);

  // Xác thực Trinity credentials cho người dùng (End-User) thông thường
  rpc VerifyUserTrinityToken (VerifyUserTrinityTokenRequest) returns (VerifyUserTrinityTokenResponse);
}

// Request xác thực cho Admin/SRE
message VerifyAdminTrinityTokenRequest {
  string admin_api_token = 1;
  string access_key = 2;
  string access_secret = 3;
}

// Response trả về cho Admin/SRE
message VerifyAdminTrinityTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
}

// Request xác thực cho End-User
message VerifyUserTrinityTokenRequest {
  string access_token = 1;
  string access_key = 2;
  string access_secret = 3;
}

// Response trả về cho End-User
message VerifyUserTrinityTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
  string zone_id = 4;
}
