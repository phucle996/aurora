extensions:
  # [COMMENT]: Khai báo docker_observer để giám sát các container thông qua unix:///var/run/docker.sock
  docker_observer:
    endpoint: unix:///var/run/docker.sock
  # [COMMENT]: Filelog checkpoints phải sống qua collector restart; nếu chỉ giữ offset trong RAM
  # thì restart có thể đọc trùng hoặc bỏ qua container log trong cửa sổ downtime.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # [METRICS SCRAPER]: Thu thập dữ liệu từ các exporter hạ tầng (như postgres_exporter)
  # chạy theo mô hình Pull để chuyển đổi thành luồng đẩy Push-based thống nhất về VictoriaMetrics.
  prometheus:
    config:
      scrape_configs:
        - job_name: 'postgres-exporter'
          scrape_interval: 15s
          static_configs:
            - targets: ['psql-exporter:9187']
              labels:
                kubernetes_namespace: "controlplane"
                release: "controlplane"

        # [REDIS SCRAPER]: Dev exporter chỉ cào Shared L2; Auth Redis cần credential metrics riêng trong production.
        # Cơ chế hoạt động: Gửi request đến http://redis-exporter:9121/scrape?target=redis://...
        - job_name: 'redis-exporter'
          scrape_interval: 15s
          static_configs:
            - targets:
                - 'redis://cp-redis:6379'
          metrics_path: /scrape
          relabel_configs:
            # 1. Chuyển địa chỉ đích ban đầu thành tham số query "target" cho exporter
            - source_labels: [__address__]
              target_label: __param_target
            # 2. Gán nhãn "instance" bằng địa chỉ target thực tế để hiển thị đẹp trên dashboard
            - source_labels: [__param_target]
              target_label: instance
            # 3. Ghi đè địa chỉ đích thực sự mà collector sẽ gửi HTTP request tới là container redis-exporter
            - target_label: __address__
              replacement: 'redis-exporter:9121'

  # filelog đọc một canonical raw Docker path. Không tail đồng thời symlink của cùng inode vì
  # dual path tạo duplicate-ingestion ambiguity khi fingerprint/checkpoint được rebuild.
  file_log:
    start_at: end
    storage: file_storage
    # App logger bounds fields far below this limit. Truncate a pathological infra line rather
    # than split it into multiple fragments that look like independent structured events.
    max_log_size: 1MiB
    max_log_size_behavior: truncate
    include:
      - /var/lib/docker/containers/*/*-json.log
    exclude:
      - /var/lib/docker/containers/${env:HOSTNAME}*/*
    include_file_path: true
    operators:
      # 1. Parse JSON của log wrapper Docker (chuyển log thô thành attributes.log)
      - type: json_parser
        id: parser_docker
        on_error: send_quiet
      # 2. Đưa chuỗi log thực tế của app từ attributes.log vào trường body chính
      - type: move
        id: move_log_to_body
        from: attributes.log
        to: body
        on_error: send_quiet
      # 3. Parse tiếp JSON từ body (lúc này là log của app với các trường client_ip, level, msg...)
      - type: json_parser
        id: parser_app
        on_error: send_quiet
      # 3a. Nếu log là của Redis, parse bằng regex đặc thù
      - type: regex_parser
        id: parser_redis
        regex: '^(?P<pid>[0-9]+):(?P<role>[a-zA-Z]) (?P<time>[0-9]{2} [a-zA-Z]{3} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}) (?P<redis_level>[*#.-]) (?P<msg>.*?)\s*$'
        on_error: send_quiet
      # 3b. Nếu log là của PgBouncer hoặc Postgres, parse bằng regex đặc thù
      - type: regex_parser
        id: parser_pgbouncer
        regex: '^(?P<time>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}) (?P<tz>[A-Z]+) \[(?P<pid>[0-9]+)\] (?P<level>[A-Z]+):? (?P<msg>.*?)\s*$'
        on_error: send_quiet
      # 4. Đưa trường `msg` trong log app hoặc infra làm nội dung tin nhắn chính hiển thị ở body
      - type: move
        id: move_message_to_body
        from: attributes.message
        to: body
        on_error: send_quiet
      # 4b. Schema cũ của Go/infra dùng `msg`; Dataplane chuẩn hóa trên `message`.
      - type: move
        id: move_msg_to_body
        from: attributes.msg
        to: body
        on_error: send_quiet
      # 5. Trích xuất container_id từ canonical raw Docker path.
      - type: regex_parser
        id: extract_container_id
        regex: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/'
        parse_from: attributes["log.file.path"]
        on_error: send_quiet

processors:
  # [COMMENT]: Collector đơn trong Docker phải tự giới hạn RSS khi backend chậm;
  # application queue và persistent exporter queue vẫn là các boundary độc lập.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
  # [OPTIMIZATION & DATA SUSTAINABILITY]: Bộ lọc loại bỏ log rác từ chính hệ thống giám sát
  # Giúp tránh vòng lặp ghi log vô hạn (log loop) và tối ưu hóa dung lượng lưu trữ trên môi trường HA.
  filter/exclude_noise:
    error_mode: ignore
    logs:
      log_record:
        # Loại bỏ logs của Grafana (dạng logfmt bắt đầu bằng logger=)
        - IsMatch(body, "^logger=")
        # Loại bỏ logs của VictoriaMetrics, VictoriaLogs, VictoriaTraces chứa thư viện chung VictoriaMetrics@
        - IsMatch(body, "VictoriaMetrics@")
        # Loại bỏ logs từ module khởi chạy của VictoriaLogs
        - IsMatch(body, "VictoriaLogs/")
        # [OPTIMIZATION & DATA SUSTAINABILITY]: Loại bỏ log health check thành công (200 OK) của app để tránh log bloat.
        # Chỉ giữ lại log health check nếu status code khác 200 (khi hệ thống có sự cố) để phục vụ cảnh báo/giám sát.
        - IsMatch(attributes["route"], "^/api/v1/health/") and (attributes["status_code"] == 200 or attributes["status_code"] == "200")
        # [OPTIMIZATION]: Loại bỏ log kết nối thành công của health check nội bộ PgBouncer (mỗi 5s).
        # Chỉ loại bỏ log "login attempt" phát sinh từ localhost (127.0.0.1) của chính container pbouncer.
        - IsMatch(body, "login attempt:") and IsMatch(body, "@127\\.0\\.0\\.1")

  # Central and Zone have independent customer telemetry stores. Docker filelog
  # can see the whole development host, so Central discards records carrying
  # Zone/customer identity before export. Unlabelled MinIO/Stalwart infra logs
  # remain part of the Central operator plane. The separate metering pipeline
  # below receives reviewed metering envelopes for ClickHouse.
  filter/exclude_zone_runtime:
    error_mode: ignore
    logs:
      log_record:
        - attributes["zone_id"] != nil
        - attributes["service_name"] == "aurora-dataplane"
        - IsMatch(attributes["log_type"], "^zone-")
        - attributes["log_type"] == "metering"

  # Normalize application identity before export. Container IDs are deliberately
  # not used as stream dimensions: they change on every recreate/rollout.
  transform:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # JSON-looking application lines that failed parser_app remain raw in body. Preserve an
          # explicit diagnostic attribute instead of silently presenting them as structured logs.
          - set(log.attributes["app_json_parse_error"], true) where IsMatch(log.body, "^\\s*\\{") and log.attributes["level"] == nil
          # Third-party Docker logs have no application identity. Quarantine them
          # under one bounded stream instead of creating one stream per container.
          - set(log.attributes["service_name"], "infra") where log.attributes["service_name"] == nil
          # Xóa các thuộc tính siêu dữ liệu dư thừa từ filelog receiver và Docker.
          - delete_key(log.attributes, "log.file.name")
          - delete_key(log.attributes, "log.file.path")
          - delete_key(log.attributes, "stream")
          - delete_key(log.attributes, "detected_level")
          # Keep container_id only as a diagnostic attribute for the bounded
          # infra quarantine stream; it is never a Victoria stream field.
          - set(log.severity_text, "DEBUG") where log.attributes["level"] == "debug"
          - set(log.severity_number, 5) where log.attributes["level"] == "debug"
          - set(log.severity_text, "INFO") where log.attributes["level"] == "info"
          - set(log.severity_number, 9) where log.attributes["level"] == "info"
          - set(log.severity_text, "WARN") where log.attributes["level"] == "warn"
          - set(log.severity_number, 13) where log.attributes["level"] == "warn"
          - set(log.severity_text, "ERROR") where log.attributes["level"] == "error"
          - set(log.severity_number, 17) where log.attributes["level"] == "error"
          - set(log.severity_text, "INFO") where log.attributes["redis_level"] == "*"
          - set(log.severity_number, 9) where log.attributes["redis_level"] == "*"
          - set(log.severity_text, "WARN") where log.attributes["redis_level"] == "#"
          - set(log.severity_number, 13) where log.attributes["redis_level"] == "#"
          - set(log.severity_text, "DEBUG") where log.attributes["redis_level"] == "."
          - set(log.severity_number, 5) where log.attributes["redis_level"] == "."
          - set(log.severity_text, "VERBOSE") where log.attributes["redis_level"] == "-"
          - set(log.severity_number, 1) where log.attributes["redis_level"] == "-"
          - delete_key(log.attributes, "level") where log.attributes["level"] != nil
          - delete_key(log.attributes, "aurora_component")
          - delete_key(log.attributes, "event_id") where log.attributes["event_id"] == ""
          - delete_key(log.attributes, "operation_id") where log.attributes["operation_id"] == ""
          - delete_key(log.attributes, "source_domain") where log.attributes["source_domain"] == ""
          - delete_key(log.attributes, "kafka_topic") where log.attributes["kafka_topic"] == ""
          # filelog JSON values may reach OTTL as typed scalars or strings depending on
          # the source parser. Both representations are sentinel noise, not business data.
          - delete_key(log.attributes, "kafka_partition") where log.attributes["kafka_partition"] == -1 or log.attributes["kafka_partition"] == "-1"
          - delete_key(log.attributes, "kafka_offset") where log.attributes["kafka_offset"] == -1 or log.attributes["kafka_offset"] == "-1"
          - delete_key(log.attributes, "job_version") where log.attributes["job_version"] == 0 or log.attributes["job_version"] == "0"
          - delete_key(log.attributes, "suppressed_count") where log.attributes["suppressed_count"] == 0 or log.attributes["suppressed_count"] == "0"
          - delete_key(log.attributes, "retryable") where log.attributes["retryable"] == false or log.attributes["retryable"] == "false"
          - delete_key(log.attributes, "duration_ms") where log.attributes["duration_ms"] == 0 or log.attributes["duration_ms"] == "0"
          - delete_key(log.attributes, "leader_fencing_token") where log.attributes["leader_fencing_token"] == 0 or log.attributes["leader_fencing_token"] == "0"
          - delete_key(log.attributes, "fencing_token") where log.attributes["fencing_token"] == 0 or log.attributes["fencing_token"] == "0"
          - delete_key(log.attributes, "runtime_generation") where log.attributes["runtime_generation"] == 0 or log.attributes["runtime_generation"] == "0"
          - delete_key(log.attributes, "slot") where log.attributes["slot"] == 0 or log.attributes["slot"] == "0"
          - delete_key(log.attributes, "assignment_epoch") where log.attributes["assignment_epoch"] == 0 or log.attributes["assignment_epoch"] == "0"
          - delete_key(log.attributes, "trace_id") where log.attributes["trace_id"] == ""
          - delete_key(log.attributes, "span_id") where log.attributes["span_id"] == ""
          - delete_key(log.attributes, "error") where log.attributes["error"] == ""

  # transform/metering: storage is one module-owned projection of the generic
  # metering envelope. It never logs raw Authorization and only parses the
  # bounded bucket segment needed by the legacy Central projection.
  transform/metering:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - merge_maps(log.attributes, ExtractPatterns(log.attributes["path"], "^/(?P<bucket_name>[^/]+)"), "upsert") where log.attributes["path"] != nil and ((log.attributes["log_type"] == "metering" and log.attributes["module"] == "storage" and log.attributes["metering_schema"] == "storage.access.completed.v1") or log.attributes["log_type"] == "envoy-storage-access")

  # The generic envelope filter is stable as new metering modules are added.
  # The legacy value remains accepted during Central ClickHouse migration.
  filter/only_metering:
    error_mode: ignore
    logs:
      log_record:
        - attributes["log_type"] != "metering" and attributes["log_type"] != "envoy-storage-access"

exporters:
  clickhouse:
    endpoint: "tcp://clickhouse:9000"
    database: "otlp"
    ttl: 168h
  debug:
    verbosity: basic
  # Exporter gửi dữ liệu metrics sang VictoriaMetrics bằng chuẩn Remote Write
  prometheus_remote_write:
    endpoint: "http://victoriametrics:8428/api/v1/write"
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
  # Exporter gửi dữ liệu logs sang VictoriaLogs bằng chuẩn OTLP HTTP
  otlp_http/victorialogs:
    endpoint: "http://victorialogs:9428/insert/opentelemetry"
    headers:
      "VL-Stream-Fields": "service_name"
      "VL-Ignore-Fields": "scope.name,scope.version"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
      storage: file_storage
    tls:
      insecure: true
  # Exporter gửi dữ liệu traces sang VictoriaTraces bằng chuẩn OTLP HTTP
  # [VictoriaTraces Integration]: Đóng vai trò làm backend lưu trữ traces cho hệ thống
  otlp_http/victoriatraces:
    endpoint: "http://victoriatraces:10428/insert/opentelemetry"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
      storage: file_storage
    tls:
      insecure: true

service:
  extensions: [docker_observer, file_storage]
  pipelines:
    # Pipeline traces nhận log qua OTLP gRPC/HTTP và xuất sang VictoriaTraces
    # [VictoriaTraces Integration]: Nhận traceparent phân tán từ các microservices
    # (Đã loại bỏ exporter debug để tránh spam console log)
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/victoriatraces]
    # Pipeline metrics (Đã loại bỏ exporter debug)
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus_remote_write]
    # Pipeline logs (Đã loại bỏ exporter debug)
    logs:
      receivers: [otlp, file_log]
      # Bổ sung filter/exclude_noise trước transform để lọc bỏ log rác ngay khi nhận được
      processors: [memory_limiter, filter/exclude_noise, transform, filter/exclude_zone_runtime, batch]
      exporters: [otlp_http/victorialogs]

    # Pipeline logs/metering: nhận envelope chung; module-owned projections
    # decide which fields are valid for ClickHouse.
    logs/metering:
      receivers: [file_log]
      processors: [memory_limiter, transform, filter/only_metering, transform/metering, batch]
      exporters: [clickhouse]
