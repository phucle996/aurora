name: aurora-central-dev

services:

  controlplane1:
    cpuset: "0-5"
    build:
      context: ../../controlplane
      # Chạy Dockerfile.prod: biên dịch Go binary tĩnh (CGO_ENABLED=0), image runtime chỉ ~30MB.
      # Không có hot-reload. Khi cần rebuild dùng đúng Central file:
      # `docker compose -f dev/central/compose.yml up -d --build` từ repo root.
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: central-controlplane-1
    init: true
    env_file:
      - ../../controlplane/.env
    volumes:
      # Mount TLS certs vào đúng path mà binary prod đọc (xem GRPC_TLS_* trong .env).
      - ../shared/tls:/etc/controlplane/tls:ro
      # Binary prod chạy với WORKDIR /var/lib/controlplane và đọc policy tại
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
      acr-redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
      vault:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane2:
    cpuset: "0-5"
    build:
      context: ../../controlplane
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: central-controlplane-2
    init: true
    env_file:
      - ../../controlplane/.env
    volumes:
      - ../shared/tls:/etc/controlplane/tls:ro
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
      acr-redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
      vault:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane3:
    cpuset: "0-5"
    build:
      context: ../../controlplane
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: central-controlplane-3
    init: true
    env_file:
      - ../../controlplane/.env
    volumes:
      - ../shared/tls:/etc/controlplane/tls:ro
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
      acr-redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
      vault:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  envoy:
    cpuset: "0-5"
    image: envoyproxy/envoy:v1.38.3
    container_name: central-envoy
    command: [ "envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info" ]
    volumes:
      # Cung cấp cấu hình định tuyến tĩnh và động v3 API cho Envoy.
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/routes:/etc/envoy/routes:ro
      # Cung cấp chứng chỉ SSL chất lượng cao phục vụ TLS termination tại Edge.
      - ../shared/tls/grpc-server.crt:/etc/envoy/tls/tls.crt:ro
      - ../shared/tls/grpc-server.key:/etc/envoy/tls/tls.key:ro
      # Local single-Zone mTLS material. Production uses a dedicated workload
      # identity Secret and a private Zone endpoint.
      - ../shared/tls/grpc-server.crt:/etc/envoy/zone-control/tls.crt:ro
      - ../shared/tls/grpc-server.key:/etc/envoy/zone-control/tls.key:ro
      - ../shared/tls/grpc-server.crt:/etc/envoy/zone-control/ca.crt:ro
    ports:
      - "80:8080" # Cổng HTTP tiêu chuẩn định tuyến đến Cloud UI/Admin UI
      - "443:443" # Cổng HTTPS bảo mật terminate TLS cho các giao tiếp an toàn (đã chuyển listener port của container sang 443)
      - "28000:8080" # Cổng gRPC / API Gateway phục vụ các ứng dụng khách bên ngoài
      - "29901:9901" # Cổng Envoy Administration & Statistics Dashboard để giám sát hiệu năng
    depends_on:
      controlplane1:
        condition: service_started
      controlplane2:
        condition: service_started
      controlplane3:
        condition: service_started
    networks:
      default:
        aliases:
          - controlplane.aurora.local
    restart: unless-stopped

  clickhouse:
    cpuset: "0-5"
    image: clickhouse/clickhouse-server:latest
    container_name: central-clickhouse
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ports:
      - "18123:8123" # Cổng HTTP interface để push logs & query debug
      - "19000:9000" # Cổng native protocol của ClickHouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  psql:
    cpuset: "0-5"
    image: postgres:18
    container_name: central-controlplane-postgres
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10" ]
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # PostgreSQL 17 defaults to scram-sha-256 — aligned with PgBouncer AUTH_TYPE below.
    ports:
      - "15434:5432" # Direct debug port for schema migrations and heavy queries
    volumes:
      # Sử dụng named volume để lưu trữ dữ liệu bền vững, tránh mất mát dữ liệu khi container bị hủy.
      - controlplane_psql_data:/var/lib/postgresql
      # [SECURITY]: Mount script khởi tạo tài khoản giám sát postgres_exporter với phân quyền tối thiểu (Least Privilege).
      - ./postgres/init-monitoring.sql:/docker-entrypoint-initdb.d/init-monitoring.sql:ro
    healthcheck:
      # Thực thi pg_isready định kỳ để đảm bảo DB chỉ nhận kết nối khi đã sẵn sàng hoàn toàn.
      test: [ "CMD-SHELL", "pg_isready -U postgres -d controlplane" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  changefeed-init:
    cpuset: "0-5"
    image: postgres:18
    environment:
      PGHOST: psql
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: controlplane
      PUBLICATION_NAME: outbox_pub
      REPLICATION_SLOT_NAME: outbox_slot
    volumes:
      - ./postgres/provision-changefeed.sh:/usr/local/bin/provision-changefeed.sh:ro
    entrypoint: [ "/bin/sh", "/usr/local/bin/provision-changefeed.sh" ]
    depends_on:
      psql:
        condition: service_healthy
    restart: "no"

  billing-psql:
    cpuset: "0-5"
    image: postgres:18
    container_name: central-billing-postgres
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing_admin
      POSTGRES_PASSWORD: billing_secure_password
    ports:
      - "15435:5432" # Direct debug port for billing migrations
    volumes:
      - billing_psql_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U billing_admin -d billing" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cost-manager:
    cpuset: "0-5"
    build:
      context: ../../cost-manager
      dockerfile: Dockerfile.dev
    container_name: central-cost-manager
    ports:
      - "8084:8084" # REST API port
      - "9094:9094" # gRPC port
    # API and embedded Engine identities live in this app-owned file. The API
    # remaps VAULT_ENGINE_TOKEN only for the Engine child process.
    env_file:
      - ../../cost-manager/api/.env
    volumes:
      - ../../cost-manager/api:/app/api
    depends_on:
      billing-psql:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
      acr-redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      vault:
        condition: service_started
    restart: unless-stopped

  pbouncer:
    cpuset: "0-5"
    image: edoburu/pgbouncer:latest
    container_name: central-pgbouncer
    environment:
      - LISTEN_PORT=6432
      - DB_HOST=psql
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=controlplane
      - POOL_MODE=transaction
      # ================================================================
      # SECURITY: scram-sha-256 — native PostgreSQL 17 auth protocol.
      # AUTH_QUERY lets PgBouncer fetch the scram verifier directly from
      # pg_shadow, bypassing the MD5 userlist.txt mismatch entirely.
      # AUTH_USER must be a superuser (or pg_shadow member) to run the query.
      # ================================================================
      - AUTH_TYPE=scram-sha-256
      - AUTH_USER=postgres
      - AUTH_QUERY=SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - STATS_PERIOD=3600
    ports:
      - "15433:6432" # Transparent host port replacement for developer tools
    depends_on:
      psql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-d", "controlplane", "-U", "postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  psql-exporter:
    cpuset: "0-5"
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: central-postgres-exporter
    environment:
      # [SECURITY]: Chuỗi kết nối sử dụng tài khoản postgres_exporter chuyên dụng có quyền pg_monitor.
      # Không sử dụng tài khoản root 'postgres' để đảm bảo tuân thủ tiêu chuẩn an ninh thông tin.
      - DATA_SOURCE_URI=psql:5432/controlplane?sslmode=disable
      - DATA_SOURCE_USER=postgres_exporter
      - DATA_SOURCE_PASS=postgres_exporter_password
      # [OPTIMIZATION]: Tối ưu hóa tần suất truy vấn và phòng ngừa lỗi cạn kiệt pool kết nối (Connection Exhaustion).
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=true # Đặt true để tắt collector mặc định vì đã tự định nghĩa pg_settings.
      - PG_EXPORTER_AUTO_DISCOVER_DATABASES=false # Chỉ giám sát db controlplane để hạn chế số lượng active backends.
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./postgres/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      psql:
        condition: service_healthy
    restart: unless-stopped
    command: [ "--disable-default-metrics", "--no-collector.database", "--no-collector.locks", "--no-collector.replication", "--no-collector.replication_slot", "--no-collector.roles", "--no-collector.stat_bgwriter", "--no-collector.stat_database", "--no-collector.stat_progress_vacuum", "--no-collector.stat_user_tables", "--no-collector.statio_user_tables", "--no-collector.wal" ]

  redis-exporter:
    cpuset: "0-5"
    image: oliver006/redis_exporter:v1.85.0
    container_name: central-redis-exporter
    command: [ "-redis.addr=redis://cp-redis:6379" ]
    environment:
      # [COMMENT]: Exporter chỉ scrape rebuildable Shared L2; không được cấp credential Auth Redis.
      - REDIS_ADDR=redis://cp-redis:6379
    depends_on:
      cp-redis:
        condition: service_healthy
    restart: unless-stopped

  acr-redis:
    cpuset: "0-5"
    image: redis:8.8.0
    container_name: central-auth-redis
    # [COMMENT]: DB 0 duy nhất tương thích Redis Cluster; prefix + ACL cô lập session và authz projection.
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--aclfile", "/usr/local/etc/redis/users.acl" ]
    ports:
      - "16380:6379" # Port core Redis dùng cho Identity Sessions và Rate Limiting của ACR
    volumes:
      - controlplane_acr_redis_data:/data
      - ./redis/auth-users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "health", "--pass", "aurora-dev-health-secret", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cp-redis:
    cpuset: "0-5"
    image: redis:8.8.0
    container_name: central-shared-redis
    # [COMMENT]: AOF phục hồi bounded Stream sau restart; volatile-lru chỉ được
    # evict cache key có TTL, không được xóa stream entry đang chờ consumer.
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru" ]
    ports:
      - "16381:6379" # Port dùng cho L2 Cache của Controlplane
    volumes:
      - controlplane_cp_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    cpuset: "0-5"
    image: nats:2.10-alpine
    container_name: central-nats-core
    # [COMMENT]: Central transport is NATS Core only. Enabling JetStream here
    # would blur it with the independent Zone KV database.
    command: [ "-m", "8222" ]
    ports:
      - "4222:4222" # Port client kết nối NATS
      - "8222:8222" # Port monitor NATS HTTP
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "4222" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      default:
      # Only NATS Core crosses the Central/Zone dev boundary. Zone JetStream KV
      # remains on the Zone-private network and has a different credential path.
      aurora-transport:
        aliases:
          - nats
    restart: unless-stopped

  # [COMMENT]: Dev local chạy 1 combined broker/controller KRaft; replication=1 để tiết kiệm tài nguyên CPU.
  kafka-1:
    cpuset: "0-5"
    image: apache/kafka:3.9.0
    container_name: central-kafka-1
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      # [COMMENT]: Quorum voter chỉ bao gồm single node kafka-1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # [COMMENT]: Cấu hình 1-node replication factor và ISR cho local dev
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      # [COMMENT]: Giảm log rác của Kafka ở môi trường local dev (chuyển Log level sang WARN)
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_LOG4J_LOGGERS: "kafka=WARN,kafka.controller=WARN,kafka.log.LogCleaner=WARN,state.change.logger=WARN"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "19092:19092"
    volumes:
      - controlplane_kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      default:
      # Kafka is the only durable Central/Zone transport exposed to the Zone
      # stack. Infrastructure services are intentionally not attached here.
      aurora-transport:
        aliases:
          - kafka-1
    restart: unless-stopped

  # [COMMENT]: Topic provisioning cho Single-node Kafka trong môi trường Dev.
  kafka-init:
    cpuset: "0-5"
    image: apache/kafka:3.9.0
    container_name: central-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        BOOTSTRAP="kafka-1:9092"
        create_topic() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" \
            --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1 \
            --config min.insync.replicas=1
        }
        create_topic aurora.jobs.commands.zone.019f3d3e-997d-7894-9236-c5122634cb4f.v1 6
        create_topic aurora.jobs.results.v1 12
        create_topic aurora.jobs.dlq.v1 6
        create_topic aurora.zone.metadata.queries.v1 6
        create_topic aurora.zone.reports.v1 6
        create_topic aurora.storage.sizes.v1 6
        create_topic aurora.iam.account-verification.v1 6
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" \
          --create --if-not-exists \
          --topic aurora.zone.metadata.019f3d3e-997d-7894-9236-c5122634cb4f.v1 \
          --partitions 1 --replication-factor 1 \
          --config cleanup.policy=compact --config min.insync.replicas=1
    restart: "no"

  kafka-ui:
    cpuset: "0-5"
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: central-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: "aurora-dev"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:9092"
      KAFKA_CLUSTERS_0_READONLY: "true"
    ports:
      - "18080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  otel-collector:
    cpuset: "0-5"
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: central-otel-collector
    # Chạy với quyền root (0:0) để có quyền đọc file logs trong /var/lib/docker/containers
    user: "0:0"
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      # Nạp tệp cấu hình các receivers, processors, và exporters của OpenTelemetry.
      - ./otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
      # Gắn thư mục chứa logs của Docker container để filelog đọc trực tiếp log file
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # [COMMENT]: Mount docker.sock để OpenTelemetry Collector giao tiếp với Docker Daemon truy vấn container metadata.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Filelog checkpoints survive collector restarts to bound duplicate/lost ingestion.
      - controlplane_otel_file_storage:/var/lib/otelcol/file_storage
    ports:
      - "14317:4317" # Cổng nhận OpenTelemetry gRPC Traces & Metrics
      - "14318:4318" # Cổng nhận OpenTelemetry HTTP Traces & Metrics
    depends_on:
      victoriatraces:
        condition: service_started
      clickhouse:
        condition: service_started
    restart: unless-stopped

  victoriatraces:
    cpuset: "0-5"
    image: victoriametrics/victoria-traces:latest
    container_name: central-victoriatraces
    command:
      - "-storageDataPath=/vtraces"
      - "-httpListenAddr=:10428"
    volumes:
      - controlplane_vtraces_data:/vtraces
    ports:
      - "10428:10428" # Cổng OTLP ingestion & Jaeger-compatible query API
    restart: unless-stopped

  victoriametrics:
    cpuset: "0-5"
    image: victoriametrics/victoria-metrics:latest
    container_name: central-victoriametrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    volumes:
      - controlplane_vmetrics_data:/victoria-metrics-data
    ports:
      - "8428:8428" # Cổng Remote Write và query API của VictoriaMetrics
    restart: unless-stopped

  victorialogs:
    cpuset: "0-5"
    image: victoriametrics/victoria-logs:latest
    container_name: central-victorialogs
    command:
      - "-storageDataPath=/vlogs"
      - "-httpListenAddr=:9428"
    volumes:
      - controlplane_vlogs_data:/vlogs
    ports:
      - "9428:9428" # Cổng OTLP logs ingestion & querying API
    restart: unless-stopped

  grafana:
    cpuset: "0-5"
    image: grafana/grafana:11.6
    container_name: central-grafana
    environment:
      # Tài khoản quản trị tối cao của hệ thống Dashboard Grafana
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false" # Khóa tính năng tự đăng ký để bảo đảm an ninh mạng nội bộ
      # Tự động tải và cài đặt plugin của VictoriaMetrics để truy vấn logs, và plugin Redis để giám sát cache/queues
      GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource,redis-datasource"
    volumes:
      - controlplane_grafana_data:/var/lib/grafana
      # Tự động nạp sẵn các Data Sources (Loki, Tempo, Prometheus) và các Dashboards tiêu chuẩn.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "13001:3000" # Cổng UI chính thức của Grafana để giám sát và phân tích toàn hệ thống
    depends_on:
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      otel-collector:
        condition: service_started
      victoriatraces:
        condition: service_started
      vault:
        condition: service_started
    restart: unless-stopped

  cloud-console:
    cpuset: "0-5"
    build:
      context: ../../cloud-console
      dockerfile: Dockerfile.prod
    container_name: central-cloud-console
    # Runtime browser configuration is owned by Cloud Console. The public
    # values are loaded from its own .env and are also consumed by its Docker
    # build stage because Next.js bakes them into the static client bundle.
    env_file:
      - ../../cloud-console/.env
    restart: unless-stopped

  admin-ui-nginx:
    cpuset: "0-5"
    build:
      context: ../../admin-ui
      dockerfile: Dockerfile.nginx
    container_name: central-admin-ui
    ports:
      - "5175:5173"
    restart: unless-stopped

  cost-console-nginx:
    cpuset: "0-5"
    build:
      context: ../../cost-console
      dockerfile: Dockerfile.nginx
      args:
        # [DEV-ONLY]: Starting Billing from Cost Console must return to the
        # same localhost Cloud Console origin used by OAuth.
        VITE_CLOUD_CONSOLE_URL: https://localhost
    container_name: central-cost-console
    ports:
      - "5176:5173"
    restart: unless-stopped

  job-orchestrator:
    cpuset: "0-5"
    build:
      context: ../..
      dockerfile: job-orchestrator/Dockerfile
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: central-job-orchestrator
    init: true
    volumes:
      - ../shared/tls:/etc/job-orchestrator/tls:ro
    # One reviewed development profile keeps Compose readable. Production
    # injects the same contract from ConfigMap/Secret plus mounted TLS identity.
    env_file:
      - ../../job-orchestrator/.env
    environment:
      VAULT_TOKEN: "${VAULT_JOB_ORCHESTRATOR_TOKEN:-aurora-dev-job-orchestrator-token}"
    depends_on:
      psql:
        condition: service_healthy
      changefeed-init:
        condition: service_completed_successfully
      cp-redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
      vault:
        condition: service_started
    restart: unless-stopped

  centrifugo:
    cpuset: "0-5"
    image: centrifugo/centrifugo:v5
    container_name: central-centrifugo
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    command: centrifugo --config /centrifugo/config.json
    # Chỉ sử dụng API Key cho Server-to-Server communication (gửi message), xác thực kết nối khách hàng đã được ủy quyền cho Connect Proxy.
    environment:
      - CENTRIFUGO_API_KEY=your_centrifugo_api_key_secret
      # OpenTelemetry: Kết nối Centrifugo tới OTel Collector để sinh spans phục vụ distributed tracing E2E
      - CENTRIFUGO_OPENTELEMETRY=1
      - CENTRIFUGO_OPENTELEMETRY_API=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  acr:
    cpuset: "0-5"
    build:
      context: ../../acr
      dockerfile: Dockerfile
    container_name: central-acr
    init: true
    # [COMMENT]: Mount chứng chỉ TLS để thiết lập kết nối mTLS bảo mật đến các node Controlplane
    volumes:
      - ../shared/tls:/etc/acr/tls:ro
    env_file:
      - ../../acr/.env
    depends_on:
      acr-redis:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
      vault:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  notification-service:
    cpuset: "0-5"
    build:
      context: ../../notification-service
      dockerfile: Dockerfile
    container_name: central-notification-service
    ports:
      - "8083:8083"
    env_file:
      - ../../notification-service/.env
    depends_on:
      centrifugo:
        condition: service_started
      cp-redis:
        condition: service_healthy
      scylla:
        condition: service_healthy
      otel-collector:
        condition: service_started
      vault:
        condition: service_started
    restart: unless-stopped

  scylla:
    cpuset: "0-5"
    image: scylladb/scylla:2026.2.1
    container_name: central-timeline-scylla
    command:
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"
    ports:
      - "9042:9042"
    volumes:
      - controlplane_timeline_scylla_data:/var/lib/scylla
    # [COMMENT]: Healthcheck kiểm tra khả năng phục vụ truy vấn CQL trên Scylla DB mà không gán cứng 127.0.0.1 (tránh connection error khi Scylla bind eth0)
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh --no-color -e 'SELECT now() FROM system.local' >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  vault:
    cpuset: "0-5"
    image: hashicorp/vault:2.0
    container_name: central-vault
    # [COMMENT]: Cấu hình Vault ở chế độ Dev Mode cho môi trường Local Dev.
    # Tự động Unseal khi khởi động và tự động gán Root Token cố định là 'root'
    # giúp tránh lỗi 503 Sealed và không cần thao tác init/unseal thủ công.
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: ["server", "-dev"]
    ports:
      - "8200:8200"
    # [COMMENT]: Healthcheck kiểm tra trạng thái hoạt động của Vault REST API
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  controlplane_vault_data: # [COMMENT]: Lưu trữ dữ liệu Raft bền vững của Vault
    name: controlplane_controlplane_vault_data
  controlplane_psql_data: # Thư mục chứa tệp dữ liệu vật lý của PostgreSQL
    name: controlplane_controlplane_psql_data
  controlplane_acr_redis_data:
    name: controlplane_controlplane_acr_redis_data
  controlplane_cp_redis_data:
    name: controlplane_controlplane_cp_redis_data
  controlplane_vmetrics_data: # Cơ sở dữ liệu chuỗi thời gian của VictoriaMetrics
    name: controlplane_controlplane_vmetrics_data
  controlplane_vtraces_data: # Bộ đệm dữ liệu traces của VictoriaTraces
    name: controlplane_controlplane_vtraces_data
  controlplane_vlogs_data: # Bộ đệm dữ liệu logs của VictoriaLogs
    name: controlplane_controlplane_vlogs_data
  controlplane_otel_file_storage: # Checkpoint offset/fingerprint của OTel filelog receiver
    name: controlplane_controlplane_otel_file_storage
  controlplane_grafana_data: # Cache node_modules cho các ứng dụng Front-end để tối ưu hóa hiệu suất khởi chạy
    name: controlplane_controlplane_grafana_data
  controlplane_timeline_scylla_data:
    name: controlplane_controlplane_timeline_scylla_data
  controlplane_kafka_1_data:
    name: controlplane_controlplane_kafka_1_data
  clickhouse_data:
    name: controlplane_clickhouse_data
  billing_psql_data:
    name: controlplane_billing_psql_data

networks:
  aurora-transport:
    # Central owns creation of the local transport network. The Zone compose
    # declares it external, so Central must be started first and each stack can
    # otherwise be operated independently.
    name: aurora-dev-transport
