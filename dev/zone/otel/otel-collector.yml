extensions:
  # Filelog offsets and exporter queues survive a collector restart. This is
  # diagnostic durability only; Kafka/result state remains authoritative.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
  file_storage/metering:
    directory: /var/lib/otelcol/metering_file_storage
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # MinIO owns physical usage observation. The collector scrapes only the
  # reviewed bucket gauges and sends them to Zone VictoriaMetrics; no object
  # path, credential, audit event or Central identity enters this pipeline.
  prometheus/minio_bucket:
    config:
      scrape_configs:
        - job_name: minio-bucket-runtime
          scrape_interval: 15s
          scrape_timeout: 5s
          metrics_path: /minio/v2/metrics/bucket
          scheme: http
          static_configs:
            - targets: ["minio:9000"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "minio_bucket_usage_total_bytes|minio_bucket_usage_object_total"
              action: keep
            - source_labels: [bucket]
              regex: "(ws|tn)-[a-z0-9-]{1,60}"
              action: keep

  # Docker development lacks the Kubernetes namespace filesystem boundary.
  # Read the canonical Docker path once and reject every non-Zone record in a
  # bounded processor before it can reach Zone VictoriaLogs.
  file_log:
    start_at: end
    storage: file_storage
    max_log_size: 1MiB
    max_log_size_behavior: truncate
    include:
      - /var/lib/docker/containers/*/*-json.log
    exclude:
      - /var/lib/docker/containers/${env:HOSTNAME}*/*
    include_file_path: true
    operators:
      - type: json_parser
        id: parser_docker
        on_error: send_quiet
      - type: move
        id: move_log_to_body
        from: attributes.log
        to: body
        on_error: send_quiet
      - type: json_parser
        id: parser_app
        on_error: send_quiet
      - type: move
        id: move_message_to_body
        from: attributes.message
        to: body
        on_error: send_quiet
      - type: move
        id: move_msg_to_body
        from: attributes.msg
        to: body
        on_error: send_quiet

  file_log/storage_metering:
    start_at: end
    storage: file_storage/metering
    max_log_size: 1MiB
    max_log_size_behavior: truncate
    include:
      - /var/lib/docker/containers/*/*-json.log
    exclude:
      - /var/lib/docker/containers/${env:HOSTNAME}*/*
    include_file_path: true
    operators:
      - type: json_parser
        id: metering_parser_docker
        on_error: send_quiet
      - type: move
        id: metering_move_log_to_body
        from: attributes.log
        to: body
        on_error: send_quiet
      - type: json_parser
        id: metering_parser_app
        on_error: send_quiet
      - type: move
        id: metering_move_message_to_body
        from: attributes.message
        to: body
        on_error: send_quiet
      - type: move
        id: metering_move_msg_to_body
        from: attributes.msg
        to: body
        on_error: send_quiet

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

  transform/zone_identity:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # The collector owns the Zone identity for every metering event. The
          # producer cannot make a cross-Zone event by choosing this field.
          - set(log.attributes["zone_id"], "${env:ZONE_ID}") where log.attributes["log_type"] == "metering"
          - set(log.attributes["zone_id"], "${env:ZONE_ID}") where IsMatch(log.attributes["target"], "^zone_control::")
          - set(log.attributes["service_name"], "aurora-zone-control") where IsMatch(log.attributes["target"], "^zone_control::")
          - set(log.attributes["log_type"], "zone-control") where IsMatch(log.attributes["target"], "^zone_control::")
          - set(log.attributes["aurora_zone_id"], "${env:ZONE_ID}") where log.attributes["aurora_module"] != nil
          - set(resource.attributes["aurora.component.scope"], "zone") where log.attributes["zone_id"] != nil
          - set(resource.attributes["aurora.zone.id"], log.attributes["zone_id"]) where log.attributes["zone_id"] != nil
          # Unknown Zone/infra records share one bounded quarantine stream. Never
          # derive a stream label from a container, pod or customer resource ID.
          - set(log.attributes["service_name"], "infra") where log.attributes["service_name"] == nil
          - set(log.severity_text, "DEBUG") where log.attributes["level"] == "debug"
          - set(log.severity_number, 5) where log.attributes["level"] == "debug"
          - set(log.severity_text, "INFO") where log.attributes["level"] == "info"
          - set(log.severity_number, 9) where log.attributes["level"] == "info"
          - set(log.severity_text, "WARN") where log.attributes["level"] == "warn"
          - set(log.severity_number, 13) where log.attributes["level"] == "warn"
          - set(log.severity_text, "ERROR") where log.attributes["level"] == "error"
          - set(log.severity_number, 17) where log.attributes["level"] == "error"
          - delete_key(log.attributes, "log.file.name")
          - delete_key(log.attributes, "log.file.path")
          - delete_key(log.attributes, "stream")
          - delete_key(log.attributes, "level") where log.attributes["level"] != nil
          - delete_key(log.attributes, "event_id") where log.attributes["event_id"] == ""
          - delete_key(log.attributes, "operation_id") where log.attributes["operation_id"] == ""
          - delete_key(log.attributes, "source_domain") where log.attributes["source_domain"] == ""
          - delete_key(log.attributes, "kafka_topic") where log.attributes["kafka_topic"] == ""
          # filelog can preserve JSON scalars as strings; cover both forms so a
          # restart loop cannot amplify default-value noise in Zone VictoriaLogs.
          - delete_key(log.attributes, "kafka_partition") where log.attributes["kafka_partition"] == -1 or log.attributes["kafka_partition"] == "-1"
          - delete_key(log.attributes, "kafka_offset") where log.attributes["kafka_offset"] == -1 or log.attributes["kafka_offset"] == "-1"
          - delete_key(log.attributes, "job_version") where log.attributes["job_version"] == 0 or log.attributes["job_version"] == "0"
          - delete_key(log.attributes, "suppressed_count") where log.attributes["suppressed_count"] == 0 or log.attributes["suppressed_count"] == "0"
          - delete_key(log.attributes, "retryable") where log.attributes["retryable"] == false or log.attributes["retryable"] == "false"
          - delete_key(log.attributes, "duration_ms") where log.attributes["duration_ms"] == 0 or log.attributes["duration_ms"] == "0"
          - delete_key(log.attributes, "leader_fencing_token") where log.attributes["leader_fencing_token"] == 0 or log.attributes["leader_fencing_token"] == "0"
          - delete_key(log.attributes, "fencing_token") where log.attributes["fencing_token"] == 0 or log.attributes["fencing_token"] == "0"
          - delete_key(log.attributes, "runtime_generation") where log.attributes["runtime_generation"] == 0 or log.attributes["runtime_generation"] == "0"
          - delete_key(log.attributes, "slot") where log.attributes["slot"] == 0 or log.attributes["slot"] == "0"
          - delete_key(log.attributes, "assignment_epoch") where log.attributes["assignment_epoch"] == 0 or log.attributes["assignment_epoch"] == "0"
          - delete_key(log.attributes, "trace_id") where log.attributes["trace_id"] == ""
          - delete_key(log.attributes, "span_id") where log.attributes["span_id"] == ""
          - delete_key(log.attributes, "error") where log.attributes["error"] == ""

  filter/only_zone_runtime:
    error_mode: ignore
    logs:
      log_record:
        # Drop a record unless it carries the Dataplane Zone identity or is a
        # reviewed Zone metering envelope or Zone-prefixed access schema. This
        # prevents the two Docker collectors from duplicating Central logs into
        # the customer store.
        - attributes["service_name"] != "aurora-dataplane" and attributes["log_type"] == nil
        - attributes["service_name"] != "aurora-dataplane" and attributes["log_type"] != nil and attributes["log_type"] != "metering" and not IsMatch(attributes["log_type"], "^zone-")

  # The envelope filter is intentionally module-agnostic. Module-owned
  # ClickHouse projections validate `module` and `metering_schema` separately.
  filter/only_metering:
    error_mode: ignore
    logs:
      log_record:
        - attributes["log_type"] != "metering"

  batch:

exporters:
  prometheus_remote_write:
    endpoint: "http://zone-victoriametrics:8428/api/v1/write"
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

  otlp_http/victorialogs:
    endpoint: "http://zone-victorialogs:9428/insert/opentelemetry"
    headers:
      "VL-Stream-Fields": "service_name"
      "VL-Ignore-Fields": "scope.name,scope.version"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
      storage: file_storage
    tls:
      insecure: true

  otlp_http/victoriatraces:
    endpoint: "http://zone-victoriatraces:10428/insert/opentelemetry"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
      storage: file_storage
    tls:
      insecure: true

  # This is Zone-local metering journal ingestion only. It never sends data to
  # the Central collector or Central ClickHouse.
  clickhouse/metering:
    endpoint: "tcp://zone-clickhouse:9000"
    database: "otlp"
    ttl: 168h

service:
  extensions: [file_storage, file_storage/metering]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/victoriatraces]
    metrics:
      receivers: [otlp, prometheus/minio_bucket]
      processors: [memory_limiter, batch]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [file_log]
      processors: [memory_limiter, transform/zone_identity, filter/only_zone_runtime, batch]
      exporters: [otlp_http/victorialogs]
    logs/metering:
      receivers: [file_log/storage_metering]
      processors: [memory_limiter, transform/zone_identity, filter/only_zone_runtime, filter/only_metering, batch]
      exporters: [clickhouse/metering]
