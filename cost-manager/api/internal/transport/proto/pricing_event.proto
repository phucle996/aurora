syntax = "proto3";

package billing.pricing.v1;

option go_package = "cost-manager/api/internal/transport/proto/pricingproto";

// TierVersionPublished chỉ mang identity/version; Engine luôn load full immutable snapshot từ PostgreSQL.
message TierVersionPublished {
  string event_id = 1;
  string tier_id = 2;
  string tier_version_id = 3;
  int32 version_number = 4;
  string service_type = 5;
  int64 effective_from_unix_ms = 6;
  string checksum = 7;
  int64 occurred_at_unix_ms = 8;
}
