syntax = "proto3";
package billing.rpc;

option go_package = "./billingauthproto";

message VerifyBillingCredentialsRequest {
  string employee_code = 1;
  string secret_key = 2;
}

message VerifyBillingCredentialsResponse {
  bool valid = 1;
  string user_id = 2;
  string role_id = 3;
  int32 level = 4;
  string error_message = 5;
  string employee_code = 6;
}
