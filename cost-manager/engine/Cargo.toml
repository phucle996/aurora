[package]
name = "cost-manager-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "bigdecimal"] }
# [COMMENT]: Đồng nhất với các service khác (dataplane, job-orchestrator). TLS Redis do infrastructure (mesh/proxy) xử lý.
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
prost = "0.12"
time = { version = "0.3", features = ["serde"] }
# [COMMENT]: Moka giữ immutable historical versions; ArcSwap đổi active catalog theo COW tại safe point.
moka = { version = "0.12", features = ["future"] }
arc-swap = "1.7"
sha2 = "0.10"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
prost-build = "0.12"
protoc-bin-vendored = "3"
