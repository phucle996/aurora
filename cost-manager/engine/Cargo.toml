[package]
name = "cost-manager-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
clickhouse = { version = "0.13", features = ["uuid", "chrono"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "bigdecimal"] }
redis = { version = "0.28", features = ["tokio-comp", "tls-rustls"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.10", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
