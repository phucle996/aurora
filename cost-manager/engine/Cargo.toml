[package]
name = "cost-manager-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
clickhouse = { version = "0.13", features = ["uuid", "chrono", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "bigdecimal"] }
# [COMMENT]: Đồng nhất với các service khác (dataplane, job-orchestrator). TLS Redis do infrastructure (mesh/proxy) xử lý.
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.10", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
prost = "0.12"
async-nats = "0.33"
futures-util = "0.3"
time = { version = "0.3", features = ["serde"] }

[build-dependencies]
prost-build = "0.12"
