version: v1
policies:
  admin_cidr:
    enabled: true
    mode: enforce
    allowlist:
      - 127.0.0.1/32
      - 10.0.0.0/8
      - 192.168.0.0/16
  rate_limit:
    preauth:
      global_instant:
        max_inflight: 2000
        queue_limit: 0
        retry_after_seconds: 1
      ip:
        capacity: 1200
        refill: 1200
        period_seconds: 60
    postauth:
      ip_device:
        capacity: 40
        refill: 40
        period_seconds: 60
    observability:
      sampling_percent:
        throttle: 10
        temporary_isolation: 50
        block: 100
        error: 100
    behavior:
      retry_after_fallback_seconds: 2
      fail_open: false
      bypass_route_patterns:
        - /metrics
        - /api/v1/health/liveness
        - /api/v1/health/readiness
        - /api/v1/health/startup
  otel:
    enabled: true
    exporter_type: otlpgrpc
    endpoint: http://127.0.0.1:4317
    insecure: true
    sampling_ratio: 1.0
    export_timeout: 5s
    batch_timeout: 2s
    batch_max_size: 512
    batch_max_queue: 2048
    tls:
      mode: disable
      ca_cert_path: ""
      cert_path: ""
      key_path: ""
  prometheus:
    enabled: true
    fail_strategy: fail_open
    query_client:
      enabled: true
      base_url: http://127.0.0.1:9090
      query_timeout: 5s
      default_step: 15s
    expose_metrics:
      enabled: true
      route_path: /metrics


