syntax = "proto3";
package mail;

option go_package = "controlplane/internal/mail/transport/rpc/proto;mailproto";

// Cấu hình kiểm tra kết nối SMTP gửi từ Controlplane sang Dataplane
message SmtpTestConfig {
  string host = 1;
  int32 port = 2;
  string username = 3;
  string password = 4;
  string tls_mode = 5;
  optional string ca_cert_pem = 6;
  optional string client_cert_pem = 7;
  optional string client_key_pem = 8;
}

// Cấu hình gửi email giao dịch/hệ thống dùng chung (generic mail job)
message SendMailConfig {
  map<string, string> template_variables = 1; // Các tham số động truyền vào template
}

// Cấu hình đồng bộ hóa SMTP Endpoint vật lý từ Controlplane sang Dataplane (Phase 1)
message SmtpEndpointSync {
  string id = 1; // ID endpoint dạng UUID v7 string
  string zone_id = 2; // ID zone sở hữu endpoint
  string name = 3; // Tên hiển thị của endpoint
  string host = 4; // Địa chỉ SMTP host
  int32 port = 5; // Cổng SMTP
  string username = 6; // SMTP username
  string password = 7; // SMTP password (thô / plain text)
  string tls_mode = 8; // Chế độ TLS (none, starttls, tls, mtls)
  string status = 9; // Lifecycle status (planned, initializing, active, disabled)
  int32 max_connections = 10; // Kết nối song song tối đa
  int32 priority = 11; // Độ ưu tiên định tuyến
  int32 weight = 12; // Trọng số định tuyến
  optional string ca_cert_pem = 13; // Chứng chỉ CA root dạng PEM
  optional string client_cert_pem = 14; // Chứng chỉ Client dạng PEM
  optional string client_key_pem = 15; // Khóa Client private key dạng PEM (thô / plain text)
  bool is_active = 16; // Trạng thái hoạt động
  int64 updated_at = 17; // Thời điểm cập nhật cuối (Epoch Milliseconds) phục vụ LWW
}


