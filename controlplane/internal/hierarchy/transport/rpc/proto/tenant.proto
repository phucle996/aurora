syntax = "proto3";

package core.rpc;

option go_package = "controlplane/internal/hierarchy/transport/rpc/proto";

// ─── Resolve Tenant (domain → id) ──────────────────────────────────────────

message ResolveTenantRequest {
  string tenant_domain = 1; // Domain đầy đủ, ví dụ: acme.platform.io
}

message ResolveTenantResponse {
  bool   found     = 1;
  string tenant_id = 2; // UUID stable, dùng trong JWT
  // tenant_code đã bị bỏ - domain là source of truth duy nhất
}

// ─── Check Membership (user ∈ tenant) ──────────────────────────────────────

message CheckMembershipRequest {
  string tenant_id = 1;
  string user_id   = 2;
}

message CheckMembershipResponse {
  bool   is_member = 1;
  string role      = 2; // "owner" | "member" | "guest" (optional, tiện cho authz)
}

// ─── Warmup (ACR bootstrap: L2 miss → gRPC bulk fetch theo chunk) ──────────

message WarmupTenantsRequest {
  int32 chunk_size = 1; // max 1000, default 500
  int32 offset     = 2;
}

message TenantWarmupEntry {
  string tenant_id = 1;
  string domain    = 2; // domain là key resolution chính
  // tenant_code đã bị bỏ
}

message WarmupTenantsResponse {
  repeated TenantWarmupEntry tenants = 1;
  bool                       has_more = 2;
}

// ─── Service ────────────────────────────────────────────────────────────────

service TenantService {
  rpc ResolveTenant    (ResolveTenantRequest)    returns (ResolveTenantResponse);
  rpc CheckMembership  (CheckMembershipRequest)  returns (CheckMembershipResponse);
  rpc WarmupTenants    (WarmupTenantsRequest)    returns (WarmupTenantsResponse);
}
