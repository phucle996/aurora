syntax = "proto3";

package core.rpc;

option go_package = "controlplane/internal/hierarchy/transport/rpc/proto";

message GetZoneListRequest {}

message ZoneEntry {
  string zone_id = 1;
  string zone_code = 2;
  string status = 3; // Trạng thái hoạt động của zone (active, planned, draining, etc.)
  string name = 4;
}

message GetZoneListResponse {
  repeated ZoneEntry zones = 1;
}

message ResolveZoneRequest {
  string zone_code = 1;
}

message ResolveZoneResponse {
  bool found = 1;
  string zone_id = 2;
  string status = 3;
  string name = 4;
}

service ZoneService {
  rpc GetZoneList (GetZoneListRequest) returns (GetZoneListResponse);
  rpc ResolveZone (ResolveZoneRequest) returns (ResolveZoneResponse);
}


