syntax = "proto3";

package core.rpc;

option go_package = "controlplane/internal/core/transport/rpc/proto";

message ReportBackpressureRequest {
  string zone_id = 1;
  int64 queue_len = 2;
  int64 pending_len = 3;
  bool congested = 4;
  int64 epoch = 5;
  double congestion_rate = 6;
}

message ReportBackpressureResponse {
  bool success = 1;
}

service BackpressureService {
  rpc ReportBackpressure(ReportBackpressureRequest) returns (ReportBackpressureResponse);
}
