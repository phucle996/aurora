root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/controlplane"
cmd = "go build -o ./tmp/controlplane ./cmd/server"
delay = 1000
exclude_dir = ["tmp", "vendor", ".git"]
exclude_file = []
exclude_regex = ["_test\\.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = "./tmp/controlplane"
include_dir = ["cmd", "internal", "infra", "pkg", "proto"]
include_ext = ["go", "tpl", "tmpl", "html", "sql", "yaml", "yml", "json"]
kill_delay = "500ms"
log = "build-errors.log"
poll = false
poll_interval = 500
post_cmd = []
pre_cmd = []
send_interrupt = true
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false

[misc]
clean_on_exit = true
