version: v1
policies:
  admin_cidr:
    enabled: true
    mode: enforce
    allowlist:
      - 127.0.0.1/32
      - 10.0.0.0/8
      - 192.168.0.0/16
      - 172.16.0.0/12
  rate_limit:
    postauth:
      ip_device:
        capacity: 40
        refill: 40
        period_seconds: 60
    observability:
      sampling_percent:
        throttle: 10
        temporary_isolation: 50
        block: 100
        error: 100
    behavior:
      retry_after_fallback_seconds: 2
      fail_open: false
      bypass_route_patterns:
        - /metrics
        - /api/v1/health/liveness
        - /api/v1/health/readiness
        - /api/v1/health/startup

