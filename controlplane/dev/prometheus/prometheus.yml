global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: controlplane
    static_configs:
      - targets:
          - "controlplane1:8080"
          - "controlplane2:8080"
          - "controlplane3:8080"

  # Thu thập metrics từ tất cả các Dataplane node qua endpoint /metrics (cổng 2112)
  - job_name: dataplane
    static_configs:
      - targets:
          - "dataplane-z1-n1:2112"
          - "dataplane-z2-n1:2112"
          - "dataplane-z2-n2:2112"
