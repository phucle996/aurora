apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: VictoriaLogs
    orgId: 1
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://controlplane-victorialogs:9428
    editable: false
    # [VictoriaTraces Integration]: Liên kết tự động Logs của VictoriaLogs với Traces của VictoriaTraces (Jaeger API)
    jsonData:
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: "(?:trace_id|traceID|traceId|trace)[=:\\s\"]+([a-fA-F0-9]{32})"
          name: TraceID
          url: '$${__value.raw}'

  # Datasource Jaeger trỏ tới Jaeger-compatible API của VictoriaTraces
  # [VictoriaTraces Integration]: Hiển thị trace dưới dạng Gantt chart trực quan
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://controlplane-victoriatraces:10428/query/jaeger
    editable: false

  # Datasource VictoriaMetrics (Prometheus-compatible)
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://controlplane-victoriametrics:8428
    isDefault: false
    editable: false

