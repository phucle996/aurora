apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: VictoriaLogs
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: PostgreSQL
    orgId: 1
  - name: Redis-Core
    orgId: 1
  - name: Redis-Job
    orgId: 1
  - name: Redis-Dataplane-Z1
    orgId: 1
  - name: Redis-Dataplane-Z2
    orgId: 1

datasources:
  # Cấu hình Datasource Prometheus ảo trỏ trực tiếp về VictoriaMetrics để đảm bảo
  # tính tương thích ngược cho các Dashboard sử dụng tên "Prometheus" làm nguồn dữ liệu mặc định.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://controlplane-victoriametrics:8428
    isDefault: true
    editable: false

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://controlplane-victorialogs:9428
    editable: false
    # [VictoriaTraces Integration]: Liên kết tự động Logs của VictoriaLogs với Traces của VictoriaTraces (Jaeger API)
    jsonData:
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: "(?:trace_id|traceID|traceId|trace)[=:\\s\"]+([a-fA-F0-9]{32})"
          name: TraceID
          url: '$${__value.raw}'

  # Datasource Jaeger trỏ tới Jaeger-compatible API của VictoriaTraces
  # [VictoriaTraces Integration]: Hiển thị trace dưới dạng Gantt chart trực quan
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://controlplane-victoriatraces:10428/select/jaeger
    editable: false

  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://controlplane-victoriametrics:8428
    isDefault: false
    editable: false

  # Datasource PostgreSQL phục vụ giám sát cấu trúc bảng và truy vấn trực tiếp
  - name: PostgreSQL
    uid: postgresql
    type: postgres
    access: proxy
    url: controlplane-psql:5432
    user: postgres
    jsonData:
      database: controlplane
      sslmode: disable
    secureJsonData:
      password: postgres
    editable: false

  # Datasource Redis Core phục vụ giám sát Session/Identity cache
  - name: Redis-Core
    uid: redis-core
    type: redis-datasource
    access: proxy
    url: redis://controlplane-cp-redis:6379
    editable: false

  # Datasource Redis Job phục vụ giám sát hàng đợi công việc (Job Stream)
  - name: Redis-Job
    uid: redis-job
    type: redis-datasource
    access: proxy
    url: redis://controlplane-redis-job:6379
    editable: false
