# JetStream Configuration cho Môi Trường Dev/Local Hạ Tầng Aurora Cloud
# Nằm cùng nhóm hạ tầng phát triển dev tại controlplane/dev/nats

jetstream {
  store_dir: "/tmp/nats/jetstream"
  max_memory_store: 256MB
  max_file_store: 2GB
}

# Thông tin Stream tham chiếu:
# Stream Name: CONTROLPLANE_DOMAIN_EVENTS
# Subjects: controlplane.storage.resource.lifecycle.v1
# Storage: File
# Retention: Limits (Max Age: 72 hours)
