receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # [METRICS SCRAPER]: Thu thập dữ liệu từ các exporter hạ tầng (như postgres_exporter)
  # chạy theo mô hình Pull để chuyển đổi thành luồng đẩy Push-based thống nhất về VictoriaMetrics.
  prometheus:
    config:
      scrape_configs:
        - job_name: 'postgres-exporter'
          scrape_interval: 15s
          static_configs:
            - targets: ['controlplane-psql-exporter:9187']
              labels:
                kubernetes_namespace: "controlplane"
                release: "controlplane"

        # [REDIS MULTI-TARGET SCRAPER]: Cào metrics cho cả 4 instance Redis thông qua 1 exporter duy nhất.
        # Cơ chế hoạt động: Gửi request đến http://controlplane-redis-exporter:9121/scrape?target=redis://...
        - job_name: 'redis-exporter'
          scrape_interval: 15s
          static_configs:
            - targets:
                - 'redis://controlplane-cp-redis:6379'
                - 'redis://controlplane-redis-job:6379'
                - 'redis://controlplane-redis-dataplane-z1:6379'
          metrics_path: /scrape
          relabel_configs:
            # 1. Chuyển địa chỉ đích ban đầu thành tham số query "target" cho exporter
            - source_labels: [__address__]
              target_label: __param_target
            # 2. Gán nhãn "instance" bằng địa chỉ target thực tế để hiển thị đẹp trên dashboard
            - source_labels: [__param_target]
              target_label: instance
            # 3. Ghi đè địa chỉ đích thực sự mà collector sẽ gửi HTTP request tới là container redis-exporter
            - target_label: __address__
              replacement: 'controlplane-redis-exporter:9121'

  # filelog đọc trực tiếp từ đĩa của Docker host mà không cần gọi qua docker.sock (bảo mật hơn)
  filelog:
    include:
      - /var/lib/docker/containers/*/*-json.log
    exclude:
      # Loại trừ chính log của container otel-collector này để tránh loop log (HOSTNAME là short container ID mặc định do Docker cấp)
      - /var/lib/docker/containers/${env:HOSTNAME}*/*
    include_file_path: true
    operators:
      # 1. Parse JSON của log wrapper Docker (chuyển log thô thành attributes.log)
      - type: json_parser
        id: parser_docker
        on_error: send_quiet
      # 2. Đưa chuỗi log thực tế của app từ attributes.log vào trường body chính
      - type: move
        id: move_log_to_body
        from: attributes.log
        to: body
        on_error: send_quiet
      # 3. Parse tiếp JSON từ body (lúc này là log của app với các trường client_ip, level, msg...)
      - type: json_parser
        id: parser_app
        on_error: send_quiet
      # 3a. Nếu log là của Redis, parse bằng regex đặc thù
      - type: regex_parser
        id: parser_redis
        regex: '^(?P<pid>[0-9]+):(?P<role>[a-zA-Z]) (?P<time>[0-9]{2} [a-zA-Z]{3} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}) (?P<redis_level>[*#.-]) (?P<msg>.*?)\s*$'
        on_error: send_quiet
      # 3b. Nếu log là của PgBouncer hoặc Postgres, parse bằng regex đặc thù
      - type: regex_parser
        id: parser_pgbouncer
        regex: '^(?P<time>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}) (?P<tz>[A-Z]+) \[(?P<pid>[0-9]+)\] (?P<level>[A-Z]+):? (?P<msg>.*?)\s*$'
        on_error: send_quiet
      # 4. Đưa trường `msg` trong log app hoặc infra làm nội dung tin nhắn chính hiển thị ở body
      - type: move
        id: move_msg_to_body
        from: attributes.msg
        to: body
        on_error: send_quiet
      # 5. Trích xuất container_id từ đường dẫn file log của container
      - type: regex_parser
        id: extract_container_id
        regex: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/'
        parse_from: attributes["log.file.path"]
        on_error: send_quiet

processors:
  batch:
  # [OPTIMIZATION & DATA SUSTAINABILITY]: Bộ lọc loại bỏ log rác từ chính hệ thống giám sát
  # Giúp tránh vòng lặp ghi log vô hạn (log loop) và tối ưu hóa dung lượng lưu trữ trên môi trường HA.
  filter/exclude_noise:
    error_mode: ignore
    logs:
      log_record:
        # Loại bỏ logs của Grafana (dạng logfmt bắt đầu bằng logger=)
        - IsMatch(body, "^logger=")
        # Loại bỏ logs của VictoriaMetrics, VictoriaLogs, VictoriaTraces chứa thư viện chung VictoriaMetrics@
        - IsMatch(body, "VictoriaMetrics@")
        # Loại bỏ logs từ module khởi chạy của VictoriaLogs
        - IsMatch(body, "VictoriaLogs/")
        # [OPTIMIZATION & DATA SUSTAINABILITY]: Loại bỏ log health check thành công (200 OK) của app để tránh log bloat.
        # Chỉ giữ lại log health check nếu status code khác 200 (khi hệ thống có sự cố) để phục vụ cảnh báo/giám sát.
        - IsMatch(attributes["route"], "^/api/v1/health/") and (attributes["status_code"] == 200 or attributes["status_code"] == "200")
        # [OPTIMIZATION]: Loại bỏ log kết nối thành công của health check nội bộ PgBouncer (mỗi 5s).
        # Chỉ loại bỏ log "login attempt" phát sinh từ localhost (127.0.0.1) của chính container pbouncer.
        - IsMatch(body, "login attempt:") and IsMatch(body, "@127\\.0\\.0\\.1")

  # transform processor ánh xạ container_id sang container_name và dọn dẹp các trường log thừa
  transform:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["container_name"], attributes["container_id"])
          # Xóa các thuộc tính siêu dữ liệu dư thừa từ filelog receiver và Docker để giữ log sạch
          - delete_key(attributes, "log.file.name")
          - delete_key(attributes, "log.file.path")
          - delete_key(attributes, "stream")
          - delete_key(attributes, "detected_level")
          - delete_key(attributes, "container_id")
          # Đặt các trường hệ thống mặc định về rỗng/không xác định để tránh làm rác log
          - set(scope.name, "")
          - set(scope.version, "")
          - set(severity_text, attributes["level"]) where attributes["level"] != nil
          - set(severity_text, "INFO") where attributes["redis_level"] == "*"
          - set(severity_text, "WARN") where attributes["redis_level"] == "#"
          - set(severity_text, "DEBUG") where attributes["redis_level"] == "."
          - set(severity_text, "VERBOSE") where attributes["redis_level"] == "-"

  # transform/metering: Trích xuất các thuộc tính access_key và bucket_name từ log Envoy Storage
  transform/metering:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - merge_maps(attributes, ExtractPatterns(attributes["authorization"], "Credential=(?P<access_key>[^/\\s]+)"), "upsert") where attributes["authorization"] != nil
          - merge_maps(attributes, ExtractPatterns(attributes["path"], "^/(?P<bucket_name>[^/]+)"), "upsert") where attributes["path"] != nil

  # filter/only_storage_envoy: Chỉ cho phép logs chứa dữ liệu băng thông của Envoy Storage đi qua
  filter/only_storage_envoy:
    error_mode: ignore
    logs:
      log_record:
        - attributes["log_type"] != "envoy-storage-access"

exporters:
  clickhouse:
    endpoint: "tcp://clickhouse:9000"
    database: "otlp"
    ttl: 168h
  debug:
    verbosity: basic
  # Exporter gửi dữ liệu metrics sang VictoriaMetrics bằng chuẩn Remote Write
  prometheusremotewrite:
    endpoint: "http://controlplane-victoriametrics:8428/api/v1/write"
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
  # Exporter gửi dữ liệu logs sang VictoriaLogs bằng chuẩn OTLP HTTP
  otlphttp/victorialogs:
    endpoint: "http://controlplane-victorialogs:9428/insert/opentelemetry"
    headers:
      "VL-Stream-Fields": "container_name"
    tls:
      insecure: true
  # Exporter gửi dữ liệu traces sang VictoriaTraces bằng chuẩn OTLP HTTP
  # [VictoriaTraces Integration]: Đóng vai trò làm backend lưu trữ traces cho hệ thống
  otlphttp/victoriatraces:
    endpoint: "http://controlplane-victoriatraces:10428/insert/opentelemetry"
    tls:
      insecure: true

service:
  pipelines:
    # Pipeline traces nhận log qua OTLP gRPC/HTTP và xuất sang VictoriaTraces
    # [VictoriaTraces Integration]: Nhận traceparent phân tán từ các microservices
    # (Đã loại bỏ exporter debug để tránh spam console log)
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/victoriatraces]
    # Pipeline metrics (Đã loại bỏ exporter debug)
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheusremotewrite]
    # Pipeline logs (Đã loại bỏ exporter debug)
    logs:
      receivers: [otlp, filelog]
      # Bổ sung filter/exclude_noise trước transform để lọc bỏ log rác ngay khi nhận được
      processors: [filter/exclude_noise, transform, batch]
      exporters: [otlphttp/victorialogs]

    # Pipeline logs/metering: Lọc logs Envoy Storage, trích xuất metrics và lưu vào ClickHouse
    logs/metering:
      receivers: [filelog]
      processors: [transform, filter/only_storage_envoy, transform/metering, batch]
      exporters: [clickhouse]
