extensions:
  # [COMMENT]: Khai báo docker_observer để giám sát các container thông qua unix:///var/run/docker.sock
  docker_observer:
    endpoint: unix:///var/run/docker.sock
  # [COMMENT]: Filelog checkpoints phải sống qua collector restart; nếu chỉ giữ offset trong RAM
  # thì restart có thể đọc trùng hoặc bỏ qua container log trong cửa sổ downtime.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # [METRICS SCRAPER]: Thu thập dữ liệu từ các exporter hạ tầng (như postgres_exporter)
  # chạy theo mô hình Pull để chuyển đổi thành luồng đẩy Push-based thống nhất về VictoriaMetrics.
  prometheus:
    config:
      scrape_configs:
        - job_name: 'postgres-exporter'
          scrape_interval: 15s
          static_configs:
            - targets: ['controlplane-psql-exporter:9187']
              labels:
                kubernetes_namespace: "controlplane"
                release: "controlplane"

        # [REDIS SCRAPER]: Dev exporter chỉ cào Shared L2; Auth Redis cần credential metrics riêng trong production.
        # Cơ chế hoạt động: Gửi request đến http://controlplane-redis-exporter:9121/scrape?target=redis://...
        - job_name: 'redis-exporter'
          scrape_interval: 15s
          static_configs:
            - targets:
                - 'redis://controlplane-cp-redis:6379'
          metrics_path: /scrape
          relabel_configs:
            # 1. Chuyển địa chỉ đích ban đầu thành tham số query "target" cho exporter
            - source_labels: [__address__]
              target_label: __param_target
            # 2. Gán nhãn "instance" bằng địa chỉ target thực tế để hiển thị đẹp trên dashboard
            - source_labels: [__param_target]
              target_label: instance
            # 3. Ghi đè địa chỉ đích thực sự mà collector sẽ gửi HTTP request tới là container redis-exporter
            - target_label: __address__
              replacement: 'controlplane-redis-exporter:9121'

  # filelog đọc một canonical raw Docker path. Không tail đồng thời symlink của cùng inode vì
  # dual path tạo duplicate-ingestion ambiguity khi fingerprint/checkpoint được rebuild.
  filelog:
    start_at: end
    storage: file_storage
    # App logger bounds fields far below this limit. Truncate a pathological infra line rather
    # than split it into multiple fragments that look like independent structured events.
    max_log_size: 1MiB
    max_log_size_behavior: truncate
    include:
      - /var/lib/docker/containers/*/*-json.log
    exclude:
      - /var/lib/docker/containers/${env:HOSTNAME}*/*
    include_file_path: true
    operators:
      # 1. Parse JSON của log wrapper Docker (chuyển log thô thành attributes.log)
      - type: json_parser
        id: parser_docker
        on_error: send_quiet
      # 2. Đưa chuỗi log thực tế của app từ attributes.log vào trường body chính
      - type: move
        id: move_log_to_body
        from: attributes.log
        to: body
        on_error: send_quiet
      # 3. Parse tiếp JSON từ body (lúc này là log của app với các trường client_ip, level, msg...)
      - type: json_parser
        id: parser_app
        on_error: send_quiet
      # 3a. Nếu log là của Redis, parse bằng regex đặc thù
      - type: regex_parser
        id: parser_redis
        regex: '^(?P<pid>[0-9]+):(?P<role>[a-zA-Z]) (?P<time>[0-9]{2} [a-zA-Z]{3} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}) (?P<redis_level>[*#.-]) (?P<msg>.*?)\s*$'
        on_error: send_quiet
      # 3b. Nếu log là của PgBouncer hoặc Postgres, parse bằng regex đặc thù
      - type: regex_parser
        id: parser_pgbouncer
        regex: '^(?P<time>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}) (?P<tz>[A-Z]+) \[(?P<pid>[0-9]+)\] (?P<level>[A-Z]+):? (?P<msg>.*?)\s*$'
        on_error: send_quiet
      # 4. Đưa trường `msg` trong log app hoặc infra làm nội dung tin nhắn chính hiển thị ở body
      - type: move
        id: move_message_to_body
        from: attributes.message
        to: body
        on_error: send_quiet
      # 4b. Schema cũ của Go/infra dùng `msg`; Dataplane chuẩn hóa trên `message`.
      - type: move
        id: move_msg_to_body
        from: attributes.msg
        to: body
        on_error: send_quiet
      # 5. Trích xuất container_id từ canonical raw Docker path.
      - type: regex_parser
        id: extract_container_id
        regex: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/'
        parse_from: attributes["log.file.path"]
        on_error: send_quiet

processors:
  batch:
  # [OPTIMIZATION & DATA SUSTAINABILITY]: Bộ lọc loại bỏ log rác từ chính hệ thống giám sát
  # Giúp tránh vòng lặp ghi log vô hạn (log loop) và tối ưu hóa dung lượng lưu trữ trên môi trường HA.
  filter/exclude_noise:
    error_mode: ignore
    logs:
      log_record:
        # Loại bỏ logs của Grafana (dạng logfmt bắt đầu bằng logger=)
        - IsMatch(body, "^logger=")
        # Loại bỏ logs của VictoriaMetrics, VictoriaLogs, VictoriaTraces chứa thư viện chung VictoriaMetrics@
        - IsMatch(body, "VictoriaMetrics@")
        # Loại bỏ logs từ module khởi chạy của VictoriaLogs
        - IsMatch(body, "VictoriaLogs/")
        # [OPTIMIZATION & DATA SUSTAINABILITY]: Loại bỏ log health check thành công (200 OK) của app để tránh log bloat.
        # Chỉ giữ lại log health check nếu status code khác 200 (khi hệ thống có sự cố) để phục vụ cảnh báo/giám sát.
        - IsMatch(attributes["route"], "^/api/v1/health/") and (attributes["status_code"] == 200 or attributes["status_code"] == "200")
        # [OPTIMIZATION]: Loại bỏ log kết nối thành công của health check nội bộ PgBouncer (mỗi 5s).
        # Chỉ loại bỏ log "login attempt" phát sinh từ localhost (127.0.0.1) của chính container pbouncer.
        - IsMatch(body, "login attempt:") and IsMatch(body, "@127\\.0\\.0\\.1")

  # transform processor ánh xạ container_id sang container_name thực tế và dọn dẹp các trường log thừa
  transform:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # [COMMENT]: Ánh xạ container_name trực tiếp theo tên thực tế dựa trên container_id prefix
          # JSON-looking application lines that failed parser_app remain raw in body. Preserve an
          # explicit diagnostic attribute instead of silently presenting them as structured logs.
          - set(attributes["app_json_parse_error"], true) where IsMatch(body, "^\\s*\\{") and attributes["level"] == nil
          - set(attributes["container_name"], "admin-ui-nginx") where IsMatch(attributes["container_id"], "^42eca33b4987")
          - set(attributes["container_name"], "aurora-acr") where IsMatch(attributes["container_id"], "^2b5f8445e46e")
          - set(attributes["container_name"], "aurora-centrifugo") where IsMatch(attributes["container_id"], "^73df715e7d6c")
          - set(attributes["container_name"], "aurora-job-orchestrator") where IsMatch(attributes["container_id"], "^32f7088da814")
          - set(attributes["container_name"], "aurora-kafka-1") where IsMatch(attributes["container_id"], "^f66012f8d9d2")
          - set(attributes["container_name"], "aurora-kafka-2") where IsMatch(attributes["container_id"], "^e991a07056ee")
          - set(attributes["container_name"], "aurora-kafka-3") where IsMatch(attributes["container_id"], "^4ea19e979588")
          - set(attributes["container_name"], "aurora-kafka-ui") where IsMatch(attributes["container_id"], "^9a7822958f41")
          - set(attributes["container_name"], "aurora-notification-service") where IsMatch(attributes["container_id"], "^d05acd18d716")
          - set(attributes["container_name"], "billing-psql") where IsMatch(attributes["container_id"], "^bd3f7252f059")
          - set(attributes["container_name"], "clickhouse-server") where IsMatch(attributes["container_id"], "^b649dec551d6")
          - set(attributes["container_name"], "cloud-console-dev") where IsMatch(attributes["container_id"], "^82c5fcf1393b")
          - set(attributes["container_name"], "controlplane-acr-redis") where IsMatch(attributes["container_id"], "^0df83601df85")
          - set(attributes["container_name"], "controlplane-cp-redis") where IsMatch(attributes["container_id"], "^0ed3c9a37c56")
          - set(attributes["container_name"], "controlplane-dev-1") where IsMatch(attributes["container_id"], "^3c84167b5202")
          - set(attributes["container_name"], "controlplane-dev-2") where IsMatch(attributes["container_id"], "^ae9d865ee5bf")
          - set(attributes["container_name"], "controlplane-dev-3") where IsMatch(attributes["container_id"], "^7dc4f18fd476")
          - set(attributes["container_name"], "controlplane-envoy") where IsMatch(attributes["container_id"], "^c661beafdbb4")
          - set(attributes["container_name"], "controlplane-grafana") where IsMatch(attributes["container_id"], "^0f5ec008ada4")
          - set(attributes["container_name"], "controlplane-nats") where IsMatch(attributes["container_id"], "^727bd0dce525")
          - set(attributes["container_name"], "controlplane-pbouncer") where IsMatch(attributes["container_id"], "^aed6e35d9f75")
          - set(attributes["container_name"], "controlplane-psql") where IsMatch(attributes["container_id"], "^5f548d0ffbd7")
          - set(attributes["container_name"], "controlplane-psql-exporter") where IsMatch(attributes["container_id"], "^c5c255cbaf57")
          - set(attributes["container_name"], "controlplane-redis-exporter") where IsMatch(attributes["container_id"], "^782d368ba475")
          - set(attributes["container_name"], "controlplane-vault-1") where IsMatch(attributes["container_id"], "^693c30475941")
          - set(attributes["container_name"], "controlplane-victorialogs") where IsMatch(attributes["container_id"], "^624d58be0e90")
          - set(attributes["container_name"], "controlplane-victoriametrics") where IsMatch(attributes["container_id"], "^d3fb10661abe")
          - set(attributes["container_name"], "controlplane-victoriatraces") where IsMatch(attributes["container_id"], "^369532ced466")
          - set(attributes["container_name"], "cost-console-nginx") where IsMatch(attributes["container_id"], "^425356df2ddf")
          - set(attributes["container_name"], "cost-manager") where IsMatch(attributes["container_id"], "^faa400b8472c")
          - set(attributes["container_name"], "dataplane-vn-n1") where IsMatch(attributes["container_id"], "^4653fa82f037")
          - set(attributes["container_name"], "dataplane-vn-n2") where IsMatch(attributes["container_id"], "^c4b1bf9f8113")
          - set(attributes["container_name"], "dataplane-vn-n3") where IsMatch(attributes["container_id"], "^49ac1f110b26")
          - set(attributes["container_name"], "dataplane-zone-z1-nats") where IsMatch(attributes["container_id"], "^e1660272af97")
          - set(attributes["container_name"], "minio") where IsMatch(attributes["container_id"], "^613eb1bbd2c5")
          - set(attributes["container_name"], "stalwart") where IsMatch(attributes["container_id"], "^227967eb4fab")
          - set(attributes["container_name"], "storage-envoy") where IsMatch(attributes["container_id"], "^f3bd0f67d164")
          # [COMMENT]: Nếu container_name chưa có (fallback), gán ngắn theo short container_id (12 ký tự)
          - set(attributes["container_name"], Substring(attributes["container_id"], 0, 12)) where attributes["container_name"] == nil and attributes["container_id"] != nil
          # Xóa các thuộc tính siêu dữ liệu dư thừa từ filelog receiver và Docker để giữ log sạch
          - delete_key(attributes, "log.file.name")
          - delete_key(attributes, "log.file.path")
          - delete_key(attributes, "stream")
          - delete_key(attributes, "detected_level")
          - delete_key(attributes, "container_id")
          # Đặt các trường hệ thống mặc định về rỗng/không xác định để tránh làm rác log
          - set(scope.name, "")
          - set(scope.version, "")
          - set(severity_text, attributes["level"]) where attributes["level"] != nil
          - set(severity_text, "INFO") where attributes["redis_level"] == "*"
          - set(severity_text, "WARN") where attributes["redis_level"] == "#"
          - set(severity_text, "DEBUG") where attributes["redis_level"] == "."
          - set(severity_text, "VERBOSE") where attributes["redis_level"] == "-"

  # transform/metering: Envoy đã trích access_key mà không log raw Authorization; collector chỉ parse bucket.
  transform/metering:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - merge_maps(attributes, ExtractPatterns(attributes["path"], "^/(?P<bucket_name>[^/]+)"), "upsert") where attributes["path"] != nil

  # filter/only_storage_envoy: Chỉ cho phép logs chứa dữ liệu băng thông của Envoy Storage đi qua
  filter/only_storage_envoy:
    error_mode: ignore
    logs:
      log_record:
        - attributes["log_type"] != "envoy-storage-access"

exporters:
  clickhouse:
    endpoint: "tcp://clickhouse:9000"
    database: "otlp"
    ttl: 168h
  debug:
    verbosity: basic
  # Exporter gửi dữ liệu metrics sang VictoriaMetrics bằng chuẩn Remote Write
  prometheusremotewrite:
    endpoint: "http://controlplane-victoriametrics:8428/api/v1/write"
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
  # Exporter gửi dữ liệu logs sang VictoriaLogs bằng chuẩn OTLP HTTP
  otlphttp/victorialogs:
    endpoint: "http://controlplane-victorialogs:9428/insert/opentelemetry"
    headers:
      "VL-Stream-Fields": "container_name,service_name,zone_id,node_id"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
      storage: file_storage
    tls:
      insecure: true
  # Exporter gửi dữ liệu traces sang VictoriaTraces bằng chuẩn OTLP HTTP
  # [VictoriaTraces Integration]: Đóng vai trò làm backend lưu trữ traces cho hệ thống
  otlphttp/victoriatraces:
    endpoint: "http://controlplane-victoriatraces:10428/insert/opentelemetry"
    tls:
      insecure: true

service:
  extensions: [docker_observer, file_storage]
  pipelines:
    # Pipeline traces nhận log qua OTLP gRPC/HTTP và xuất sang VictoriaTraces
    # [VictoriaTraces Integration]: Nhận traceparent phân tán từ các microservices
    # (Đã loại bỏ exporter debug để tránh spam console log)
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/victoriatraces]
    # Pipeline metrics (Đã loại bỏ exporter debug)
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheusremotewrite]
    # Pipeline logs (Đã loại bỏ exporter debug)
    logs:
      receivers: [otlp, filelog]
      # Bổ sung filter/exclude_noise trước transform để lọc bỏ log rác ngay khi nhận được
      processors: [filter/exclude_noise, transform, batch]
      exporters: [otlphttp/victorialogs]

    # Pipeline logs/metering: Lọc logs Envoy Storage, trích xuất metrics và lưu vào ClickHouse
    logs/metering:
      receivers: [filelog]
      processors: [transform, filter/only_storage_envoy, transform/metering, batch]
      exporters: [clickhouse]
