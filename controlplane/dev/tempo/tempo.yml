server:
  http_listen_port: 3200
  log_level: error

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      environment: dev
    collection_interval: 15s
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces-wal
  processor:
    service_graphs: {}
    span_metrics: {}
    local_blocks:
      filter_server_spans: false

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

overrides:
  metrics_generator_processors:
    - service-graphs
    - span-metrics
    - local-blocks
