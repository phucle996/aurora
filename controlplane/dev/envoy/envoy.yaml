static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: redirect_all_to_https
                  virtual_hosts:
                    - name: all_http
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          redirect:
                            https_redirect: true
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: ingress_https
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/tls/tls.crt
                    private_key:
                      filename: /etc/envoy/tls/tls.key
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                generate_request_id: true
                use_remote_address: true
                xff_num_trusted_hops: 1
                common_http_protocol_options:
                  idle_timeout: 60s
                stream_idle_timeout: 30s
                request_timeout: 15s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          ts: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          host: "%REQ(:AUTHORITY)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          protocol: "%PROTOCOL%"
                          status: "%RESPONSE_CODE%"
                          flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_service_time_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
                          upstream_host: "%UPSTREAM_HOST%"
                          downstream_remote: "%DOWNSTREAM_REMOTE_ADDRESS%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                route_config:
                  name: ingress_https_routes
                  response_headers_to_add:
                    - header:
                        key: strict-transport-security
                        value: max-age=31536000; includeSubDomains
                    - header:
                        key: x-content-type-options
                        value: nosniff
                    - header:
                        key: x-frame-options
                        value: DENY
                    - header:
                        key: referrer-policy
                        value: strict-origin-when-cross-origin
                  response_headers_to_remove:
                    - "traceparent"
                  virtual_hosts:
                    - name: controlplane_vhost
                      domains:
                        - "controlplane.aurora.local"
                        - "controlplane.aurora.local:443"
                        - "envoy"
                        - "envoy:8443"
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                google_re2: {}
                                regex: "https?://.*\\.aurora\\.local(:[0-9]+)?"
                            - exact: "http://localhost:5173"
                          allow_methods: "GET, POST, OPTIONS, PUT, DELETE, PATCH"
                          allow_headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With, X-Request-ID, X-Client-Device-ID, X-Admin-Signature, X-Admin-Timestamp, X-Admin-Nonce, X-Admin-StepUp-Code, X-Zone-Code, x-zone-code"
                          allow_credentials:
                            value: true
                          max_age: "86400"
                      routes:
                        - match:
                            path: "/api/v1/health/readiness"
                          route:
                            cluster: controlplane_cluster
                            timeout: 2s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 1s
                        - match: { prefix: "/" }
                          route:
                            cluster: controlplane_cluster
                            timeout: 10s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 3s
                    - name: adminui_vhost
                      domains:
                        - "adminui.aurora.local"
                        - "adminui.aurora.local:443"
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                google_re2: {}
                                regex: "https?://.*\\.aurora\\.local(:[0-9]+)?"
                            - exact: "http://localhost:5173"
                          allow_methods: "GET, POST, OPTIONS, PUT, DELETE, PATCH"
                          allow_headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With, X-Request-ID, X-Client-Device-ID, X-Admin-Signature, X-Admin-Timestamp, X-Admin-Nonce, X-Admin-StepUp-Code, X-Zone-Code, x-zone-code"
                          allow_credentials:
                            value: true
                          max_age: "86400"
                      routes:
                        - match: { prefix: "/admin/" }
                          route:
                            cluster: controlplane_cluster
                            timeout: 10s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 3s
                        - match: { prefix: "/api/" }
                          route:
                            cluster: controlplane_cluster
                            timeout: 10s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 3s
                        - match: { prefix: "/" }
                          route:
                            cluster: admin_ui_cluster
                            timeout: 15s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 5s
                          # [COMMENT]: Bỏ qua ext_authz cho các file tĩnh và giao diện để giảm thiểu latency
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                    - name: cloud_vhost
                      domains:
                        - "cloud.aurora.local"
                        - "cloud.aurora.local:443"
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                google_re2: {}
                                regex: "https?://.*\\.aurora\\.local(:[0-9]+)?"
                            - exact: "http://localhost:3000"
                          allow_methods: "GET, POST, OPTIONS, PUT, DELETE, PATCH"
                          allow_headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With, X-Request-ID, X-Client-Device-ID, X-Admin-Signature, X-Admin-Timestamp, X-Admin-Nonce, X-Admin-StepUp-Code, X-Zone-Code, x-zone-code"
                          allow_credentials:
                            value: true
                          max_age: "86400"
                      routes:
                        - match: { prefix: "/connection/" }
                          route:
                            cluster: centrifugo_cluster
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: websocket
                        - match: { prefix: "/api/" }
                          route:
                            cluster: controlplane_cluster
                            timeout: 10s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 3s
                        - match: { prefix: "/" }
                          route:
                            cluster: cloud_ui_cluster
                            timeout: 15s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 5s
                          # [COMMENT]: Bỏ qua ext_authz cho các file tĩnh và giao diện Cloud UI để giảm thiểu latency
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                    - name: cost_manager_vhost
                      domains:
                        - "cost-manager.aurora.local"
                        - "cost-manager.aurora.local:443"
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                google_re2: {}
                                regex: "https?://.*\\.aurora\\.local(:[0-9]+)?"
                          allow_methods: "GET, POST, OPTIONS, PUT, DELETE, PATCH"
                          allow_headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With"
                          allow_credentials:
                            value: true
                          max_age: "86400"
                        envoy.filters.http.ext_authz:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                          disabled: true
                      routes:
                        - match: { prefix: "/api/" }
                          route:
                            cluster: cost_manager_cluster
                            timeout: 15s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 5s
                        - match: { prefix: "/" }
                          route:
                            cluster: cost_console_cluster
                            timeout: 15s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 5s

                    - name: localhost_fallback
                      domains:
                        - "localhost"
                        - "localhost:443"
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                google_re2: {}
                                regex: "https?://.*\\.aurora\\.local(:[0-9]+)?"
                            - exact: "http://localhost:5173"
                          allow_methods: "GET, POST, OPTIONS, PUT, DELETE, PATCH"
                          allow_headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With, X-Request-ID, X-Client-Device-ID, X-Admin-Signature, X-Admin-Timestamp, X-Admin-Nonce, X-Admin-StepUp-Code, X-Zone-Code, x-zone-code"
                          allow_credentials:
                            value: true
                          max_age: "86400"
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: controlplane_cluster
                            timeout: 10s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset"
                              num_retries: 1
                              per_try_timeout: 3s
                upgrade_configs:
                  - upgrade_type: websocket
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  # [COMMENT]: Tích hợp ext_authz để gọi sang Rust acr service xử lý xác thực và zone catalog tại biên
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      grpc_service:
                        envoy_grpc:
                          cluster_name: acr_cluster
                        timeout: 2s
                      with_request_body:
                        max_request_bytes: 10240
                        pack_as_bytes: true
                      transport_api_version: V3
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          "allow-non-admin":
                            permissions:
                              - and_rules:
                                  rules:
                                    - not_rule:
                                        header: { name: ":path", prefix_match: "/admin/" }
                            principals:
                              - any: true
                          "allow-whitelisted-admin":
                            permissions:
                              - header: { name: ":path", prefix_match: "/admin/" }
                            principals:
                              - source_ip: { address_prefix: 127.0.0.1, prefix_len: 32 }
                              - source_ip: { address_prefix: 10.0.0.0, prefix_len: 8 }
                              - source_ip: { address_prefix: 172.16.0.0, prefix_len: 12 }
                              - source_ip: { address_prefix: 192.168.0.0, prefix_len: 16 }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: controlplane_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_requests: 8798
            max_pending_requests: 8798
            max_connections: 8798
      health_checks:
        - timeout: 1s
          interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /api/v1/health/readiness
      outlier_detection:
        consecutive_5xx: 3
        consecutive_gateway_failure: 2
        interval: 5s
        base_ejection_time: 30s
        max_ejection_percent: 100
        successful_active_health_check_uneject_host: true
      load_assignment:
        cluster_name: controlplane_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: controlplane1
                      port_value: 8080
              - endpoint:
                  address:
                    socket_address:
                      address: controlplane2
                      port_value: 8080
              - endpoint:
                  address:
                    socket_address:
                      address: controlplane3
                      port_value: 8080

    - name: cost_manager_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      load_assignment:
        cluster_name: cost_manager_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: cost-manager
                      port_value: 8084

    - name: cost_console_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      load_assignment:
        cluster_name: cost_console_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: cost-console-nginx
                      port_value: 5173

    - name: admin_ui_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      load_assignment:
        cluster_name: admin_ui_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: admin-ui-nginx
                      port_value: 5173

    - name: cloud_ui_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      load_assignment:
        cluster_name: cloud_ui_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: cloud-console
                      port_value: 3000

    # [COMMENT]: Cụm cluster gRPC trỏ sang Rust acr container phục vụ việc kiểm tra và xử lý phiên
    - name: acr_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: acr_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: acr
                      port_value: 50051

    - name: centrifugo_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      load_assignment:
        cluster_name: centrifugo_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: centrifugo
                      port_value: 8000

admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
