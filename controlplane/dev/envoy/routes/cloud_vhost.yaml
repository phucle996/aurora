# [COMMENT]: Cấu hình VirtualHost cho nhóm Route Cloud Console Frontend & Realtime Centrifugo WSS (cloud.aurora.local)
name: cloud_vhost
domains:
  - "cloud.aurora.local"
  - "cloud.aurora.local:443"
typed_per_filter_config:
  envoy.filters.http.cors:
    "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
    allow_origin_string_match:
      - safe_regex:
          regex: "https?://.*\\.aurora\\.local(:[0-9]+)?"
      - exact: "http://localhost:3000"
    allow_methods: "GET, POST, OPTIONS, PUT, DELETE, PATCH"
    allow_headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With, X-Request-ID, X-Client-Device-ID, X-Admin-Signature, X-Admin-Timestamp, X-Admin-Nonce, X-Admin-StepUp-Code, X-Zone-Code, x-zone-code"
    allow_credentials:
      value: true
    max_age: "86400"
routes:
  # [COMMENT]: Route nâng cấp WebSocket realtime connection trỏ sang Centrifugo Cluster
  - match: { prefix: "/connection/" }
    route:
      cluster: centrifugo_cluster
      timeout: 0s
      upgrade_configs:
        - upgrade_type: websocket
  # OAuth callback performs bounded provider HTTPS and IAM work. Override only
  # this route; all normal authorization checks keep the global 2s budget.
  - match: { prefix: "/api/v1/auth/oauth/" }
    route:
      cluster: controlplane_cluster
      timeout: 15s
    typed_per_filter_config:
      envoy.filters.http.ext_authz:
        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
        check_settings:
          grpc_service:
            envoy_grpc:
              cluster_name: acr_cluster
            timeout: 15s
  # All Cloud Console self-scoped Billing reads share one extensible Cost route branch.
  # Neutral owner Billing API; ACR rewrites to the verified personal/tenant
  # internal path after ext_authz, while the cluster choice stays Cost Manager.
  - match: { prefix: "/api/v1/billing/" }
    route:
      cluster: cost_manager_cluster
      timeout: 5s
      retry_policy:
        retry_on: "connect-failure,refused-stream,reset"
        num_retries: 1
        per_try_timeout: 2s
  # [COMMENT]: Route API cho Cloud Console Backend
  - match: { prefix: "/api/" }
    route:
      cluster: controlplane_cluster
      timeout: 10s
      retry_policy:
        retry_on: "connect-failure,refused-stream,reset"
        num_retries: 1
        per_try_timeout: 3s
  # [COMMENT]: Route phục vụ trang Cloud Console UI Frontend (Tắt ext_authz cho static assets)
  - match: { prefix: "/" }
    route:
      cluster: cloud_ui_cluster
      timeout: 15s
      retry_policy:
        retry_on: "connect-failure,refused-stream,reset"
        num_retries: 1
        per_try_timeout: 5s
    typed_per_filter_config:
      envoy.filters.http.ext_authz:
        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
        disabled: true
