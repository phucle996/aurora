# [COMMENT]: Cấu hình VirtualHost dự phòng cho Localhost (localhost / localhost:443)
name: localhost_fallback
domains:
  - "localhost"
  - "localhost:443"
typed_per_filter_config:
  envoy.filters.http.cors:
    "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
    allow_origin_string_match:
      - safe_regex:
          regex: "https?://.*\\.aurora\\.local(:[0-9]+)?"
      - exact: "http://localhost:5173"
    allow_methods: "GET, POST, OPTIONS, PUT, DELETE, PATCH"
    allow_headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With, X-Request-ID, X-Client-Device-ID, X-Admin-Signature, X-Admin-Timestamp, X-Admin-Nonce, X-Admin-StepUp-Code, X-Zone-Code, x-zone-code"
    allow_credentials:
      value: true
    max_age: "86400"
routes:
  # [COMMENT]: Route mặc định khi truy cập qua localhost
  - match: { prefix: "/" }
    route:
      cluster: controlplane_cluster
      timeout: 10s
      retry_policy:
        retry_on: "connect-failure,refused-stream,reset"
        num_retries: 1
        per_try_timeout: 3s
