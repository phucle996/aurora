services:
  controlplane1:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-1
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
      - controlplane_go_mod:/go/pkg/mod
      - ./tmp:/app/tmp
      - ./dev/tls:/app/dev/tls
      - ./policies.yaml:/app/runtime/policies/policy.yaml:ro
    environment:
      APP_NODE_ID: controlplane-dev-1
      PSQL_HOST: psql
      PSQL_PORT: "5432"
    depends_on:
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
      otel-collector:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane2:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-2
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
      - controlplane_go_mod:/go/pkg/mod
      - ./tmp:/app/tmp
      - ./dev/tls:/app/dev/tls
      - ./policies.yaml:/app/runtime/policies/policy.yaml:ro
    environment:
      APP_NODE_ID: controlplane-dev-2
      PSQL_HOST: psql
      PSQL_PORT: "5432"
    depends_on:
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
      otel-collector:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane3:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-3
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
      - controlplane_go_mod:/go/pkg/mod
      - ./tmp:/app/tmp
      - ./dev/tls:/app/dev/tls
      - ./policies.yaml:/app/runtime/policies/policy.yaml:ro
    environment:
      APP_NODE_ID: controlplane-dev-3
      PSQL_HOST: psql
      PSQL_PORT: "5432"
    depends_on:
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
      otel-collector:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  envoy:
    image: envoyproxy/envoy:v1.33.2
    container_name: controlplane-envoy
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    volumes:
      - ./dev/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./dev/tls/grpc-server.crt:/etc/envoy/tls/tls.crt:ro
      - ./dev/tls/grpc-server.key:/etc/envoy/tls/tls.key:ro
    ports:
      - "80:8080"
      - "443:8443"
      - "28000:8080"
      - "29901:9901"
    depends_on:
      controlplane1:
        condition: service_started
      controlplane2:
        condition: service_started
      controlplane3:
        condition: service_started
    restart: unless-stopped

  psql:
    image: postgres:17-bookworm
    container_name: controlplane-psql
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15433:5432"
    volumes:
      - controlplane_psql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controlplane"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-bookworm
    container_name: controlplane-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16380:6379"
    volumes:
      - controlplane_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: controlplane-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./dev/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: controlplane-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./dev/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - controlplane_prometheus_data:/prometheus
    ports:
      - "19091:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: controlplane-loki
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - ./dev/loki/loki-config.yml:/etc/loki/config.yml:ro
      - controlplane_loki_data:/loki
    ports:
      - "13100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    container_name: controlplane-tempo
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    volumes:
      - ./dev/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - controlplane_tempo_data:/var/tempo
    ports:
      - "13200:3200"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    container_name: controlplane-promtail
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./dev/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - controlplane_promtail_positions:/tmp
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: controlplane-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - controlplane_grafana_data:/var/lib/grafana
      - ./dev/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "13001:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      otel-collector:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

  cloud-ui:
    image: node:20-alpine
    container_name: cloud-ui-dev
    working_dir: /workspace
    volumes:
      - ../cloud-ui:/workspace
      - cloud_ui_node_modules:/workspace/node_modules
    command: ["sh", "-c", "npm install --legacy-peer-deps && npm run dev -- --hostname 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

  admin-ui:
    image: node:20-alpine
    container_name: admin-ui-dev
    working_dir: /workspace
    volumes:
      - ../admin-ui:/workspace
      - admin_ui_node_modules:/workspace/node_modules
    command: ["sh", "-c", "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

volumes:
  controlplane_go_mod:
  controlplane_psql_data:
  controlplane_redis_data:
  controlplane_prometheus_data:
  controlplane_tempo_data:
  controlplane_loki_data:
  controlplane_promtail_positions:
  controlplane_grafana_data:
  cloud_ui_node_modules:
  admin_ui_node_modules:
