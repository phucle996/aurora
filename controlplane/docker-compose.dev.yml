      AUTH_REDIS_URL: "redis://acr:aurora-dev-acr-secret@controlplane-acr-redis:6379/0"
      SHARED_REDIS_URL: "redis://controlplane-cp-redis:6379/0"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "hvs.7Bjv38bvXX4DuXpMl3rVWWuP"
      VAULT_TRANSIT_KEY_PATH: "transit/keys/jwt-signer"
      VAULT_TOTP_KEY_PATH: "totp/keys/admin"
      VAULT_ADMIN_API_KEY_PATH: "secret/data/admin/api-key"
      VAULT_TIMEOUT_SECS: "5"
      VAULT_MAX_RETRIES: "3"
      SESSION_TTL_SECS: "1800"
      REFRESH_THRESHOLD_SECS: "900"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
      # [COMMENT]: ACR cookies luôn host-only; domain handoff chỉ redirect tới origin cố định này.
      BILLING_CONSOLE_ORIGIN: "https://cost-manager.aurora.local"
      APP_ALLOWED_ORIGINS: "https://adminui.aurora.local,https://adminui-dev.aurora.local,https://cloud.aurora.local,https://cost-manager.aurora.local"
    depends_on:
      acr-redis:
        condition: service_healthy
