services:

  # ============================================================================
  # 🛑 PHẦN 1: CONTROLPLANE CLUSTER - HIGH AVAILABILITY (HA) APPLICATION TIERS
  # ============================================================================
  # Cụm ba (3) thực thể Controlplane chạy song song để đảm bảo tính sẵn sàng cao.
  # Nếu một node bị crash hoặc bảo trì, hệ thống vẫn tiếp tục vận hành bình thường.
  # gRPC và HTTP traffic sẽ được Envoy phân phối đều dựa trên thuật toán Least Request.

  controlplane1:
    build:
      context: .
      # Chạy Dockerfile.prod: biên dịch Go binary tĩnh (CGO_ENABLED=0), image runtime chỉ ~30MB.
      # Không có hot-reload. Mỗi lần thay đổi code cần `docker compose up --build` để rebuild.
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-1
    init: true
    env_file:
      - .env
    volumes:
      # Mount TLS certs vào đúng path mà binary prod đọc (xem GRPC_TLS_* trong .env).
      - ./dev/tls:/etc/controlplane/tls:ro
      # Binary prod chạy với WORKDIR /var/lib/controlplane và đọc policy tại
      # 'runtime/policies/policy.yaml' (path tương đối). Mount vào đúng path tuyệt đối.
      - ./policies.yaml:/var/lib/controlplane/runtime/policies/policy.yaml:ro
    environment:
      # Override TLS paths để khớp với mount point mới của prod container.
      GRPC_TLS_CERT: /etc/controlplane/tls/grpc-server.crt
      GRPC_TLS_KEY: /etc/controlplane/tls/grpc-server.key
      GRPC_CLIENT_CA: /etc/controlplane/tls/ca.crt
      GRPC_PORT: "9090"
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane2:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-2
    init: true
    env_file:
      - .env
    volumes:
      - ./dev/tls:/etc/controlplane/tls:ro
      - ./policies.yaml:/var/lib/controlplane/runtime/policies/policy.yaml:ro
    environment:
      GRPC_TLS_CERT: /etc/controlplane/tls/grpc-server.crt
      GRPC_TLS_KEY: /etc/controlplane/tls/grpc-server.key
      GRPC_CLIENT_CA: /etc/controlplane/tls/ca.crt
      GRPC_PORT: "9090"
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane3:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-3
    init: true
    env_file:
      - .env
    volumes:
      - ./dev/tls:/etc/controlplane/tls:ro
      - ./policies.yaml:/var/lib/controlplane/runtime/policies/policy.yaml:ro
    environment:
      GRPC_TLS_CERT: /etc/controlplane/tls/grpc-server.crt
      GRPC_TLS_KEY: /etc/controlplane/tls/grpc-server.key
      GRPC_CLIENT_CA: /etc/controlplane/tls/ca.crt
      GRPC_PORT: "9090"
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 🛡️ PHẦN 2: CENTRAL ENVOY EDGE INGRESS CONTROLLER
  # ============================================================================
  # Cổng ngõ (Ingress Gateway) phân tán tải tối ưu cho toàn bộ cụm Controlplane.
  # Envoy chịu trách nhiệm terminate kết nối SSL/TLS, xử lý HTTP/2, gRPC proxy,
  # và phân chia tải thông qua giải thuật LEAST_REQUEST để tối ưu hóa tài nguyên.

  envoy:
    image: envoyproxy/envoy:v1.33.2
    container_name: controlplane-envoy
    command: [ "envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info" ]
    volumes:
      # Cung cấp cấu hình định tuyến tĩnh và động v3 API cho Envoy.
      - ./dev/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      # Cung cấp chứng chỉ SSL chất lượng cao phục vụ TLS termination tại Edge.
      - ./dev/tls/grpc-server.crt:/etc/envoy/tls/tls.crt:ro
      - ./dev/tls/grpc-server.key:/etc/envoy/tls/tls.key:ro
    ports:
      - "80:8080" # Cổng HTTP tiêu chuẩn định tuyến đến Cloud UI/Admin UI
      - "443:8443" # Cổng HTTPS bảo mật terminate TLS cho các giao tiếp an toàn
      - "28000:8080" # Cổng gRPC / API Gateway phục vụ các ứng dụng khách bên ngoài
      - "29901:9901" # Cổng Envoy Administration & Statistics Dashboard để giám sát hiệu năng
    depends_on:
      controlplane1:
        condition: service_started
      controlplane2:
        condition: service_started
      controlplane3:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # 📦 PHẦN 3: CENTRAL DATA & STATE PERSISTENCE LAYERS
  # ============================================================================
  # Hệ thống lưu trữ dữ liệu trung tâm bền vững (Centralized Storage Systems).
  # Sử dụng PostgreSQL 17 cho dữ liệu quan hệ có cấu trúc và Redis Core cho Cache/Sessions.

  psql:
    image: postgres:18
    container_name: controlplane-psql
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10" ]
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # PostgreSQL 17 defaults to scram-sha-256 — aligned with PgBouncer AUTH_TYPE below.
    ports:
      - "15434:5432" # Direct debug port for schema migrations and heavy queries
    volumes:
      # Sử dụng named volume để lưu trữ dữ liệu bền vững, tránh mất mát dữ liệu khi container bị hủy.
      - controlplane_psql_data:/var/lib/postgresql
      # [SECURITY]: Mount script khởi tạo tài khoản giám sát postgres_exporter với phân quyền tối thiểu (Least Privilege).
      - ./dev/postgres/init-monitoring.sql:/docker-entrypoint-initdb.d/init-monitoring.sql:ro
    healthcheck:
      # Thực thi pg_isready định kỳ để đảm bảo DB chỉ nhận kết nối khi đã sẵn sàng hoàn toàn.
      test: [ "CMD-SHELL", "pg_isready -U postgres -d controlplane" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pbouncer:
    image: edoburu/pgbouncer:latest
    container_name: controlplane-pbouncer
    environment:
      - LISTEN_PORT=6432
      - DB_HOST=psql
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=controlplane
      - POOL_MODE=transaction
      # ================================================================
      # SECURITY: scram-sha-256 — native PostgreSQL 17 auth protocol.
      # AUTH_QUERY lets PgBouncer fetch the scram verifier directly from
      # pg_shadow, bypassing the MD5 userlist.txt mismatch entirely.
      # AUTH_USER must be a superuser (or pg_shadow member) to run the query.
      # ================================================================
      - AUTH_TYPE=scram-sha-256
      - AUTH_USER=postgres
      - AUTH_QUERY=SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - STATS_PERIOD=3600
    ports:
      - "15433:6432" # Transparent host port replacement for developer tools
    depends_on:
      psql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-d", "controlplane", "-U", "postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  psql-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: controlplane-psql-exporter
    environment:
      # [SECURITY]: Chuỗi kết nối sử dụng tài khoản postgres_exporter chuyên dụng có quyền pg_monitor.
      # Không sử dụng tài khoản root 'postgres' để đảm bảo tuân thủ tiêu chuẩn an ninh thông tin.
      - DATA_SOURCE_URI=psql:5432/controlplane?sslmode=disable
      - DATA_SOURCE_USER=postgres_exporter
      - DATA_SOURCE_PASS=postgres_exporter_password
      # [OPTIMIZATION]: Tối ưu hóa tần suất truy vấn và phòng ngừa lỗi cạn kiệt pool kết nối (Connection Exhaustion).
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=true # Đặt true để tắt collector mặc định vì đã tự định nghĩa pg_settings.
      - PG_EXPORTER_AUTO_DISCOVER_DATABASES=false # Chỉ giám sát db controlplane để hạn chế số lượng active backends.
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./dev/postgres/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      psql:
        condition: service_healthy
    restart: unless-stopped
    command: [
      "--disable-default-metrics",
      "--no-collector.database",
      "--no-collector.locks",
      "--no-collector.replication",
      "--no-collector.replication_slot",
      "--no-collector.roles",
      "--no-collector.stat_bgwriter",
      "--no-collector.stat_database",
      "--no-collector.stat_progress_vacuum",
      "--no-collector.stat_user_tables",
      "--no-collector.statio_user_tables",
      "--no-collector.wal"
    ]

  # 📊 PHẦN 3.5: REDIS EXPORTER - THU THẬP METRICS CHO CẢ 4 INSTANCES REDIS (HA SCRAPER)
  # - Sử dụng oliver006/redis_exporter để cào metrics qua cơ chế multi-target /scrape.
  # - Chỉ cần chạy 1 container duy nhất để tối ưu hóa tài nguyên phần cứng (Optimization).
  redis-exporter:
    image: oliver006/redis_exporter:v1.85.0
    container_name: controlplane-redis-exporter
    environment:
      # Địa chỉ mặc định để exporter tự kiểm tra khi cào không có tham số target
      - REDIS_ADDR=redis://controlplane-redis:6379
    depends_on:
      redis:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      redis-dataplane-z1:
        condition: service_healthy
      redis-dataplane-z2:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.8.0
    container_name: controlplane-redis
    command: [ "redis-server", "--appendonly", "yes" ] # Bật AOF (Append Only File) để tối đa hóa tính bền vững dữ liệu
    ports:
      - "16380:6379" # Port core Redis dùng cho Identity Sessions và Rate Limiting
    volumes:
      - controlplane_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ============================================================================
  # 🔒 PHẦN 4: ISOLATED REDIS CACHES PER GEOGRAPHIC ZONE (HIGH-AVAILABILITY)
  # ============================================================================
  # TRIẾT LÝ SRE VÀ THIẾT KẾ CÔ LẬP DỮ LIỆU (DATA ISOLATION & LATENCY OPTIMIZATION):
  #   - Nhằm đạt được tính độc lập hoàn toàn giữa các vùng địa lý, loại bỏ cross-region latency.
  #   - redis-job (Cổng 6380): Chuyên dụng để phân phối Job Queue (Streams).
  #   - redis-dataplane-z1 (Cổng 6381): Cache cục bộ dành riêng cho Phân vùng Đông Nam Á (Zone 1).
  #   - redis-dataplane-z2 (Cổng 6382): Cache cục bộ dành riêng cho Phân vùng US West (Zone 2).
  #   - Nếu một Zone bị cô lập do mất kết nối mạng hoặc lỗi hạ tầng, các Zone khác vẫn hoạt động
  #     bình thường mà không bị ảnh hưởng chéo (mục tiêu cốt lõi của tính năng SRE HA).

  redis-job:
    image: redis:8.8.0
    container_name: controlplane-redis-job
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6380:6379"
    volumes:
      - controlplane_redis_job_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-dataplane-z1:
    image: redis:8.8.0
    container_name: controlplane-redis-dataplane-z1
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6381:6379"
    volumes:
      - controlplane_redis_dp_z1_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-dataplane-z2:
    image: redis:8.8.0
    container_name: controlplane-redis-dataplane-z2
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6382:6379"
    volumes:
      - controlplane_redis_dp_z2_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # 🚀 PHẦN 5: DATAPLANE ZONE 1 (SINGLE RUST-NODE - ASIA SOUTHEAST ZONE)
  # ============================================================================
  # Phân vùng Địa lý 1 (Zone 1 - Asia Southeast):
  #   - Nhận nhiệm vụ xử lý tác vụ cục bộ trong khu vực Đông Nam Á.
  #   - Định danh duy nhất bởi UUIDv7 đã được seed vào Postgres: 01903e8c-55c1-7da3-87de-6e69622d1df7.
  #   - Được bổ trợ cổng bảo mật gRPC Load Balancing bởi Envoy-Zone1 tại Port 8081.

  dataplane-z1-n1:
    build:
      context: ../dataplane
      # Dockerfile.prod: multi-stage Rust build → binary tĩnh tối giản trong debian:slim.
      # Không cargo-watch, không source mount, không signal routing issue.
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: dataplane-z1-n1
    init: true
    volumes:
      # Mount policy config cho binary prod đọc từ path chuẩn /etc/dataplane/.
      - ../dataplane/config/policy.yaml:/etc/dataplane/policy.yaml:ro
    environment:
      ZONE_ID: "019eba50-596b-7b77-b3e2-966e3f8ef885"
      REDIS_JOB_URL: "redis://controlplane-redis-job:6379/0"
      REDIS_INTERNAL_ZONE_URL: "redis://controlplane-redis-dataplane-z1:6379/0"
      CONTROLPLANE_GRPC_ENDPOINT: "controlplane-dev-1:9090"
      # Policy file path khớp với volume mount /etc/dataplane/policy.yaml.
      POLICY_FILE: /etc/dataplane/policy.yaml
      APP_LOG_LEVEL: "info"
      # Cổng export Prometheus metrics endpoint /metrics
      METRICS_PORT: "2112"
      # Endpoint gRPC của OTel Collector để gửi traces (Tempo)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
    depends_on:
      controlplane1:
        condition: service_started
      redis-job:
        condition: service_healthy
      redis-dataplane-z1:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  # Đã loại bỏ dịch vụ envoy-zone1 do Dataplane không có inbound traffic.


  # ============================================================================
  # 🚀 PHẦN 6: DATAPLANE ZONE 2 (HIGH-AVAILABILITY CLUSTER - US WEST ZONE)
  # ============================================================================
  # Phân vùng Địa lý 2 (Zone 2 - US West):
  #   - Bản thiết kế High-Availability đích thực: Chạy hai (2) nodes Rust hoạt động Active-Active.
  #   - Định danh chung bởi UUIDv7 của Zone 2: 01903e8c-55c1-7da3-87de-6e69622d1df8.
  #   - Phía trước là Envoy-Zone2 (Port 8082) có nhiệm vụ phân bổ tải gRPC Round-Robin
  #     kèm theo cơ chế Active Health Checks để tự động phát hiện và loại bỏ node bị lỗi.

  dataplane-z2-n1:
    build:
      context: ../dataplane
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: dataplane-z2-n1
    init: true
    volumes:
      - ../dataplane/config/policy.yaml:/etc/dataplane/policy.yaml:ro
    environment:
      ZONE_ID: "01903e8c-55c1-7da3-87de-6e69622d1df8"
      REDIS_JOB_URL: "redis://controlplane-redis-job:6379/0"
      # Cả hai Node trong Zone 2 đều trỏ chung về bộ đệm cách ly của Zone 2 để chia sẻ dữ liệu đồng nhất.
      REDIS_INTERNAL_ZONE_URL: "redis://controlplane-redis-dataplane-z2:6379/0"
      CONTROLPLANE_GRPC_ENDPOINT: "controlplane-dev-2:9090"
      POLICY_FILE: /etc/dataplane/policy.yaml
      APP_LOG_LEVEL: "info"
      METRICS_PORT: "2112"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
    depends_on:
      controlplane2:
        condition: service_started
      redis-job:
        condition: service_healthy
      redis-dataplane-z2:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  dataplane-z2-n2:
    build:
      context: ../dataplane
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: dataplane-z2-n2
    init: true
    volumes:
      - ../dataplane/config/policy.yaml:/etc/dataplane/policy.yaml:ro
    environment:
      ZONE_ID: "01903e8c-55c1-7da3-87de-6e69622d1df8"
      REDIS_JOB_URL: "redis://controlplane-redis-job:6379/0"
      REDIS_INTERNAL_ZONE_URL: "redis://controlplane-redis-dataplane-z2:6379/0"
      CONTROLPLANE_GRPC_ENDPOINT: "controlplane-dev-3:9090"
      POLICY_FILE: /etc/dataplane/policy.yaml
      APP_LOG_LEVEL: "info"
      METRICS_PORT: "2112"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
    depends_on:
      controlplane3:
        condition: service_started
      redis-job:
        condition: service_healthy
      redis-dataplane-z2:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
  # Đã loại bỏ dịch vụ envoy-zone2 do Dataplane không có inbound traffic.


  # ============================================================================
  # 📊 PHẦN 7: INDUSTRIAL 360-DEGREE OBSERVABILITY INFRASTRUCTURE
  # ============================================================================
  # Trục giám sát hiệu năng sản xuất tiêu chuẩn công nghiệp (Production-Grade Observability).
  # Kết hợp Metrics (Prometheus), Logs tập trung (Loki + Promtail), Traces phân tán (Tempo),
  # và OpenTelemetry Collector làm bộ điều phối luồng dữ liệu giám sát thống nhất.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: controlplane-otel-collector
    # Chạy với quyền root (0:0) để có quyền đọc file logs trong /var/lib/docker/containers
    user: "0:0"
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      # Nạp tệp cấu hình các receivers, processors, và exporters của OpenTelemetry.
      - ./dev/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
      # Gắn thư mục chứa logs của Docker container để filelog đọc trực tiếp log file
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "14317:4317" # Cổng nhận OpenTelemetry gRPC Traces & Metrics
      - "14318:4318" # Cổng nhận OpenTelemetry HTTP Traces & Metrics
    depends_on:
      victoriatraces:
        condition: service_started
    restart: unless-stopped

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    container_name: controlplane-victoriatraces
    command:
      - "-storageDataPath=/vtraces"
      - "-httpListenAddr=:10428"
    volumes:
      - controlplane_vtraces_data:/vtraces
    ports:
      - "10428:10428" # Cổng OTLP ingestion & Jaeger-compatible query API
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: controlplane-victoriametrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    volumes:
      - controlplane_vmetrics_data:/victoria-metrics-data
    ports:
      - "8428:8428" # Cổng Remote Write và query API của VictoriaMetrics
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: controlplane-victorialogs
    command:
      - "-storageDataPath=/vlogs"
      - "-httpListenAddr=:9428"
    volumes:
      - controlplane_vlogs_data:/vlogs
    ports:
      - "9428:9428" # Cổng OTLP logs ingestion & querying API
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6
    container_name: controlplane-grafana
    environment:
      # Tài khoản quản trị tối cao của hệ thống Dashboard Grafana
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false" # Khóa tính năng tự đăng ký để bảo đảm an ninh mạng nội bộ
      # Tự động tải và cài đặt plugin của VictoriaMetrics để truy vấn logs, và plugin Redis để giám sát cache/queues
      GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource,redis-datasource"
    volumes:
      - controlplane_grafana_data:/var/lib/grafana
      # Tự động nạp sẵn các Data Sources (Loki, Tempo, Prometheus) và các Dashboards tiêu chuẩn.
      - ./dev/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "13001:3000" # Cổng UI chính thức của Grafana để giám sát và phân tích toàn hệ thống
    depends_on:
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      otel-collector:
        condition: service_started
      victoriatraces:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # 💻 PHẦN 8: FRONTEND DEVELOPER WORKSPACE APPLICATIONS
  # ============================================================================
  # Các giao diện điều khiển (User Interfaces) viết bằng React/Next.js/Vite.
  # Phục vụ lập trình viên quản trị hệ thống, khách hàng Cloud, và quy trình xử lý sự cố.

  cloud-ui:
    build:
      context: ../cloud-ui
      dockerfile: Dockerfile.prod
    container_name: cloud-ui-dev
    environment:
      - NEXT_PUBLIC_CONTROLPLANE_URL=https://envoy:8443
    restart: unless-stopped

  admin-ui:
    image: node:20-alpine
    container_name: admin-ui-dev
    working_dir: /workspace
    volumes:
      - ../admin-ui:/workspace
      - admin_ui_node_modules:/workspace/node_modules
    command: [ "sh", "-c", "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173" ]
    ports:
      - "5173:5173" # Cổng truy cập của Admin Portal dành cho Quản trị viên tối cao
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

  admin-ui-nginx:
    build:
      context: ../admin-ui
      dockerfile: Dockerfile.nginx
    container_name: admin-ui-nginx
    ports:
      - "5175:5173" # Chạy trên cổng 5175 ngoài máy host để tránh trùng port 5173 dev
    restart: unless-stopped

  job-proxy:
    build:
      context: ../job-proxy
      dockerfile: Dockerfile
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: aurora-job-proxy
    init: true
    ports:
      - "9102:9102"
    volumes:
      - ./dev/tls:/etc/job-proxy/tls:ro
    environment:
      DATABASE_URL: "postgres://postgres:postgres@psql:5432/controlplane?sslmode=disable"
      REDIS_URL: "redis://controlplane-redis-job:6379/0"
      REPLICATION_SLOT_NAME: "outbox_slot"
      PUBLICATION_NAME: "outbox_pub"
      RESULT_STREAM_NAME: "job_results_stream"
      APP_LOG_LEVEL: "debug"
      METRICS_PORT: "9102"
      CONTROLPLANE_GRPC_ENDPOINT: "controlplane-dev-1:9090"
      CONTROLPLANE_GRPC_CA_CERT: "/etc/job-proxy/tls/ca.crt"
      CONTROLPLANE_GRPC_CLIENT_CERT: "/etc/job-proxy/tls/grpc-server.crt"
      CONTROLPLANE_GRPC_CLIENT_KEY: "/etc/job-proxy/tls/grpc-server.key"
      CONTROLPLANE_GRPC_DOMAIN: "localhost"
      # OpenTelemetry: Kết nối tới OTel Collector để xuất traces phục vụ distributed tracing E2E
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
    depends_on:
      psql:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: aurora-centrifugo
    ports:
      - "8000:8000"
    volumes:
      - ./dev/centrifugo/config.json:/centrifugo/config.json:ro
    command: centrifugo --config /centrifugo/config.json
    # Chỉ sử dụng API Key cho Server-to-Server communication (gửi message), xác thực kết nối khách hàng đã được ủy quyền cho Connect Proxy.
    environment:
      - CENTRIFUGO_API_KEY=your_centrifugo_api_key_secret
      # OpenTelemetry: Kết nối Centrifugo tới OTel Collector để sinh spans phục vụ distributed tracing E2E
      - CENTRIFUGO_OPENTELEMETRY=1
      - CENTRIFUGO_OPENTELEMETRY_API=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://controlplane-otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      redis-job:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: aurora-notification-service
    ports:
      - "8083:8083"
      # Cổng xuất bản Prometheus Metrics
      - "2112:2112"
    volumes:
      - ./dev/tls:/etc/notification-service/tls:ro
    environment:
      - APP_PORT=8083
      # Chỉ định cổng chạy Metrics Exporter
      - METRICS_PORT=2112
      - CENTRIFUGO_API_URL=http://centrifugo:8000/api
      - CENTRIFUGO_API_KEY=your_centrifugo_api_key_secret
      - REDIS_URL=redis://controlplane-redis-job:6379/0
      - CONTROLPLANE_GRPC_ENDPOINT=controlplane-dev-1:9090
      - CONTROLPLANE_GRPC_CA_CERT=/etc/notification-service/tls/ca.crt
      - CONTROLPLANE_GRPC_CLIENT_CERT=/etc/notification-service/tls/grpc-server.crt
      - CONTROLPLANE_GRPC_CLIENT_KEY=/etc/notification-service/tls/grpc-server.key
      - CONTROLPLANE_GRPC_DOMAIN=localhost
      # OpenTelemetry: Kết nối tới OTel Collector để xuất traces phục vụ distributed tracing E2E
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://controlplane-otel-collector:4317
    depends_on:
      centrifugo:
        condition: service_started
      controlplane1:
        condition: service_started
      redis-job:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: controlplane-vault
    command: server -dev
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=myroot
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: [ "CMD", "vault", "status" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart:v0.16.9
    container_name: controlplane-stalwart
    restart: unless-stopped
    ports:
      - "8085:8080"   # Admin HTTP API & Web UI (Dành cho dev cấu hình)
      # Lưu ý: Các cổng 25, 465, 587 không cần map ra ngoài host vì Dataplane 
      # và Stalwart giao tiếp nội bộ trong mạng Docker Network.
    environment:
      - STALWART_RECOVERY_ADMIN=admin:your-secure-password
    volumes:
      - controlplane_stalwart_etc:/etc/stalwart
      - controlplane_stalwart_data:/var/lib/stalwart

volumes:
  # Thư mục lưu cấu hình và dữ liệu của Stalwart Mail Server
  controlplane_stalwart_etc:
  controlplane_stalwart_data:

  # Caching thư viện Golang cho cụm Controlplane
  controlplane_go_mod: # Thư mục chứa tệp dữ liệu vật lý của PostgreSQL

  controlplane_psql_data: # Thư mục lưu snapshot dữ liệu của Redis Core

  controlplane_redis_data: # Cơ sở dữ liệu chuỗi thời gian của Prometheus

  controlplane_vmetrics_data: # Cơ sở dữ liệu chuỗi thời gian của VictoriaMetrics

  controlplane_vtraces_data: # Bộ đệm dữ liệu traces của VictoriaTraces

  controlplane_vlogs_data: # Bộ đệm dữ liệu logs của VictoriaLogs

  controlplane_grafana_data: # Cache node_modules cho các ứng dụng Front-end để tối ưu hóa hiệu suất khởi chạy

  admin_ui_node_modules:

  controlplane_redis_job_data: # Ổ đĩa lưu trữ bộ đệm cô lập của Zone 1

  controlplane_redis_dp_z1_data: # Ổ đĩa lưu trữ bộ đệm cô lập của Zone 2

  controlplane_redis_dp_z2_data: # Các ổ đĩa lưu cache biên dịch Cargo Target và Cargo Registry độc lập cho từng Dataplane Node

  # giúp triệt tiêu tuyệt đối lỗi ghi đè file nhị phân chéo khi các cụm Rust Nodes khởi động song song.
  dataplane_cargo_target_z1:
  dataplane_cargo_cache_z1:
  dataplane_cargo_target_z2_n1:
  dataplane_cargo_cache_z2_n1:
  dataplane_cargo_target_z2_n2:
  dataplane_cargo_cache_z2_n2:
