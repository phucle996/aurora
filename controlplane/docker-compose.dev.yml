services:

  controlplane1:
    build:
      context: .
      # Chạy Dockerfile.prod: biên dịch Go binary tĩnh (CGO_ENABLED=0), image runtime chỉ ~30MB.
      # Không có hot-reload. Mỗi lần thay đổi code cần `docker compose up --build` để rebuild.
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-1
    init: true
    env_file:
      - .env
    volumes:
      # Mount TLS certs vào đúng path mà binary prod đọc (xem GRPC_TLS_* trong .env).
      - ./dev/tls:/etc/controlplane/tls:ro
      # Binary prod chạy với WORKDIR /var/lib/controlplane và đọc policy tại
    environment:
      # Override TLS paths để khớp với mount point mới của prod container.
      GRPC_TLS_CERT: /etc/controlplane/tls/grpc-server.crt
      GRPC_TLS_KEY: /etc/controlplane/tls/grpc-server.key
      GRPC_CLIENT_CA: /etc/controlplane/tls/ca.crt
      GRPC_PORT: "9090"
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane2:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-2
    init: true
    env_file:
      - .env
    volumes:
      - ./dev/tls:/etc/controlplane/tls:ro
    environment:
      GRPC_TLS_CERT: /etc/controlplane/tls/grpc-server.crt
      GRPC_TLS_KEY: /etc/controlplane/tls/grpc-server.key
      GRPC_CLIENT_CA: /etc/controlplane/tls/ca.crt
      GRPC_PORT: "9090"
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane3:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-3
    init: true
    env_file:
      - .env
    volumes:
      - ./dev/tls:/etc/controlplane/tls:ro
    environment:
      GRPC_TLS_CERT: /etc/controlplane/tls/grpc-server.crt
      GRPC_TLS_KEY: /etc/controlplane/tls/grpc-server.key
      GRPC_CLIENT_CA: /etc/controlplane/tls/ca.crt
      GRPC_PORT: "9090"
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  envoy:
    image: envoyproxy/envoy:v1.33.2
    container_name: controlplane-envoy
    command: [ "envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info" ]
    volumes:
      # Cung cấp cấu hình định tuyến tĩnh và động v3 API cho Envoy.
      - ./dev/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      # Cung cấp chứng chỉ SSL chất lượng cao phục vụ TLS termination tại Edge.
      - ./dev/tls/grpc-server.crt:/etc/envoy/tls/tls.crt:ro
      - ./dev/tls/grpc-server.key:/etc/envoy/tls/tls.key:ro
    ports:
      - "80:8080" # Cổng HTTP tiêu chuẩn định tuyến đến Cloud UI/Admin UI
      - "443:8443" # Cổng HTTPS bảo mật terminate TLS cho các giao tiếp an toàn
      - "28000:8080" # Cổng gRPC / API Gateway phục vụ các ứng dụng khách bên ngoài
      - "29901:9901" # Cổng Envoy Administration & Statistics Dashboard để giám sát hiệu năng
    depends_on:
      controlplane1:
        condition: service_started
      controlplane2:
        condition: service_started
      controlplane3:
        condition: service_started
    restart: unless-stopped

  psql:
    image: postgres:18
    container_name: controlplane-psql
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10" ]
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # PostgreSQL 17 defaults to scram-sha-256 — aligned with PgBouncer AUTH_TYPE below.
    ports:
      - "15434:5432" # Direct debug port for schema migrations and heavy queries
    volumes:
      # Sử dụng named volume để lưu trữ dữ liệu bền vững, tránh mất mát dữ liệu khi container bị hủy.
      - controlplane_psql_data:/var/lib/postgresql
      # [SECURITY]: Mount script khởi tạo tài khoản giám sát postgres_exporter với phân quyền tối thiểu (Least Privilege).
      - ./dev/postgres/init-monitoring.sql:/docker-entrypoint-initdb.d/init-monitoring.sql:ro
    healthcheck:
      # Thực thi pg_isready định kỳ để đảm bảo DB chỉ nhận kết nối khi đã sẵn sàng hoàn toàn.
      test: [ "CMD-SHELL", "pg_isready -U postgres -d controlplane" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pbouncer:
    image: edoburu/pgbouncer:latest
    container_name: controlplane-pbouncer
    environment:
      - LISTEN_PORT=6432
      - DB_HOST=psql
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=controlplane
      - POOL_MODE=transaction
      # ================================================================
      # SECURITY: scram-sha-256 — native PostgreSQL 17 auth protocol.
      # AUTH_QUERY lets PgBouncer fetch the scram verifier directly from
      # pg_shadow, bypassing the MD5 userlist.txt mismatch entirely.
      # AUTH_USER must be a superuser (or pg_shadow member) to run the query.
      # ================================================================
      - AUTH_TYPE=scram-sha-256
      - AUTH_USER=postgres
      - AUTH_QUERY=SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - STATS_PERIOD=3600
    ports:
      - "15433:6432" # Transparent host port replacement for developer tools
    depends_on:
      psql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-d", "controlplane", "-U", "postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  psql-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: controlplane-psql-exporter
    environment:
      # [SECURITY]: Chuỗi kết nối sử dụng tài khoản postgres_exporter chuyên dụng có quyền pg_monitor.
      # Không sử dụng tài khoản root 'postgres' để đảm bảo tuân thủ tiêu chuẩn an ninh thông tin.
      - DATA_SOURCE_URI=psql:5432/controlplane?sslmode=disable
      - DATA_SOURCE_USER=postgres_exporter
      - DATA_SOURCE_PASS=postgres_exporter_password
      # [OPTIMIZATION]: Tối ưu hóa tần suất truy vấn và phòng ngừa lỗi cạn kiệt pool kết nối (Connection Exhaustion).
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=true # Đặt true để tắt collector mặc định vì đã tự định nghĩa pg_settings.
      - PG_EXPORTER_AUTO_DISCOVER_DATABASES=false # Chỉ giám sát db controlplane để hạn chế số lượng active backends.
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./dev/postgres/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      psql:
        condition: service_healthy
    restart: unless-stopped
    command: [ "--disable-default-metrics", "--no-collector.database", "--no-collector.locks", "--no-collector.replication", "--no-collector.replication_slot", "--no-collector.roles", "--no-collector.stat_bgwriter", "--no-collector.stat_database", "--no-collector.stat_progress_vacuum", "--no-collector.stat_user_tables", "--no-collector.statio_user_tables", "--no-collector.wal" ]

  redis-exporter:
    image: oliver006/redis_exporter:v1.85.0
    container_name: controlplane-redis-exporter
    environment:
      - REDIS_ADDR=redis://controlplane-redis:6379
    depends_on:
      redis:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      redis-dataplane-z1:
        condition: service_healthy
      redis-dataplane-z2:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.8.0
    container_name: controlplane-redis
    command: [ "redis-server", "--appendonly", "yes" ] # Bật AOF (Append Only File) để tối đa hóa tính bền vững dữ liệu
    ports:
      - "16380:6379" # Port core Redis dùng cho Identity Sessions và Rate Limiting
    volumes:
      - controlplane_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-job:
    image: redis:8.8.0
    container_name: controlplane-redis-job
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6380:6379"
    volumes:
      - controlplane_redis_job_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-dataplane-z1:
    image: redis:8.8.0
    container_name: controlplane-redis-dataplane-z1
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6381:6379"
    volumes:
      - controlplane_redis_dp_z1_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-dataplane-z2:
    image: redis:8.8.0
    container_name: controlplane-redis-dataplane-z2
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6382:6379"
    volumes:
      - controlplane_redis_dp_z2_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  dataplane-vn-n1:
    build:
      context: ../dataplane
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: dataplane-vn-n1
    init: true
    environment:
      ZONE_ID: "019f2338-d44c-748c-98dd-b684c474fd8f"
      REDIS_JOB_URL: "redis://controlplane-redis-job:6379/0"
      REDIS_INTERNAL_ZONE_URL: "redis://controlplane-redis-dataplane-z1:6379/0"
      # Policy file path khớp với volume mount /etc/dataplane/policy.yaml.
      APP_LOG_LEVEL: "info"
      # Cổng export Prometheus metrics endpoint /metrics
      METRICS_PORT: "2112"
      # Endpoint gRPC của OTel Collector để gửi traces (Tempo)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
    depends_on:
      controlplane1:
        condition: service_started
      redis-job:
        condition: service_healthy
      redis-dataplane-z1:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  dataplane-vn-n2:
    build:
      context: ../dataplane
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: dataplane-vn-n2
    init: true
    environment:
      ZONE_ID: "019f2338-d44c-748c-98dd-b684c474fd8f"
      REDIS_JOB_URL: "redis://controlplane-redis-job:6379/0"
      REDIS_INTERNAL_ZONE_URL: "redis://controlplane-redis-dataplane-z1:6379/0"
      APP_LOG_LEVEL: "info"
      METRICS_PORT: "2112"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
    depends_on:
      controlplane2:
        condition: service_started
      redis-job:
        condition: service_healthy
      redis-dataplane-z1:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  dataplane-vn-n3:
    build:
      context: ../dataplane
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: dataplane-vn-n3
    init: true
    environment:
      ZONE_ID: "019f2338-d44c-748c-98dd-b684c474fd8f"
      REDIS_JOB_URL: "redis://controlplane-redis-job:6379/0"
      REDIS_INTERNAL_ZONE_URL: "redis://controlplane-redis-dataplane-z1:6379/0"
      APP_LOG_LEVEL: "info"
      METRICS_PORT: "2112"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
    depends_on:
      controlplane3:
        condition: service_started
      redis-job:
        condition: service_healthy
      redis-dataplane-z1:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: controlplane-otel-collector
    # Chạy với quyền root (0:0) để có quyền đọc file logs trong /var/lib/docker/containers
    user: "0:0"
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      # Nạp tệp cấu hình các receivers, processors, và exporters của OpenTelemetry.
      - ./dev/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
      # Gắn thư mục chứa logs của Docker container để filelog đọc trực tiếp log file
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "14317:4317" # Cổng nhận OpenTelemetry gRPC Traces & Metrics
      - "14318:4318" # Cổng nhận OpenTelemetry HTTP Traces & Metrics
    depends_on:
      victoriatraces:
        condition: service_started
    restart: unless-stopped

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    container_name: controlplane-victoriatraces
    command:
      - "-storageDataPath=/vtraces"
      - "-httpListenAddr=:10428"
    volumes:
      - controlplane_vtraces_data:/vtraces
    ports:
      - "10428:10428" # Cổng OTLP ingestion & Jaeger-compatible query API
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: controlplane-victoriametrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    volumes:
      - controlplane_vmetrics_data:/victoria-metrics-data
    ports:
      - "8428:8428" # Cổng Remote Write và query API của VictoriaMetrics
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: controlplane-victorialogs
    command:
      - "-storageDataPath=/vlogs"
      - "-httpListenAddr=:9428"
    volumes:
      - controlplane_vlogs_data:/vlogs
    ports:
      - "9428:9428" # Cổng OTLP logs ingestion & querying API
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6
    container_name: controlplane-grafana
    environment:
      # Tài khoản quản trị tối cao của hệ thống Dashboard Grafana
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false" # Khóa tính năng tự đăng ký để bảo đảm an ninh mạng nội bộ
      # Tự động tải và cài đặt plugin của VictoriaMetrics để truy vấn logs, và plugin Redis để giám sát cache/queues
      GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource,redis-datasource"
    volumes:
      - controlplane_grafana_data:/var/lib/grafana
      # Tự động nạp sẵn các Data Sources (Loki, Tempo, Prometheus) và các Dashboards tiêu chuẩn.
      - ./dev/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "13001:3000" # Cổng UI chính thức của Grafana để giám sát và phân tích toàn hệ thống
    depends_on:
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      otel-collector:
        condition: service_started
      victoriatraces:
        condition: service_started
    restart: unless-stopped

  cloud-console:
    build:
      context: ../cloud-console
      dockerfile: Dockerfile.prod
    container_name: cloud-console-dev
    environment:
      - NEXT_PUBLIC_CONTROLPLANE_URL=https://envoy:8443
    restart: unless-stopped

  admin-ui-nginx:
    build:
      context: ../admin-ui
      dockerfile: Dockerfile.nginx
    container_name: admin-ui-nginx
    ports:
      - "5175:5173"
    restart: unless-stopped

  job-orchestrator:
    build:
      context: ../job-orchestrator
      dockerfile: Dockerfile
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: aurora-job-orchestrator
    init: true
    ports:
      - "9102:9102"
    volumes:
      - ./dev/tls:/etc/job-orchestrator/tls:ro
    environment:
      DATABASE_URL: "postgres://postgres:postgres@psql:5432/controlplane?sslmode=disable"
      REDIS_URL: "redis://controlplane-redis-job:6379/0"
      REPLICATION_SLOT_NAME: "outbox_slot"
      PUBLICATION_NAME: "outbox_pub"
      RESULT_STREAM_NAME: "job_results_stream"
      APP_LOG_LEVEL: "debug"
      METRICS_PORT: "9102"
      CDC_SOURCES: "mail.mail_outbox_records,iam.iam_outbox_records,hierarchy.zones,hierarchy.zone_services"
      # OpenTelemetry: Kết nối tới OTel Collector để xuất traces phục vụ distributed tracing E2E
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
    depends_on:
      psql:
        condition: service_healthy
      redis-job:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: aurora-centrifugo
    ports:
      - "8000:8000"
    volumes:
      - ./dev/centrifugo/config.json:/centrifugo/config.json:ro
    command: centrifugo --config /centrifugo/config.json
    # Chỉ sử dụng API Key cho Server-to-Server communication (gửi message), xác thực kết nối khách hàng đã được ủy quyền cho Connect Proxy.
    environment:
      - CENTRIFUGO_API_KEY=your_centrifugo_api_key_secret
      # OpenTelemetry: Kết nối Centrifugo tới OTel Collector để sinh spans phục vụ distributed tracing E2E
      - CENTRIFUGO_OPENTELEMETRY=1
      - CENTRIFUGO_OPENTELEMETRY_API=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://controlplane-otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      redis-job:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  acr:
    build:
      context: ../acr
      dockerfile: Dockerfile
    container_name: aurora-acr
    init: true
    # [COMMENT]: Mount chứng chỉ TLS để thiết lập kết nối mTLS bảo mật đến các node Controlplane
    volumes:
      - ./dev/tls:/etc/acr/tls:ro
    environment:
      ACR_GRPC_PORT: "50051"
      REDIS_URL: "redis://controlplane-redis:6379/0"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "hvs.T1zqA0PBeirkK6X6MmXmJjoU"
      VAULT_TRANSIT_KEY_PATH: "transit/keys/jwt-signer"
      VAULT_TOTP_KEY_PATH: "totp/keys/admin"
      VAULT_ADMIN_API_KEY_PATH: "secret/data/admin/api-key"
      VAULT_TIMEOUT_SECS: "5"
      VAULT_MAX_RETRIES: "3"
      SESSION_TTL_SECS: "1800"
      REFRESH_THRESHOLD_SECS: "900"
      CONTROLPLANE_GRPC_ENDPOINT: "controlplane-dev-1:9090"
      CONTROLPLANE_GRPC_CA_CERT: "/etc/acr/tls/ca.crt"
      CONTROLPLANE_GRPC_CLIENT_CERT: "/etc/acr/tls/grpc-server.crt"
      CONTROLPLANE_GRPC_CLIENT_KEY: "/etc/acr/tls/grpc-server.key"
      CONTROLPLANE_GRPC_DOMAIN: "localhost"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: aurora-notification-service
    ports:
      - "8083:8083"
      # Cổng xuất bản Prometheus Metrics
      - "2112:2112"
    environment:
      - APP_PORT=8083
      # Chỉ định cổng chạy Metrics Exporter
      - METRICS_PORT=2112
      - CENTRIFUGO_API_URL=http://centrifugo:8000/api
      - CENTRIFUGO_API_KEY=your_centrifugo_api_key_secret
      - REDIS_URL=redis://controlplane-redis-job:6379/0
      # [COMMENT]: ACR service phục vụ toàn bộ xác thực Trinity Token (User + Admin) — internal network, không mTLS
      - ACR_GRPC_ENDPOINT=acr:50051
      # OpenTelemetry: Kết nối tới OTel Collector để xuất traces phục vụ distributed tracing E2E
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://controlplane-otel-collector:4317
    depends_on:
      centrifugo:
        condition: service_started
      redis-job:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  vault:
    image: hashicorp/vault:2.0
    user: "0:0"

    entrypoint: >
      sh -c "
        chown -R vault:vault /vault/data &&
        export SKIP_SETCAP=1 &&
        exec su-exec vault vault server -config=/vault/config/vault.hcl
      "
    volumes:
      - ./dev/vault/vault.hcl:/vault/config/vault.hcl:ro
      - controlplane_vault_data:/vault/data
    ports:
      - "8200:8200"
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart:v0.16.11
    container_name: stalwart
    restart: unless-stopped
    ports:
      - "8085:8080" # Admin HTTP API & Web UI (Dành cho dev cấu hình)
    environment:
      - STALWART_RECOVERY_ADMIN=admin:27102004
    volumes:
      - controlplane_stalwart_etc:/etc/stalwart
      - controlplane_stalwart_data:/var/lib/stalwart
    networks:
      default:
        aliases:
          - stalwart-mail

volumes:
  # Thư mục lưu cấu hình và dữ liệu của Stalwart Mail Server
  controlplane_stalwart_etc:
  controlplane_stalwart_data: # [COMMENT]: Lưu trữ dữ liệu Raft bền vững của Vault

  controlplane_vault_data:

  # Caching thư viện Golang cho cụm Controlplane
  controlplane_go_mod: # Thư mục chứa tệp dữ liệu vật lý của PostgreSQL

  controlplane_psql_data: # Thư mục lưu snapshot dữ liệu của Redis Core

  controlplane_redis_data: # Cơ sở dữ liệu chuỗi thời gian của Prometheus

  controlplane_vmetrics_data: # Cơ sở dữ liệu chuỗi thời gian của VictoriaMetrics

  controlplane_vtraces_data: # Bộ đệm dữ liệu traces của VictoriaTraces

  controlplane_vlogs_data: # Bộ đệm dữ liệu logs của VictoriaLogs

  controlplane_grafana_data: # Cache node_modules cho các ứng dụng Front-end để tối ưu hóa hiệu suất khởi chạy

  admin_ui_node_modules:

  controlplane_redis_job_data: # Ổ đĩa lưu trữ bộ đệm cô lập của Zone 1

  controlplane_redis_dp_z1_data: # Ổ đĩa lưu trữ bộ đệm cô lập của Zone 2

  controlplane_redis_dp_z2_data: # Các ổ đĩa lưu cache biên dịch Cargo Target và Cargo Registry độc lập cho từng Dataplane Node

  # giúp triệt tiêu tuyệt đối lỗi ghi đè file nhị phân chéo khi các cụm Rust Nodes khởi động song song.
  dataplane_cargo_target_z1:
  dataplane_cargo_cache_z1:
  dataplane_cargo_target_z2_n1:
  dataplane_cargo_cache_z2_n1:
  dataplane_cargo_target_z2_n2:
  dataplane_cargo_cache_z2_n2:
