services:

  controlplane1:
    build:
      context: .
      # Chạy Dockerfile.prod: biên dịch Go binary tĩnh (CGO_ENABLED=0), image runtime chỉ ~30MB.
      # Không có hot-reload. Mỗi lần thay đổi code cần `docker compose up --build` để rebuild.
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-1
    init: true
    env_file:
      - .env
    volumes:
      # Mount TLS certs vào đúng path mà binary prod đọc (xem GRPC_TLS_* trong .env).
      - ./dev/tls:/etc/controlplane/tls:ro
      # Binary prod chạy với WORKDIR /var/lib/controlplane và đọc policy tại
    environment:
      # Override TLS paths để khớp với mount point mới của prod container.
      GRPC_TLS_CERT: /etc/controlplane/tls/grpc-server.crt
      GRPC_TLS_KEY: /etc/controlplane/tls/grpc-server.key
      GRPC_CLIENT_CA: /etc/controlplane/tls/ca.crt
      GRPC_PORT: "9090"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092"
      KAFKA_IAM_VERIFICATION_TOPIC: "aurora.iam.account-verification.v1"
      # [COMMENT]: Dev Shared Redis chỉ có một node; production không được hạ ngưỡng replica này.
      REDIS_DURABLE_REPLICA_ACKS: "0"
      # [COMMENT]: Auth-State dùng DB 0 + ACL/prefix; không dùng logical DB để còn tương thích Redis Cluster.
      AUTH_REDIS_ADDR: "acr-redis:6379"
      AUTH_REDIS_USERNAME: "controlplane"
      AUTH_REDIS_PASSWORD: "aurora-dev-controlplane-secret"
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
      acr-redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane2:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-2
    init: true
    env_file:
      - .env
    volumes:
      - ./dev/tls:/etc/controlplane/tls:ro
    environment:
      GRPC_TLS_CERT: /etc/controlplane/tls/grpc-server.crt
      GRPC_TLS_KEY: /etc/controlplane/tls/grpc-server.key
      GRPC_CLIENT_CA: /etc/controlplane/tls/ca.crt
      GRPC_PORT: "9090"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092"
      KAFKA_IAM_VERIFICATION_TOPIC: "aurora.iam.account-verification.v1"
      REDIS_DURABLE_REPLICA_ACKS: "0"
      # [COMMENT]: Mỗi replica dùng cùng ACL nhưng cô lập dữ liệu bằng namespace AuthZ được cấp quyền.
      AUTH_REDIS_ADDR: "acr-redis:6379"
      AUTH_REDIS_USERNAME: "controlplane"
      AUTH_REDIS_PASSWORD: "aurora-dev-controlplane-secret"
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
      acr-redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  controlplane3:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: controlplane-dev-3
    init: true
    env_file:
      - .env
    volumes:
      - ./dev/tls:/etc/controlplane/tls:ro
    environment:
      GRPC_TLS_CERT: /etc/controlplane/tls/grpc-server.crt
      GRPC_TLS_KEY: /etc/controlplane/tls/grpc-server.key
      GRPC_CLIENT_CA: /etc/controlplane/tls/ca.crt
      GRPC_PORT: "9090"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092"
      KAFKA_IAM_VERIFICATION_TOPIC: "aurora.iam.account-verification.v1"
      REDIS_DURABLE_REPLICA_ACKS: "0"
      # [COMMENT]: Mỗi replica dùng cùng ACL nhưng cô lập dữ liệu bằng namespace AuthZ được cấp quyền.
      AUTH_REDIS_ADDR: "acr-redis:6379"
      AUTH_REDIS_USERNAME: "controlplane"
      AUTH_REDIS_PASSWORD: "aurora-dev-controlplane-secret"
    depends_on:
      pbouncer:
        condition: service_healthy
      psql:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
      acr-redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  envoy:
    image: envoyproxy/envoy:v1.33.2
    container_name: controlplane-envoy
    command: [ "envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info" ]
    volumes:
      # Cung cấp cấu hình định tuyến tĩnh và động v3 API cho Envoy.
      - ./dev/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./dev/envoy/routes:/etc/envoy/routes:ro
      # Cung cấp chứng chỉ SSL chất lượng cao phục vụ TLS termination tại Edge.
      - ./dev/tls/grpc-server.crt:/etc/envoy/tls/tls.crt:ro
      - ./dev/tls/grpc-server.key:/etc/envoy/tls/tls.key:ro
    ports:
      - "80:8080" # Cổng HTTP tiêu chuẩn định tuyến đến Cloud UI/Admin UI
      - "443:443" # Cổng HTTPS bảo mật terminate TLS cho các giao tiếp an toàn (đã chuyển listener port của container sang 443)
      - "28000:8080" # Cổng gRPC / API Gateway phục vụ các ứng dụng khách bên ngoài
      - "29901:9901" # Cổng Envoy Administration & Statistics Dashboard để giám sát hiệu năng
    depends_on:
      controlplane1:
        condition: service_started
      controlplane2:
        condition: service_started
      controlplane3:
        condition: service_started
    networks:
      default:
        aliases:
          - controlplane.aurora.local
    restart: unless-stopped

  storage-envoy:
    image: envoyproxy/envoy:v1.33.2
    container_name: storage-envoy
    command: [ "envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info" ]
    volumes:
      - ./dev/envoy/envoy-storage.yaml:/etc/envoy/envoy.yaml:ro
      - ./dev/tls/grpc-server.crt:/etc/envoy/tls/tls.crt:ro
      - ./dev/tls/grpc-server.key:/etc/envoy/tls/tls.key:ro
    ports:
      - "29000:8080" # Cổng S3 Gateway proxy qua Envoy hướng đến MinIO
    depends_on:
      - minio
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ports:
      - "18123:8123" # Cổng HTTP interface để push logs & query debug
      - "19000:9000" # Cổng native protocol của ClickHouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./dev/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  psql:
    image: postgres:18
    container_name: controlplane-psql
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10" ]
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # PostgreSQL 17 defaults to scram-sha-256 — aligned with PgBouncer AUTH_TYPE below.
    ports:
      - "15434:5432" # Direct debug port for schema migrations and heavy queries
    volumes:
      # Sử dụng named volume để lưu trữ dữ liệu bền vững, tránh mất mát dữ liệu khi container bị hủy.
      - controlplane_psql_data:/var/lib/postgresql
      # [SECURITY]: Mount script khởi tạo tài khoản giám sát postgres_exporter với phân quyền tối thiểu (Least Privilege).
      - ./dev/postgres/init-monitoring.sql:/docker-entrypoint-initdb.d/init-monitoring.sql:ro
    healthcheck:
      # Thực thi pg_isready định kỳ để đảm bảo DB chỉ nhận kết nối khi đã sẵn sàng hoàn toàn.
      test: [ "CMD-SHELL", "pg_isready -U postgres -d controlplane" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  changefeed-init:
    image: postgres:18
    environment:
      PGHOST: psql
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: controlplane
      PUBLICATION_NAME: outbox_pub
      REPLICATION_SLOT_NAME: outbox_slot
    volumes:
      - ./dev/postgres/provision-changefeed.sh:/usr/local/bin/provision-changefeed.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/provision-changefeed.sh"]
    depends_on:
      psql:
        condition: service_healthy
    restart: "no"

  billing-psql:
    image: postgres:18
    container_name: billing-psql
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing_admin
      POSTGRES_PASSWORD: billing_secure_password
    ports:
      - "15435:5432" # Direct debug port for billing migrations
    volumes:
      - billing_psql_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U billing_admin -d billing" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cost-manager:
    build:
      context: ../cost-manager
      dockerfile: Dockerfile.dev
    container_name: cost-manager
    ports:
      - "8084:8084" # REST API port
      - "9094:9094" # gRPC port
    environment:
      - DATABASE_URL=postgres://billing_admin:billing_secure_password@billing-psql:5432/billing?sslmode=disable
      - CLICKHOUSE_URL=http://clickhouse-server:8123
      # [COMMENT]: Shared Redis chứa cache/pubsub/lock và bounded AOF-backed Central Streams.
      - CACHE_REDIS_URL=redis://controlplane-cp-redis:6379
      # [COMMENT]: Embedded Cost Engine dùng cùng Shared Redis cho lock và pricing PubSub.
      - REDIS_URL=redis://controlplane-cp-redis:6379/0
      # [COMMENT]: Cost chỉ thấy authz/proof namespace qua ACL, không thể đọc Trinity session của ACR.
      - AUTH_REDIS_URL=redis://cost:aurora-dev-cost-secret@controlplane-acr-redis:6379/0
    volumes:
      - ../cost-manager/api:/app/api
    depends_on:
      billing-psql:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
      acr-redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
    restart: unless-stopped

  pbouncer:
    image: edoburu/pgbouncer:latest
    container_name: controlplane-pbouncer
    environment:
      - LISTEN_PORT=6432
      - DB_HOST=psql
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=controlplane
      - POOL_MODE=transaction
      # ================================================================
      # SECURITY: scram-sha-256 — native PostgreSQL 17 auth protocol.
      # AUTH_QUERY lets PgBouncer fetch the scram verifier directly from
      # pg_shadow, bypassing the MD5 userlist.txt mismatch entirely.
      # AUTH_USER must be a superuser (or pg_shadow member) to run the query.
      # ================================================================
      - AUTH_TYPE=scram-sha-256
      - AUTH_USER=postgres
      - AUTH_QUERY=SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - STATS_PERIOD=3600
    ports:
      - "15433:6432" # Transparent host port replacement for developer tools
    depends_on:
      psql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-d", "controlplane", "-U", "postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  psql-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: controlplane-psql-exporter
    environment:
      # [SECURITY]: Chuỗi kết nối sử dụng tài khoản postgres_exporter chuyên dụng có quyền pg_monitor.
      # Không sử dụng tài khoản root 'postgres' để đảm bảo tuân thủ tiêu chuẩn an ninh thông tin.
      - DATA_SOURCE_URI=psql:5432/controlplane?sslmode=disable
      - DATA_SOURCE_USER=postgres_exporter
      - DATA_SOURCE_PASS=postgres_exporter_password
      # [OPTIMIZATION]: Tối ưu hóa tần suất truy vấn và phòng ngừa lỗi cạn kiệt pool kết nối (Connection Exhaustion).
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=true # Đặt true để tắt collector mặc định vì đã tự định nghĩa pg_settings.
      - PG_EXPORTER_AUTO_DISCOVER_DATABASES=false # Chỉ giám sát db controlplane để hạn chế số lượng active backends.
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./dev/postgres/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      psql:
        condition: service_healthy
    restart: unless-stopped
    command: [ "--disable-default-metrics", "--no-collector.database", "--no-collector.locks", "--no-collector.replication", "--no-collector.replication_slot", "--no-collector.roles", "--no-collector.stat_bgwriter", "--no-collector.stat_database", "--no-collector.stat_progress_vacuum", "--no-collector.stat_user_tables", "--no-collector.statio_user_tables", "--no-collector.wal" ]

  redis-exporter:
    image: oliver006/redis_exporter:v1.85.0
    container_name: controlplane-redis-exporter
    command: [ "-redis.addr=redis://controlplane-cp-redis:6379" ]
    environment:
      # [COMMENT]: Exporter chỉ scrape rebuildable Shared L2; không được cấp credential Auth Redis.
      - REDIS_ADDR=redis://controlplane-cp-redis:6379
    depends_on:
      cp-redis:
        condition: service_healthy
    restart: unless-stopped

  acr-redis:
    image: redis:8.8.0
    container_name: controlplane-acr-redis
    # [COMMENT]: DB 0 duy nhất tương thích Redis Cluster; prefix + ACL cô lập session và authz projection.
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--aclfile", "/usr/local/etc/redis/users.acl" ]
    ports:
      - "16380:6379" # Port core Redis dùng cho Identity Sessions và Rate Limiting của ACR
    volumes:
      - controlplane_acr_redis_data:/data
      - ./dev/redis/auth-users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "health", "--pass", "aurora-dev-health-secret", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cp-redis:
    image: redis:8.8.0
    container_name: controlplane-cp-redis
    # [COMMENT]: AOF phục hồi bounded Stream sau restart; volatile-lru chỉ được
    # evict cache key có TTL, không được xóa stream entry đang chờ consumer.
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru" ]
    ports:
      - "16381:6379" # Port dùng cho L2 Cache của Controlplane
    volumes:
      - controlplane_cp_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: controlplane-nats
    # [COMMENT]: NATS Core trung tâm chỉ chở realtime soft state; ownership nội vùng dùng Shared Redis.
    command: [ "-js", "-sd", "/data", "-m", "8222" ]
    ports:
      - "4222:4222" # Port client kết nối NATS
      - "8222:8222" # Port monitor NATS HTTP
    volumes:
      - controlplane_nats_data:/data
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "4222" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # [COMMENT]: Dev local chạy 1 combined broker/controller KRaft; replication=1 để tiết kiệm tài nguyên CPU.
  kafka-1:
    image: apache/kafka:3.9.0
    container_name: aurora-kafka-1
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      # [COMMENT]: Quorum voter chỉ bao gồm single node kafka-1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # [COMMENT]: Cấu hình 1-node replication factor và ISR cho local dev
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "19092:19092"
    volumes:
      - controlplane_kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # [COMMENT]: Topic provisioning cho Single-node Kafka trong môi trường Dev.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: aurora-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        BOOTSTRAP="kafka-1:9092"
        create_topic() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" \
            --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1 \
            --config min.insync.replicas=1
        }
        create_topic aurora.jobs.commands.zone.019f3d3e-997d-7894-9236-c5122634cb4f.v1 6
        create_topic aurora.jobs.results.v1 12
        create_topic aurora.jobs.dlq.v1 6
        create_topic aurora.zone.metadata.queries.v1 6
        create_topic aurora.zone.reports.v1 6
        create_topic aurora.storage.sizes.v1 6
        create_topic aurora.iam.account-verification.v1 6
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" \
          --create --if-not-exists \
          --topic aurora.zone.metadata.019f3d3e-997d-7894-9236-c5122634cb4f.v1 \
          --partitions 1 --replication-factor 1 \
          --config cleanup.policy=compact --config min.insync.replicas=1
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: aurora-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: "aurora-dev"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:9092"
      KAFKA_CLUSTERS_0_READONLY: "true"
    ports:
      - "18080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  nats-zone-z1:
    image: nats:2.10-alpine
    container_name: dataplane-zone-z1-nats
    # [COMMENT]: Database KV riêng của Zone 1; JetStream file storage không dùng chung NATS Core trung tâm.
    command: [ "-js", "-sd", "/data", "-m", "8222" ]
    ports:
      - "14222:4222"
      - "18222:8222"
    volumes:
      - dataplane_zone_z1_nats_data:/data
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "4222" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  dataplane-vn-n1:
    build:
      context: ../dataplane
      dockerfile: Dockerfile.prod
      args:
        LOCAL_USER: phucle
        LOCAL_UID: 1000
        LOCAL_GID: 1000
    container_name: dataplane-vn-n1
    init: true
    environment:
      ZONE_ID: "019f3d3e-997d-7894-9236-c5122634cb4f"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092"
      # [COMMENT]: Core NATS chỉ chở watch/runtime soft state; không trỏ vào Zone JetStream KV.
      NATS_URL: "nats://nats:4222"
      NATS_ZONE_URL: "nats://nats-zone-z1:4222"
      NATS_ZONE_KV_REPLICAS: "1"
      # Policy file path khớp với volume mount /etc/dataplane/policy.yaml.
      APP_LOG_LEVEL: "info"
      TZ: "Asia/Ho_Chi_Minh"
      # Cổng export Prometheus metrics endpoint /metrics
      METRICS_PORT: "2112"
      # Endpoint gRPC của OTel Collector để gửi traces (Tempo)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://controlplane-otel-collector:4317"
