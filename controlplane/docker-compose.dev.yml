  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: controlplane-otel-collector
    # Chạy với quyền root (0:0) để có quyền đọc file logs trong /var/lib/docker/containers
    user: "0:0"
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      # Nạp tệp cấu hình các receivers, processors, và exporters của OpenTelemetry.
      - ./dev/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
      # Gắn thư mục chứa logs của Docker container để filelog đọc trực tiếp log file
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # [COMMENT]: Mount docker.sock để OpenTelemetry Collector giao tiếp với Docker Daemon truy vấn container metadata.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Filelog checkpoints survive collector restarts to bound duplicate/lost ingestion.
      - controlplane_otel_file_storage:/var/lib/otelcol/file_storage
    ports:
      - "14317:4317" # Cổng nhận OpenTelemetry gRPC Traces & Metrics
      - "14318:4318" # Cổng nhận OpenTelemetry HTTP Traces & Metrics
    depends_on:
      victoriatraces:
        condition: service_started
      clickhouse:
        condition: service_started
    restart: unless-stopped

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    container_name: controlplane-victoriatraces
    command:
      - "-storageDataPath=/vtraces"
      - "-httpListenAddr=:10428"
    volumes:
      - controlplane_vtraces_data:/vtraces
    ports:
      - "10428:10428" # Cổng OTLP ingestion & Jaeger-compatible query API
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: controlplane-victoriametrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    volumes:
      - controlplane_vmetrics_data:/victoria-metrics-data
    ports:
      - "8428:8428" # Cổng Remote Write và query API của VictoriaMetrics
    restart: unless-stopped

  victorialogs:
