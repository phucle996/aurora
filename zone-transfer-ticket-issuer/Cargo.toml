[package]
name = "zone-transfer-ticket-issuer"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
async-nats = "0.49"
axum = "0.7"
base64 = "0.22"
bytes = "1.7"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.8", features = ["v4"] }
zone-transfer-contract = { path = "../zone-transfer-contract" }
