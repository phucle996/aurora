syntax = "proto3";

package iam.rpc;

option go_package = "controlplane/internal/iam/transport/rpc/proto;iamproto";

service SessionService {
  // RPC khởi tạo bộ Trinity Credentials & lưu phiên khi Login thành công
  rpc ReleaseTrinitySession (ReleaseTrinitySessionRequest) returns (ReleaseTrinitySessionResponse);

  // [NEW] RPC to revoke runtime L2 sessions belonging to specific devices of a user
  rpc RevokeUserSessionsByDevices (RevokeUserSessionsByDevicesRequest) returns (RevokeUserSessionsByDevicesResponse);
}

// Request gửi thông tin định danh & thiết bị sau khi IAM xác thực thành công
message ReleaseTrinitySessionRequest {
  string user_id = 1;              // UUID dạng string của User (để làm claim 'sub' JWT & Key Redis)
  string device_id = 2;            // UUID của thiết bị trong DB PostgreSQL (lưu vào session 'tdid')
  string client_device_id = 3;     // Cookie client_device_id hiện tại (nếu có) để gắn kết thiết bị
  string username = 4;             // Tên đăng nhập của user (phục vụ audit & logs)
  string role = 5;                 // Vai trò của user (lưu vào claim 'role' JWT)
  int32 level = 6;                 // Cấp độ bảo mật (lưu vào claim 'lvl' JWT, vd: 0 = cao nhất)
  string tenant_id = 7;            // ID của Tenant (lưu vào claim 'tenant_id' JWT)
  string zone_id = 8;              // ID của Zone hoạt động (lưu vào claim 'zone_id' JWT)
  bool trust_device = 9;           // Flag xác định user có chọn tin cậy thiết bị (để ACL quyết định cấp Refresh Token)
  string client_ip = 10;           // IP của client đăng nhập (để lưu metadata phiên & audit)
  string user_agent = 11;          // User-Agent của client (để lưu metadata phiên & audit)
  string refresh_token = 12;       // Opaque refresh token thô do CP tạo (truyền cho ACL set cookie, rỗng nếu trust_device=false)
}

// Response chứa kết quả khởi tạo phiên
message ReleaseTrinitySessionResponse {
  bool released = 1;               // Trả về true nếu khởi tạo phiên thành công
}

// [NEW] Request payload for device-specific session revocation
message RevokeUserSessionsByDevicesRequest {
  string user_id = 1;              // The UUID of the user
  repeated string device_ids = 2;  // The list of device UUIDs to revoke sessions for
}

// [NEW] Response payload returning status
message RevokeUserSessionsByDevicesResponse {
  int64 revoked_count = 1;         // Total number of sessions successfully transitioned to grace period
}

