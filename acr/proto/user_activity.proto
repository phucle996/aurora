syntax = "proto3";
package activity;

// Byte-identical with notification-service/proto/user_activity.proto.
message UserActivityEvent {
  string event_id = 1;
  string user_id = 2;
  string category = 3;
  string action = 4;
  string actor_type = 5;
  string actor_id = 6;
  string outcome = 7;
  string source_service = 8;
  string resource_type = 9;
  string resource_id = 10;
  string operation_id = 11;
  string title = 12;
  string summary = 13;
  int64 occurred_at = 14;
  string metadata_json = 15;
  uint32 schema_version = 16;
  string trace_parent = 17;
  string trace_state = 18;
}
