syntax = "proto3";
package iam.rpc;

// Đường dẫn package Go khi sinh code
option go_package = "controlplane/internal/iam/transport/rpc/proto;iamproto";

// Dịch vụ xác thực Trinity Token gRPC kết nối giữa Notification Service (Rust) và Controlplane (Go)
service AuthService {
  // Xác thực Trinity credentials cho Admin/SRE quản trị hệ thống
  rpc VerifyAdminTrinityToken (VerifyAdminTrinityTokenRequest) returns (VerifyAdminTrinityTokenResponse);

  // Xác thực Trinity credentials cho người dùng (End-User) thông thường
  rpc VerifyUserTrinityToken (VerifyUserTrinityTokenRequest) returns (VerifyUserTrinityTokenResponse);

  // Xác thực Opaque Refresh Token lưu trong database (gọi nội bộ từ ACR Service)
  rpc VerifyOpaqueRefreshToken (VerifyOpaqueRefreshTokenRequest) returns (VerifyOpaqueRefreshTokenResponse);

  // [COMMENT]: Thu hồi Opaque Refresh Token bất đồng bộ khi user thực hiện logout qua Gateway
  rpc RevokeOpaqueRefreshToken (RevokeOpaqueRefreshTokenRequest) returns (RevokeOpaqueRefreshTokenResponse);

  // [COMMENT]: Xác thực thông tin đăng nhập và thông tin thiết bị thô của người dùng
  rpc VerifyUserCredentials (VerifyUserCredentialsRequest) returns (VerifyUserCredentialsResponse);
}

// Request xác thực cho Admin/SRE
message VerifyAdminTrinityTokenRequest {
  string admin_api_token = 1;
  string access_key = 2;
  string access_secret = 3;
}

// Response trả về cho Admin/SRE
message VerifyAdminTrinityTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
}

// Request xác thực cho End-User
message VerifyUserTrinityTokenRequest {
  string access_token = 1;
  string access_key = 2;
  string access_secret = 3;
}

// Response trả về cho End-User
message VerifyUserTrinityTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
  string zone_id = 4;
}

// Request xác thực Opaque Refresh Token
message VerifyOpaqueRefreshTokenRequest {
  string refresh_token = 1;
  string scope = 2;
}

// Response trả về khi xác thực Opaque Refresh Token
message VerifyOpaqueRefreshTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string tenant_id = 3;
  string role = 4;
  int32 level = 5;
  string error_message = 6;
  string username = 7;
}

// [COMMENT]: Request chứa raw refresh token từ client cookie để CP hash & revoke
message RevokeOpaqueRefreshTokenRequest {
  string refresh_token = 1;
}

// [COMMENT]: Response rỗng phục vụ tín hiệu hoàn tất cho rpc call
message RevokeOpaqueRefreshTokenResponse {
}

// [COMMENT]: Request xác thực thông tin đăng nhập thô từ client gửi lên gateway
message VerifyUserCredentialsRequest {
  string username = 1;         // Tên đăng nhập hoặc Email của người dùng
  string password = 2;         // Mật khẩu dạng plain-text cần xác thực
  string client_device_id = 3;  // UUID định danh thiết bị gửi lên từ cookie (nếu có)
  string device_name = 4;      // Tên hiển thị của thiết bị (ví dụ: Chrome on Windows)
  string device_type = 5;      // OS/Platform và phiên bản của thiết bị (ví dụ: "Windows 11", "macOS 14", "iOS 17")
  string public_key = 6;       // Khóa Ed25519 public key dạng base64 phục vụ xác thực chữ ký/thiết bị tin cậy
  string signature = 7;        // Chữ ký bảo mật (signature) nếu có
  bool trust_device = 8;       // Cờ xác định có cấp refresh token hay không (trusted device)
  string client_ip = 9;        // Địa chỉ IP của Client (trích xuất từ X-Forwarded-For hoặc Envoy context)
  string user_agent = 10;      // Chuỗi User-Agent của client phục vụ tracking
}

// [COMMENT]: Response trả về trạng thái xác thực và các thông tin định danh/claim
message VerifyUserCredentialsResponse {
  bool valid = 1;              // Cờ báo hiệu xác thực thông tin thành công hay thất bại
  string user_id = 2;          // UUID của người dùng dưới dạng chuỗi
  string role = 3;             // Quyền của người dùng (RBAC role - ví dụ: user, admin)
  int32 level = 4;             // Cấp độ quyền (level)
  string tenant_id = 5;        // ID của Tenant liên đới (nếu có)
  string client_device_id = 6;  // UUID thiết bị được ghi nhận/sinh mới sau khi gắn kết thành công
  string refresh_token = 7;    // Opaque Refresh Token được sinh bởi CP để ACR ghi nhận cookie (nếu trust_device=true)
  string error_message = 8;    // Mô tả lỗi chi tiết nếu valid = false
  string username = 9;         // Tên đăng nhập của người dùng
}

