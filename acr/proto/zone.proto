// [COMMENT]: File proto này phải đồng bộ với controlplane/internal/hierarchy/transport/proto/zone.proto

syntax = "proto3";

package hierarchy.rpc;

option go_package = "controlplane/internal/hierarchy/transport/proto;hierarchyproto";

// ─── Zone Messages ────────────────────────────────────────────────────────────

message GetZoneListRequest {}

message ZoneEntry {
  string zone_id   = 1;
  string zone_code = 2;
  string status    = 3;
  string name      = 4;
}

message GetZoneListResponse {
  repeated ZoneEntry zones = 1;
}

message ResolveZoneRequest {
  string zone_code = 1;
}

message ResolveZoneResponse {
  bool   found   = 1;
  string zone_id = 2;
  string status  = 3;
  string name    = 4;
}

// ─── Services ─────────────────────────────────────────────────────────────────

service ZoneService {
  rpc GetZoneList  (GetZoneListRequest)  returns (GetZoneListResponse);
  rpc ResolveZone  (ResolveZoneRequest)  returns (ResolveZoneResponse);
}

message ZoneInvalidatedEvent {
  string zone_id = 1;
  string zone_code = 2;
  string status = 3;
  string name = 4;
  bool deleted = 5;
}
