name: Central Release

on:
  push:
    tags:
      - "cp-v*"
      - "acr-v*"
      - "jo-v*"
      - "notification-service-v*"
      - "cost-manager-v*"
      - "cloud-console-v*"
      - "admin-ui-v*"
      - "cost-console-v*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: central-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.component.outputs.image }}
      context: ${{ steps.component.outputs.context }}
      dockerfile: ${{ steps.component.outputs.dockerfile }}
      version: ${{ steps.component.outputs.version }}
      component: ${{ steps.component.outputs.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: component
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            cp-v*)
              prefix=cp
              component=controlplane
              image_name=aurora-controlplane
              context=controlplane
              dockerfile=controlplane/Dockerfile.prod
              source_paths=(controlplane proto/controlplane proto/iam_auth.proto proto/managed_service.proto proto/platform_transport.proto proto/zone_report.proto .github/workflows/central-release.yml)
              ;;
            acr-v*)
              prefix=acr
              component=acr
              image_name=aurora-acr
              # ACR's build script compiles the canonical IAM contract from
              # ../proto, so its Docker build must retain monorepo-root
              # visibility instead of isolating the context to acr/.
              context=.
              dockerfile=acr/Dockerfile
              source_paths=(acr proto/acr proto/iam_auth.proto .github/workflows/central-release.yml)
              ;;
            jo-v*)
              prefix=jo
              component=job-orchestrator
              image_name=aurora-job-orchestrator
              context=.
              dockerfile=job-orchestrator/Dockerfile
              source_paths=(job-orchestrator proto/job-orchestrator proto/cost-manager/engine/storage_usage_report.proto proto/managed_service.proto proto/platform_transport.proto proto/zone_report.proto .dockerignore .github/workflows/central-release.yml)
              ;;
            notification-service-v*)
              prefix=notification-service
              component=notification-service
              image_name=aurora-notification-service
              context=notification-service
              dockerfile=notification-service/Dockerfile
              source_paths=(notification-service proto/notification-service .github/workflows/central-release.yml)
              ;;
            cost-manager-v*)
              prefix=cost-manager
              component=cost-manager
              image_name=aurora-cost-manager
              context=.
              dockerfile=cost-manager/Dockerfile.dev
              source_paths=(cost-manager proto/cost-manager .github/workflows/central-release.yml)
              ;;
            cloud-console-v*)
              prefix=cloud-console
              component=cloud-console
              image_name=aurora-cloud-console
              context=cloud-console
              dockerfile=cloud-console/Dockerfile.prod
              source_paths=(cloud-console .github/workflows/central-release.yml)
              ;;
            admin-ui-v*)
              prefix=admin-ui
              component=admin-ui
              image_name=aurora-admin-ui
              context=admin-ui
              dockerfile=admin-ui/Dockerfile.nginx
              source_paths=(admin-ui .github/workflows/central-release.yml)
              ;;
            cost-console-v*)
              prefix=cost-console
              component=cost-console
              image_name=aurora-cost-console
              context=cost-console
              dockerfile=cost-console/Dockerfile.nginx
              source_paths=(cost-console .github/workflows/central-release.yml)
              ;;
            *)
              echo "Unsupported Central release tag: $tag" >&2
              exit 1
              ;;
          esac
          previous_tag=""
          if git rev-parse "$GITHUB_SHA^" >/dev/null 2>&1; then
            previous_tag="$(git tag --merged "$GITHUB_SHA^" --list "${prefix}-v*" --sort=-version:refname | head -n 1)"
          fi
          if [[ -n "$previous_tag" ]] && git diff --quiet "$previous_tag" "$GITHUB_SHA" -- "${source_paths[@]}"; then
            echo "Tag $tag has no source change since $previous_tag for $component" >&2
            exit 1
          fi
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/$image_name" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "version=${tag#${prefix}-}" >> "$GITHUB_OUTPUT"
          echo "component=$component" >> "$GITHUB_OUTPUT"

  build-scan-promote:
    needs: resolve
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.resolve.outputs.image }}
      VERSION: ${{ needs.resolve.outputs.version }}
      COMPONENT: ${{ needs.resolve.outputs.component }}
      STAGING_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Refuse to overwrite an existing release tag
        shell: bash
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists: $IMAGE:$VERSION" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v7
        with:
          context: ${{ needs.resolve.outputs.context }}
          file: ${{ needs.resolve.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.STAGING_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=aurora-${{ env.COMPONENT }}
          cache-from: type=gha,scope=central-${{ env.COMPONENT }}
          cache-to: type=gha,mode=max,scope=central-${{ env.COMPONENT }}
          provenance: mode=max
          sbom: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.STAGING_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy-image-report.json
      - name: Enforce image vulnerability policy with annotations
        shell: bash
        run: |
          findings="$(jq -r '
            .Results[]? as $result |
            $result.Vulnerabilities[]? |
            select(.Severity == "HIGH" or .Severity == "CRITICAL") |
            "\($result.Target): \(.VulnerabilityID) in \(.PkgName) \(.InstalledVersion); fixed: \(.FixedVersion // "none")"
          ' trivy-image-report.json)"
          if [[ -z "$findings" ]]; then
            exit 0
          fi
          while IFS= read -r finding; do
            echo "::error title=Trivy image vulnerability::$finding"
          done <<< "$findings"
          exit 1
      - name: Promote scanned image to immutable release tag
        shell: bash
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$STAGING_TAG"
      - name: Record deployable digest
        shell: bash
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          printf 'AURORA_%s_IMAGE=%s@%s\n' "$(printf '%s' "$COMPONENT" | tr '[:lower:]-' '[:upper:]_')" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
