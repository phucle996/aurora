name: Zone CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "dataplane/**"
      - "zone-runtime-stream/**"
      - "zone-control-edge-gateway/authorizer/**"
      - "contracts/**"
      - ".github/workflows/zone-ci.yml"
  push:
    branches: [main]
    paths:
      - "dataplane/**"
      - "zone-runtime-stream/**"
      - "zone-control-edge-gateway/authorizer/**"
      - "contracts/**"
      - ".github/workflows/zone-ci.yml"

permissions:
  contents: read

concurrency:
  group: zone-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      dataplane: ${{ steps.scope.outputs.dataplane }}
      runtime_stream: ${{ steps.scope.outputs.runtime_stream }}
      authorizer: ${{ steps.scope.outputs.authorizer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "dataplane=true" >> "$GITHUB_OUTPUT"
            echo "runtime_stream=true" >> "$GITHUB_OUTPUT"
            echo "authorizer=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi
          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 "$head_sha")"
          fi
          git diff --name-only "$base_sha" "$head_sha" > "$RUNNER_TEMP/changed-files"
          all=false
          if grep -Eq '^\.github/workflows/zone-ci\.yml$' "$RUNNER_TEMP/changed-files"; then all=true; fi
          if $all || grep -Eq '^(dataplane/|contracts/)' "$RUNNER_TEMP/changed-files"; then echo "dataplane=true" >> "$GITHUB_OUTPUT"; else echo "dataplane=false" >> "$GITHUB_OUTPUT"; fi
          if $all || grep -Eq '^zone-runtime-stream/' "$RUNNER_TEMP/changed-files"; then echo "runtime_stream=true" >> "$GITHUB_OUTPUT"; else echo "runtime_stream=false" >> "$GITHUB_OUTPUT"; fi
          if $all || grep -Eq '^zone-control-edge-gateway/authorizer/' "$RUNNER_TEMP/changed-files"; then echo "authorizer=true" >> "$GITHUB_OUTPUT"; else echo "authorizer=false" >> "$GITHUB_OUTPUT"; fi

  dataplane:
    needs: changes
    if: needs.changes.outputs.dataplane == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dataplane
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "dataplane -> target"
          shared-key: zone-dataplane
      - run: cargo fmt --check
      - name: cargo clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          status="${PIPESTATUS[0]}"
          if [[ "$status" -ne 0 ]]; then
            {
              echo "## Dataplane Clippy diagnostics"
              echo '```text'
              tail -n 200 "$RUNNER_TEMP/clippy.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostics="$(grep -n -C 2 '^error' "$RUNNER_TEMP/clippy.log" | tr '\n' ' ' | cut -c1-6000)"
            echo "::error title=Dataplane Clippy::${diagnostics:-See the job summary for diagnostics.}"
            exit "$status"
          fi
      - run: cargo test
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: dataplane
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  runtime-stream:
    needs: changes
    if: needs.changes.outputs.runtime_stream == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zone-runtime-stream
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "zone-runtime-stream -> target"
          shared-key: zone-runtime-stream
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: zone-runtime-stream
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  authorizer:
    needs: changes
    if: needs.changes.outputs.authorizer == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zone-control-edge-gateway/authorizer
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "zone-control-edge-gateway/authorizer -> target"
          shared-key: zone-authorizer
      - run: cargo fmt --check
      - name: cargo clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          status="${PIPESTATUS[0]}"
          if [[ "$status" -ne 0 ]]; then
            {
              echo "## Authorizer Clippy diagnostics"
              echo '```text'
              tail -n 200 "$RUNNER_TEMP/clippy.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostics="$(grep -n -C 2 '^error' "$RUNNER_TEMP/clippy.log" | tr '\n' ' ' | cut -c1-6000)"
            echo "::error title=Authorizer Clippy::${diagnostics:-See the job summary for diagnostics.}"
            exit "$status"
          fi
      - run: cargo test
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: zone-control-edge-gateway/authorizer
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
