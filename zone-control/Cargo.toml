[package]
name = "zone-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
async-nats = "0.49"
axum = "0.7"
base64 = "0.22"
bytes = "1.7"
prost = "0.11"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.8", features = ["v4"] }

[build-dependencies]
prost-build = "0.11"
protoc-bin-vendored = "3"
