[package]
name = "zone-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
async-nats = "0.49"
ahash = "0.8"
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-credential-types = "1.2"
aws-sdk-s3 = { version = "1.38", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio"] }
axum = "0.7"
base64 = "0.22"
bytes = "1.7"
clickhouse = { version = "0.13", features = ["uuid", "chrono", "time"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
krafka = { version = "0.11.0", default-features = false, features = ["gzip", "snappy", "lz4", "zstd", "native-tls-roots", "ring"] }
prost = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }

[build-dependencies]
prost-build = "0.11"
protoc-bin-vendored = "3"
