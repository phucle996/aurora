# Aurora AdminUI — nginx reverse proxy
# All API traffic → single controlplane upstream

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name __DOMAIN__;

  ssl_certificate     __TLS_CERT__;
  ssl_certificate_key __TLS_KEY__;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_timeout 10m;
  ssl_prefer_server_ciphers off;

  root  __ADMINUI_ROOT__;
  index index.html;

  add_header X-Frame-Options            "DENY"                            always;
  add_header X-Content-Type-Options     "nosniff"                         always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

  # ── All /admin/* API → controlplane ──
  location /admin/ {
    proxy_pass         __CONTROLPLANE_UPSTREAM__;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # ── /api/* → controlplane ──
  location /api/ {
    proxy_pass         __CONTROLPLANE_UPSTREAM__;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # ── Static assets (Vite) ──
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── SPA fallback ──
  location / {
    try_files $uri $uri/ /index.html;
  }
}
