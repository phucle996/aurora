syntax = "proto3";

package mail.runtime.v1;

option go_package = "controlplane/internal/mail/transport/proto;mailproto";

// [COMMENT]: Contract này chỉ mang desired state/template snapshot từ Controlplane xuống Zone.
// Runtime read state được OTel của Zone thu thập vào Victoria, không reverse-stream về Central.
// Owner/workspace/Zone nằm trong consumer snapshot để Zone Public Edge có durable registration
// khi kiểm tra ACR runtime assertion; các field này không được Dataplane dùng để authorize command.
// Broker config chỉ xuất hiện dưới dạng ciphertext envelope; không message nào chứa plaintext credential,
// rendered body hoặc template variables thô.

enum MailConsumerDesiredState {
  MAIL_CONSUMER_DESIRED_STATE_UNSPECIFIED = 0;
  MAIL_CONSUMER_DESIRED_STATE_PAUSED = 1;
  MAIL_CONSUMER_DESIRED_STATE_ENABLED = 2;
}

message MailEventMetadataV1 {
  // [COMMENT]: UUIDv5 16-byte id, deterministic từ aggregate id + version + event type.
  bytes event_id = 1;
  // [COMMENT]: Bằng 1 cho toàn bộ message V1 trong file này.
  uint32 schema_version = 2;
  // [COMMENT]: Unix epoch milliseconds UTC do producer tạo event ghi nhận.
  int64 occurred_at_unix_ms = 3;
  // [COMMENT]: W3C traceparent; không chứa baggage của khách hàng.
  string traceparent = 4;
  // [COMMENT]: Tên workload nội bộ tạo event, phục vụ audit chứ không dùng authorization.
  string producer = 5;
}

enum MailStreamType {
  MAIL_STREAM_TYPE_UNSPECIFIED = 0;
  MAIL_STREAM_TYPE_KAFKA = 1;
  MAIL_STREAM_TYPE_REDIS_STREAM = 2;
  MAIL_STREAM_TYPE_NATS_JETSTREAM = 3;
  MAIL_STREAM_TYPE_RABBITMQ = 4;
}

message MailStreamSourceV1 {
  // [COMMENT]: Discriminator nằm trong protobuf payload của outbox; JO chỉ chuyển tiếp bytes và DP mới dispatch adapter.
  MailStreamType stream_type = 1;
  // [COMMENT]: Version của payload adapter bên dưới; unknown version chỉ cô lập consumer này.
  uint32 payload_schema_version = 2;
  // [COMMENT]: UUID 16-byte của broker binding đã được Controlplane authorization.
  bytes broker_resource_id = 3;
  // [COMMENT]: Opaque adapter protobuf; outer contract không cần thêm field mỗi khi có stream mới.
  bytes payload = 4;
}

message KafkaStreamPayloadV1 {
  // [COMMENT]: Opaque encrypted connection envelope; CP/JO/Zone KV không giải mã.
  bytes source_config_envelope = 1;
  // [COMMENT]: Topic cụ thể đã được authorization; DP không nhận topic từ từng broker message.
  string topic = 2;
  // [COMMENT]: Consumer group ổn định của connector.
  string consumer_group = 3;
}

message RedisStreamPayloadV1 {
  // [COMMENT]: Ciphertext chứa URL/TLS/auth; chỉ Redis Stream suite tại Zone được giải mã.
  bytes source_config_envelope = 1;
  string stream_key = 4;
  string consumer_group = 5;
}

message NatsJetStreamPayloadV1 {
  // [COMMENT]: NATS customer connection độc lập với NATS Core trung tâm và Zone NATS KV.
  bytes source_config_envelope = 1;
  string stream_name = 6;
  string durable_name = 7;
}

message RabbitMqPayloadV1 {
  // [COMMENT]: Ciphertext chứa AMQPS endpoint/auth; plaintext chỉ tồn tại trong RabbitMQ suite.
  bytes source_config_envelope = 1;
  string queue_name = 8;
  string consumer_tag_prefix = 9;
}

message MailConsumerUpsertV1 {
  MailEventMetadataV1 metadata = 1;
  // [COMMENT]: UUID 16-byte của consumer aggregate; globally unique để DP không cần workspace prefix.
  bytes consumer_id = 2;
  // [COMMENT]: Monotonic version; DP chỉ apply version lớn hơn version hiện có.
  uint64 config_version = 3;
  MailStreamSourceV1 stream = 4;
  // [COMMENT]: Field mapping cũ bị loại bỏ; broker payload V1 luôn là fixed envelope {to, parameter}.
  reserved 5;
  // [COMMENT]: Template identity được bind cố định tại config, không đọc từ customer broker payload.
  string template_id = 6;
  // [COMMENT]: Immutable content version; luôn lớn hơn 0.
  uint64 template_version = 7;
  // [COMMENT]: Sender identity được bind cố định tại config, không đọc từ customer broker payload.
  string sender_profile_id = 8;
  // [COMMENT]: Immutable sender version; luôn lớn hơn 0.
  uint64 sender_version = 9;
  MailConsumerDesiredState desired_state = 10;
  // [COMMENT]: Số runtime slots tối đa; mỗi broker suite tự diễn giải connection/consumer concurrency.
  uint32 parallelism = 11;
  // [COMMENT]: SHA-256 32-byte của canonical config để phát hiện cùng version nhưng khác payload.
  bytes config_sha256 = 12;
  // [COMMENT]: Runtime read registration phẳng; owner_id là user cho PERSONAL và tenant cho TENANT.
  bytes owner_id = 13;
  string owner_type = 14;
  bytes workspace_id = 15;
  bytes zone_id = 16;
}

message MailConsumerDeleteV1 {
  MailEventMetadataV1 metadata = 1;
  bytes consumer_id = 2;
  // [COMMENT]: Tombstone version phải lớn hơn mọi upsert version trước đó.
  uint64 config_version = 3;
  // [COMMENT]: DP ngừng poll, drain outstanding rồi đóng connection trong giới hạn này.
  uint32 drain_timeout_seconds = 4;
  // [COMMENT]: Sanitized operator reason; không chứa secret hoặc customer payload.
  string reason = 5;
}

message MailTemplateVersionPublishedV1 {
  MailEventMetadataV1 metadata = 1;
  // [COMMENT]: Globally unique identity; scope/workspace đã được CP xử lý trước projection.
  string template_id = 2;
  // [COMMENT]: Monotonic revision dùng chống event publish/delete đến sai thứ tự.
  uint64 template_revision = 3;
  // [COMMENT]: Immutable content version được consumer pin; luôn lớn hơn 0.
  uint64 template_version = 4;
  string subject_template = 5;
  reserved 6;
  bytes html_template = 7;
  reserved 8;
  // [COMMENT]: SHA-256 32-byte của canonical immutable template content.
  bytes content_sha256 = 9;
}

message MailTemplateDeletedV1 {
  MailEventMetadataV1 metadata = 1;
  string template_id = 2;
  // [COMMENT]: Revision tombstone lớn hơn mọi lifecycle revision trước đó.
  uint64 template_revision = 3;
  // [COMMENT]: Runtime xóa cache sau hard-delete đã được Controlplane kiểm tra không còn consumer active tham chiếu.
  uint64 last_published_version = 4;
}

// [COMMENT]: Marker kết thúc một full DB-backed reconciliation; không mang Zone vì stream envelope đã route.
message MailProjectionReconcileCompletedV1 {
  MailEventMetadataV1 metadata = 1;
  uint64 reconcile_generation = 2;
  int64 completed_at_unix_ms = 3;
}

// [COMMENT]: Platform producer như IAM dùng Protobuf để không đưa JSON vào
// Kafka nội bộ. Ordinary customer brokers vẫn có thể gửi fixed JSON envelope;
// processor phân biệt bằng decode fail-close và cùng validation limits.
message MailDispatchEnvelopeV1 {
  bytes event_id = 1;
  uint32 schema_version = 2;
  string to = 3;
  map<string, string> parameter = 4;
  int64 not_after_unix_ms = 5;
}
