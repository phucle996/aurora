syntax = "proto3";
package job_lifecycle;

// Zone-local durable execution receipt. No product routing or resource state.
// Retained without TTL until terminal acknowledgement and replay retirement
// are enforced. A duplicate must not reapply a completed mutation merely
// because publishing/committing its result failed.
message JobCompletionReceiptV1 {
  uint32 schema_version = 1;
  bytes command_sha256 = 2;
  uint32 attempt = 3;
  string message = 4;
  bytes result_payload = 5;
  uint32 result_payload_schema_version = 6;
  // Receipt schema 2 stores both terminal outcomes. Schema 1 was success-only.
  string result_status = 7;
  optional string error_code = 8;
}

// Cấu trúc báo cáo kết quả thực thi dạng nhị phân Protobuf gửi từ Dataplane về Job-Proxy
message JobExecutionResultProto {
  bytes job_id = 1;         // 16 bytes UUID nhị phân thô
  uint32 job_version = 2;   // Phiên bản tác vụ để kiểm soát ghi đè (Optimistic Concurrency Control)
  uint32 attempt = 3;       // Số lần thử lại
  string result_status = 4; // Trạng thái: "SUCCEEDED" | "FAILED" | "PROCESSING"
  string job_topic = 5;     // Tên topic (e.g. "mail.test_connection") phục vụ định tuyến và audit log
  bytes trace_id = 6;       // 16 bytes Trace ID nhị phân thô để kết nối vết spans/logs
  optional string error_code = 7; // Mã lỗi (nếu có, e.g. "EXECUTION_TIMEOUT")
  string message = 8;       // Thông điệp kết quả chi tiết
	string source_domain = 9; // Domain sở hữu outbox nguồn: MAIL | STORAGE | HYPERVISOR
  // [COMMENT]: Context của Kafka producer result để JO tạo consumer span đúng parent.
  string traceparent = 10;
  string tracestate = 11;
  bytes result_payload = 12;
  uint32 result_payload_schema_version = 13;
}
