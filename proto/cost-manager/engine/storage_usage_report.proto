syntax = "proto3";

package aurora.storage.metering.v1;

// A closed, Zone-owned hourly metering window. It contains only bounded
// resource references and usage counters; it never carries a ticket, cookie,
// access secret, object key, wallet owner or raw authorization header.
message StorageUsageReportV1 {
  uint32 schema_version = 1;
  string report_id = 2;
  string zone_id = 3;
  int64 window_start_unix_ms = 4;
  int64 window_end_unix_ms = 5;
  uint64 sequence = 6;
  bool correction = 7;
  repeated StorageUsageAggregateV1 aggregates = 8;
  bytes report_sha256 = 9;
  // Set only for an append-only correction. The corrected report is never
  // deleted or mutated in place by a downstream settlement consumer.
  string correction_of_report_id = 10;
}

message StorageUsageAggregateV1 {
  // Network events use the trusted resource UUID injected by the authorizer.
  // Capacity snapshots may use resource_name until the Zone has a durable
  // resource-name mapping; Central resolves that name against ownership.
  string resource_id = 1;
  uint64 upload_bytes = 2;       // NETWORK_IN, successful upload bytes
  uint64 download_bytes = 3;     // NETWORK_OUT, successful download bytes
  uint64 request_count = 4;      // diagnostic count for transfer lines
  string resource_name = 5;      // STORAGE capacity reference, never an object key
  uint64 storage_bytes = 6;      // end-of-hour occupied capacity snapshot
  // Fixed-point billable quantity: one million units equals one GB_HOUR.
  uint64 storage_gb_hours_micros = 7;
}
