syntax = "proto3";

package aurora.transport.v1;

option go_package = "controlplane/pkg/platformtransport/proto;platformtransportproto";

enum PayloadEncodingV1 {
  PAYLOAD_ENCODING_UNSPECIFIED = 0;
  PAYLOAD_ENCODING_HPKE_X25519_HKDF_SHA256_AES_256_GCM = 1;
}

// ProtectedPayloadV1 is the opaque durable representation stored in every
// Zone-bound Controlplane outbox and forwarded byte-for-byte by JO. Routing
// metadata remains outside so JO can route/retry without any decryption key.
message ProtectedPayloadV1 {
  uint32 schema_version = 1;
  bytes recipient_zone_id = 2;
  bytes key_id = 3;
  PayloadEncodingV1 encoding = 4;
  bytes encapsulated_key = 5;
  bytes ciphertext = 6;
  uint32 plaintext_size = 7;
  reserved 8 to 15;
}

// Envelope nhị phân duy nhất cho command JO -> Dataplane.
// Topic Kafka chịu trách nhiệm route Zone; target_zone_id vẫn được echo để
// Dataplane fail-close nếu credential/topic bị cross-wire.
message JobCommandV1 {
  bytes job_id = 1;
  uint32 job_version = 2;
  uint32 attempt = 3;
  string job_topic = 4;
  string source_domain = 5;
  string resource_id = 6;
  uint32 payload_schema_version = 7;
  // Serialized ProtectedPayloadV1. Plaintext is forbidden for V1 producers.
  bytes payload = 8;
  bytes trace_id = 9;
  optional uint32 idle_seconds = 10;
  optional uint64 reconcile_generation = 11;
  string target_zone_id = 12;
  uint32 transport_schema_version = 13;
  // W3C context thuộc producer span thực tế; trace_id phía trên chỉ còn là
  // correlation ID legacy và không đủ để tái tạo parent/sampling decision.
  string traceparent = 14;
  string tracestate = 15;
  PayloadEncodingV1 payload_encoding = 16;
  uint64 delivery_epoch = 17;
  reserved 18 to 31;
}

// Dataplane cold-start gửi query durable; JO trả full aggregate vào metadata
// topic riêng của Zone thay vì request/reply qua Redis PubSub.
message ZoneMetadataQueryV1 {
  bytes request_id = 1;
  bytes zone_id = 2;
  int64 requested_at_unix_ms = 3;
  uint32 schema_version = 4;
}

message ZoneServiceDesiredStateV1 {
  string service_type = 1;
  bool enabled = 2;
}

// Full aggregate tránh lost-update giữa status và service events. Kafka
// record key là zone_id và topic được compact để cold-start luôn có
// authoritative snapshot gần nhất.
message ZoneMetadataSnapshotV1 {
  bytes event_id = 1;
  bytes zone_id = 2;
  string status = 3;
  repeated ZoneServiceDesiredStateV1 services = 4;
  int64 observed_at_unix_ms = 5;
  uint32 schema_version = 6;
}

message BucketSizeV1 {
  string bucket_name = 1;
  int64 size_bytes = 2;
}

// Mỗi fenced Zone Control shard cycle tạo một fragment. JO chỉ áp dụng các
// bucket xuất hiện trong fragment; PostgreSQL vẫn là business SoT.
message StorageBucketSizesSnapshotV1 {
  bytes event_id = 1;
  bytes zone_id = 2;
  int64 observed_at_unix_ms = 3;
  repeated BucketSizeV1 buckets = 4;
  uint32 schema_version = 5;
}

message DeadLetterRecordV1 {
  bytes event_id = 1;
  string source_topic = 2;
  int32 source_partition = 3;
  int64 source_offset = 4;
  string error_code = 5;
  string error_message = 6;
  bytes original_payload = 7;
  int64 failed_at_unix_ms = 8;
  uint32 schema_version = 9;
}
