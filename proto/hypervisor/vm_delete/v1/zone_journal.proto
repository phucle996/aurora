syntax = "proto3";

package hypervisor;

// Zone-local journal owned only by the VM delete workflow. Generic job/outbox
// contracts never acquire provider-specific columns.
message VmDeleteJournalV1 {
  uint32 schema_version = 1;
  bytes vm_id = 2;
  string provider_name = 3;
  uint64 provider_vmid = 4;
  string provider_node = 5;
  repeated string previous_task_upids = 6;
  string task_upid = 7;
  int64 provider_completed_at_unix_ms = 8;
  uint32 failed_tasks = 9;
}
