syntax = "proto3";

package hypervisor;

option go_package = "controlplane/internal/hypervisor/transport/proto;hypervisorproto";

message ImageImportV1 {
  uint32 schema_version = 1;
  bytes image_id = 2;
  bytes zone_id = 3;
  uint64 revision = 4;
  string object_key = 5;
  string format = 6;
  string architecture = 7;
  uint64 size_bytes = 8;
  bytes sha256 = 9;
}

message ImageImportResultV1 {
  uint32 schema_version = 1;
  bytes image_id = 2;
  uint64 revision = 3;
  bytes sha256 = 4;
  reserved 5, 6;
  uint64 provider_template_vmid = 7;
}

message ImageDeleteV1 {
  uint32 schema_version = 1;
  bytes image_id = 2;
  bytes zone_id = 3;
  uint64 revision = 4;
  bytes sha256 = 5;
  string object_key = 6;
  reserved 7, 8;
  uint64 provider_template_vmid = 9;
}

message ImageDeleteResultV1 {
  uint32 schema_version = 1;
  bytes image_id = 2;
  uint64 revision = 3;
  bytes sha256 = 4;
}
