syntax = "proto3";

package job;

message JobNotificationEvent {
  string job_id = 1;
  string user_id = 2;
  string status = 3;
  string event_type = 4;
  string title = 5;
  string message = 6;
  int64 created_at = 7;
  string trace_parent = 8;
  string trace_state = 9;
  string resource_id = 10;
  uint32 job_version = 11;
  uint32 attempt = 12;
  string notification_id = 13;
  uint64 status_version = 14;
}
