syntax = "proto3";
package iam.rpc;

// Đường dẫn package Go khi sinh code
option go_package = "controlplane/internal/iam/transport/rpc/proto;iamproto";

// Shared IAM authentication messages carried over bounded Shared Redis
// request/reply. This file intentionally declares no RPC service: gRPC is not
// part of the ACR-Controlplane topology for these workflows.

// requested_tenant_id is context requested by an already authenticated device
// credential. It is not an identity claim and Controlplane resolves current
// membership/role authority independently.
message RecoverUserSessionRequest {
  string refresh_token = 1;
  optional string requested_tenant_id = 2;
}

// Domain failures are explicit outcomes. Infrastructure failures intentionally
// produce no response so ACR fails closed on its bounded request timeout.
message RecoverUserSessionResponse {
  bool credential_valid = 1;
  bool context_authorized = 2;
  string user_id = 3;
  string username = 4;
  string resolved_tenant_id = 5;
  reserved 6;
  reserved "role_id";
  int32 role_level = 7;
  string client_device_id = 8;
  bool personal_fallback_authorized = 9;
}

// [COMMENT]: Request chứa raw refresh token từ client cookie để CP hash & revoke
message RevokeOpaqueRefreshTokenRequest {
  string refresh_token = 1;
}

// [COMMENT]: Response rỗng phục vụ tín hiệu hoàn tất cho rpc call
message RevokeOpaqueRefreshTokenResponse {
}

// [COMMENT]: Request xác thực thông tin đăng nhập thô từ client gửi lên gateway
message VerifyUserCredentialsRequest {
  string username = 1;         // Tên đăng nhập hoặc Email của người dùng
  string password = 2;         // Mật khẩu dạng plain-text cần xác thực
  string client_device_id = 3;  // UUID định danh thiết bị gửi lên từ cookie (nếu có)
  string device_name = 4;      // Tên hiển thị của thiết bị (ví dụ: Chrome on Windows)
  string device_type = 5;      // OS/Platform và phiên bản của thiết bị (ví dụ: "Windows 11", "macOS 14", "iOS 17")
  string public_key = 6;       // Khóa Ed25519 public key dạng base64 phục vụ xác thực chữ ký/thiết bị tin cậy
  string signature = 7;        // Chữ ký bảo mật (signature) nếu có
  bool trust_device = 8;       // Cờ xác định có cấp refresh token hay không (trusted device)
  string client_ip = 9;        // Địa chỉ IP của Client (trích xuất từ X-Forwarded-For hoặc Envoy context)
  string user_agent = 10;      // Chuỗi User-Agent của client phục vụ tracking
  // [COMMENT]: Nếu username có định dạng user@tenant_domain, ACR sẽ tách và điền field này.
  // Rỗng = đăng nhập global, có giá trị = đăng nhập vào tenant context.
  string tenant_domain = 11;   // Domain của Tenant (ví dụ: acme.io) — để CP JOIN tenant_domains + tenant_memberships
}

// [COMMENT]: Response trả về trạng thái xác thực và các thông tin định danh/claim
message VerifyUserCredentialsResponse {
  bool valid = 1;              // Cờ báo hiệu xác thực thông tin thành công hay thất bại
  string user_id = 2;          // UUID của người dùng dưới dạng chuỗi
  reserved 3;
  reserved "role_id";
  int32 level = 4;             // Cấp độ quyền (level)
  string tenant_id = 5;              // ID/Context của Tenant liên đới (nếu có)
  string client_device_id = 6;  // UUID thiết bị được ghi nhận/sinh mới sau khi gắn kết thành công
  string refresh_token = 7;    // Opaque Refresh Token được sinh bởi CP để ACR ghi nhận cookie (nếu trust_device=true)
  string error_message = 8;    // Mô tả lỗi chi tiết nếu valid = false
  string username = 9;         // Tên đăng nhập của người dùng
  string client_proof_public_key = 10; // Canonical Ed25519 public key đã được IAM persist/resolve
  int64 refresh_token_expires_at = 11; // Unix seconds của expiry đã persist; ACR dùng làm Max-Age cookie
  bool mfa_required = 12; // Primary credential đúng nhưng cần hoàn tất MFA trước khi issue session
  string mfa_setting_id = 13; // Enrollment fence bound into the short-lived MFA challenge
}

// [COMMENT]: Identity OAuth/OIDC đã được ACR parse, verify chữ ký/claims và canonicalize.
// Controlplane không nhận raw provider JSON, authorization code hoặc provider token.
message VerifyExternalIdentityRequest {
  string operation_id = 1;
  uint32 schema_version = 2;
  string provider = 3;
  string provider_subject = 4;
  string provider_email = 5;
  int64 email_verified_at = 6;
  string display_name = 7;
  string avatar_url = 8;
  string client_device_id = 9;
  string device_name = 10;
  string device_type = 11;
  string public_key = 12;
  bool trust_device = 13;
  string zone_code = 14;
  string client_ip = 15;
  string user_agent = 16;
}

message VerifyExternalIdentityResponse {
  bool valid = 1;
  string user_id = 2;
  reserved 3;
  reserved "role_id";
  int32 level = 4;
  string tenant_id = 5;
  string client_device_id = 6;
  string refresh_token = 7;
  string error_message = 8;
  string username = 9;
  string client_proof_public_key = 10;
  int64 refresh_token_expires_at = 11;
  string zone_code = 12;
  // Removed OAuth account-creation handoff. Keep the field numbers and names
  // reserved so a future schema cannot reinterpret stale wire payloads.
  reserved 13, 14;
  reserved "onboarding_token", "onboarding_expires_at";
  bool mfa_required = 15;
  string mfa_setting_id = 16;
}

// Canonical provider identity accepted only after ACR completed a critical
// session-proof start and verified the provider callback.
message LinkExternalIdentityRequest {
  string operation_id = 1;
  uint32 schema_version = 2;
  string user_id = 3;
  string provider = 4;
  string provider_subject = 5;
  string provider_email = 6;
  int64 email_verified_at = 7;
  string display_name = 8;
  string avatar_url = 9;
}

message LinkExternalIdentityResponse {
  bool linked = 1;
  string error_message = 2;
}

message VerifyMfaChallengeRequest {
  string operation_id = 1;
  string user_id = 2;
  string username = 3;
  string tenant_domain = 4;
  string method = 5;
  string code = 6;
  string client_device_id = 7;
  string device_name = 8;
  string device_type = 9;
  string public_key = 10;
  bool trust_device = 11;
  string client_ip = 12;
  string user_agent = 13;
  string mfa_setting_id = 14;
}

message VerifyMfaChallengeResponse {
  bool valid = 1;
  string user_id = 2;
  reserved 3;
  reserved "role_id";
  int32 level = 4;
  string tenant_id = 5;
  string client_device_id = 6;
  string refresh_token = 7;
  string error_message = 8;
  string username = 9;
  string client_proof_public_key = 10;
  int64 refresh_token_expires_at = 11;
  string tenant_code = 12;
}

// [COMMENT]: Thông tin danh sách quyền hạn của một Role để lưu cache L1/L2
message RoleEntry {
  repeated string permissions = 1;
}

// Pending self-user MFA enrollment stored in Auth-State Redis.
// This is an internal short-lived record; it is not a public HTTP payload.
message MfaSetupPending {
  string setup_id = 1;
  string user_id = 2;
  string setting_id = 3;
  string secret_ciphertext = 4;
  string secret_key_id = 5;
  uint32 schema_version = 6;
}
