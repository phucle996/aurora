syntax = "proto3";

package billing.pricing.storage.v1;

option go_package = "cost-manager/api/internal/genproto/billing/pricing/storage/v1;storagepricingv1";

// StoragePricingSnapshotCacheEntryV1 is the Storage-owned binary value stored
// in its Redis L2 cache. It is not the cross-module pricing publish event.
message StoragePricingSnapshotCacheEntryV1 {
  bytes pricing_schedule_id = 1; // exactly 16 UUID bytes
  bytes version_id = 2; // exactly 16 UUID bytes
  string schedule_code = 3;
  StorageChargeKindV1 charge_kind = 4;
  StoragePricingModelV1 pricing_model = 5;
  StorageRawInputUnitV1 raw_input_unit = 6;
  uint32 version_number = 7;
  int64 effective_from_unix_micros = 8;
  optional int64 effective_to_unix_micros = 9;
  bytes checksum_sha256 = 10; // exactly 32 bytes
  string currency = 11;
  repeated StoragePricingScalarBracketV1 brackets = 12;
  reserved 13 to 20;
}

message StoragePricingScalarBracketV1 {
  bytes id = 1; // exactly 16 UUID bytes
  int64 range_start_quantity = 2;
  optional int64 range_end_quantity = 3;
  int64 price_numerator_micro_units = 4;
  int64 price_denominator_quantity = 5;
  reserved 6 to 10;
}

enum StorageChargeKindV1 {
  STORAGE_CHARGE_KIND_V1_UNSPECIFIED = 0;
  STORAGE_CHARGE_KIND_V1_CAPACITY_GB_HOUR = 1;
  STORAGE_CHARGE_KIND_V1_NETWORK_IN_BYTE = 2;
  STORAGE_CHARGE_KIND_V1_NETWORK_OUT_BYTE = 3;
}

enum StoragePricingModelV1 {
  STORAGE_PRICING_MODEL_V1_UNSPECIFIED = 0;
  STORAGE_PRICING_MODEL_V1_PROGRESSIVE_UNIT = 1;
}

enum StorageRawInputUnitV1 {
  STORAGE_RAW_INPUT_UNIT_V1_UNSPECIFIED = 0;
  STORAGE_RAW_INPUT_UNIT_V1_BYTE_HOUR = 1;
  STORAGE_RAW_INPUT_UNIT_V1_BYTE = 2;
}
