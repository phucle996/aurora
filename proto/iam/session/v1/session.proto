syntax = "proto3";

package iam.rpc;

option go_package = "controlplane/internal/iam/transport/proto;iamproto";

// SessionService is the Controlplane RPC surface for runtime session cleanup.
// Stream consumers use the same request message without invoking this service.
service SessionService {
  rpc RevokeUserSessionsByDevices(RevokeUserSessionsByDevicesRequest) returns (RevokeUserSessionsByDevicesResponse);
}

message RevokeUserSessionsByDevicesRequest {
  string user_id = 1;
  repeated string client_device_ids = 2;
}

message RevokeUserSessionsByDevicesResponse {
  int64 revoked_count = 1;
}
