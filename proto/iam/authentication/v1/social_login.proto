syntax = "proto3";
package iam.rpc;
option go_package = "controlplane/internal/iam/transport/proto;iamproto";

message VerifyExternalIdentityRequest {
  string operation_id = 1;
  uint32 schema_version = 2;
  string provider = 3;
  string provider_subject = 4;
  string provider_email = 5;
  int64 email_verified_at = 6;
  string display_name = 7;
  string avatar_url = 8;
  string client_device_id = 9;
  string device_name = 10;
  string device_type = 11;
  string public_key = 12;
  bool trust_device = 13;
  string zone_code = 14;
  string client_ip = 15;
  string user_agent = 16;
}

message VerifyExternalIdentityResponse {
  bool valid = 1;
  string user_id = 2;
  reserved 3;
  reserved "role_id";
  int32 level = 4;
  string tenant_id = 5;
  string client_device_id = 6;
  string refresh_token = 7;
  string error_message = 8;
  string username = 9;
  string client_proof_public_key = 10;
  int64 refresh_token_expires_at = 11;
  string zone_code = 12;
  reserved 13, 14;
  reserved "onboarding_token", "onboarding_expires_at";
  bool mfa_required = 15;
  string mfa_setting_id = 16;
}
