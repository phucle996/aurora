syntax = "proto3";
package iamproto;
option go_package = "controlplane/internal/iam/transport/proto;iamproto";

message TenantWalletProvisionRequestedV1 {
  bytes event_id = 1;
  int32 schema_version = 2;
  bytes tenant_id = 3;
  bytes actor_user_id = 4;
  string currency = 5;
  string occurred_at = 6;
}
