syntax = "proto3";

package aurora.transport.v1;

option go_package = "controlplane/internal/security;security";

enum PayloadEncodingV1 {
  PAYLOAD_ENCODING_UNSPECIFIED = 0;
  PAYLOAD_ENCODING_HPKE_X25519_HKDF_SHA256_AES_256_GCM = 1;
}

// ProtectedPayloadV1 is the opaque durable representation stored in every
// Zone-bound Controlplane outbox and forwarded byte-for-byte by JO. Routing
// metadata remains outside so JO can route/retry without any decryption key.
message ProtectedPayloadV1 {
  uint32 schema_version = 1;
  bytes recipient_zone_id = 2;
  bytes key_id = 3;
  PayloadEncodingV1 encoding = 4;
  bytes encapsulated_key = 5;
  bytes ciphertext = 6;
  uint32 plaintext_size = 7;
  reserved 8 to 15;
}
