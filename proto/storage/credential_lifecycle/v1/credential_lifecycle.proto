syntax = "proto3";

package storage;

option go_package = "controlplane/internal/storage/transport/proto;storageproto";

// Cấu hình đồng bộ hóa Credential vật lý từ Controlplane sang Dataplane
message CredentialSync {
  string id = 1;
  string access_key = 2;
  string secret_key = 3;
  string policy = 4;
}
