syntax = "proto3";

package storage;

option go_package = "controlplane/internal/storage/transport/proto;storageproto";

// Ephemeral access projection written to the Zone-local KV. This contract
// deliberately carries authorization metadata only; it never carries an S3
// secret, STS token, or credential material.
message StorageAccessPrepareRequest {
  string access_session_id = 1;
  string binding_hash = 2;
  string actor_id = 3;
  string resource_id = 4;
  string bucket_name = 5;
  string workspace_id = 6;
  string zone_id = 7;
  repeated string actions = 8;
  string key_prefix = 9;
  uint64 expires_at_unix_seconds = 10;
  uint64 policy_revision = 11;
}

// Auth-State Redis projection consumed by ACR. This is intentionally distinct
// from StorageAccessPrepareRequest: the former is a Central authorization
// record, while the latter is a durable command sent to Dataplane.
message StorageAccessRecord {
  uint32 schema_version = 1;
  string access_session_id = 2;
  string binding_hash = 3;
  string actor_id = 4;
  string resource_id = 5;
  string bucket_name = 6;
  string workspace_id = 7;
  string zone_id = 8;
  repeated string actions = 9;
  string key_prefix = 10;
  uint64 expires_at_unix_seconds = 11;
  uint64 policy_revision = 12;
}

message StorageAccessPrepareResponse {
  string access_session_id = 1;
  string resource_id = 2;
  string zone_id = 3;
  uint64 expires_at_unix_seconds = 4;
  string state = 5;
}
