syntax = "proto3";

package iam.rpc;

option go_package = "controlplane/internal/iam/transport/proto;iamproto";

// [COMMENT]: Request payload cho lệnh thu hồi session qua Shared Redis Stream.
message RevokeUserSessionsByDevicesRequest {
  string user_id = 1;              // UUID của user
  repeated string client_device_ids = 2;  // Danh sách client_device_id cần thu hồi session
}

// [COMMENT]: Response trả về số lượng session đã được thu hồi thành công.
message RevokeUserSessionsByDevicesResponse {
  int64 revoked_count = 1;         // Tổng số session đã được chuyển sang grace period
}
