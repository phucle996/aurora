syntax = "proto3";

package mail.runtime.v1;

import "mail/consumer_lifecycle/v1/consumer_lifecycle.proto";

option go_package = "controlplane/internal/mail/transport/proto;mailproto";

message MailTemplateVersionPublishedV1 {
  MailEventMetadataV1 metadata = 1;
  string template_id = 2;
  uint64 template_revision = 3;
  uint64 template_version = 4;
  string subject_template = 5;
  reserved 6;
  bytes html_template = 7;
  reserved 8;
  bytes content_sha256 = 9;
}

message MailTemplateDeletedV1 {
  MailEventMetadataV1 metadata = 1;
  string template_id = 2;
  uint64 template_revision = 3;
  uint64 last_published_version = 4;
}
