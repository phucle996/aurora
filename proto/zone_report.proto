syntax = "proto3";

package zone;

message DataplaneCluster {
    int64 active_nodes = 1;
    double avg_cpu_usage = 2;
    double avg_ram_usage = 3;
    int64 total_active_workers = 4;
    int64 total_max_workers = 5;
    // [COMMENT]: Kafka consumer lag được Dataplane đo tại source; JO không cần
    // query broker bằng credential xuyên Zone để chạy Decision Engine.
    int64 job_queue_lag = 6;
    bool job_queue_lag_stale = 7;
}

message MailWorkload {
    string status = 1;
    int32 capacity = 2;
}

message StorageWorkload {
    string status = 1;
    int32 capacity = 2;
}

message HypervisorNode {
    string node_code = 1;
    string status = 2;
    int64 cpu_cores_total = 3;
    int64 cpu_cores_used = 4;
    int64 ram_mb_total = 5;
    int64 ram_mb_used = 6;
    int64 storage_gb_total = 7;
    int64 storage_gb_used = 8;
    int64 updated_at = 9;
}

message Workloads {
    MailWorkload mail = 1;
    repeated HypervisorNode hypervisors = 2;
    StorageWorkload storage = 3;
}

message LoadedPayloadKey {
    bytes key_id = 1;
    bytes public_key_fingerprint = 2;
}

message ZoneReport {
    string zone_id = 1;
    int64 timestamp = 2;
    DataplaneCluster dataplane_cluster = 3;
    Workloads workloads = 4;
    // The Zone leader reports only keys/fingerprints shared by every fresh
    // node snapshot. JO matches this public readiness observation against the
    // Hierarchy key registry before Controlplane may select an ACTIVE key.
    repeated LoadedPayloadKey loaded_payload_keys = 5;
    // Monotonic Zone-KV lease fencing token rejects a report from a leader
    // that lost ownership before its Kafka publish reached JO.
    uint64 leader_fencing_token = 6;
}
