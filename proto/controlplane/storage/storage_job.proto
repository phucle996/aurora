syntax = "proto3";
package storage;

option go_package = "controlplane/internal/storage/transport/proto;storageproto";

// Cấu hình đồng bộ hóa Bucket vật lý từ Controlplane sang Dataplane
message BucketCreateSync {
  string name = 1;                // Tên vật lý của bucket
  string access_key = 2;          // Access Key sẽ được tạo trên MinIO
  string secret_key = 3;          // Secret Key (plaintext trong payload, transit qua internal infra)
  string policy = 4;              // JSON policy giới hạn quyền truy cập chỉ vào bucket này

  // Advanced options:
  bool encrypt_enabled = 5;
  bool versioning_enabled = 6;
  bool object_locking_enabled = 7;
  bool replication_enabled = 8;
  int64 retention_days = 9;
  bool legal_hold_enabled = 10;
  string tags = 11;               // JSON string of tags
  int64 quota_bytes = 12;         // Capacity quota in bytes
}

// Cấu hình đồng bộ hóa Credential vật lý từ Controlplane sang Dataplane
message CredentialSync {
  string id = 1;                  // ID credential dạng UUID string
  string access_key = 2;          // Access Key MinIO
  string secret_key = 3;          // Secret Key MinIO
  string policy = 4;              // JSON policy
}

// Cấu hình đồng bộ hóa thay đổi hạn mức (resize) Bucket
message BucketResizeSync {
  string bucket_id = 1;            // ID bucket dạng UUID string để DP ghi log
  string name = 2;                 // Tên vật lý của bucket
  int64 current_quota_bytes = 3;   // Quota hiện tại
  int64 requested_quota_bytes = 4; // Quota muốn thay đổi
}

// Cấu hình đồng bộ hóa xóa Bucket vật lý
message BucketDeleteSync {
  string name = 1;                  // Tên vật lý của bucket cần xóa
  repeated string access_keys = 2; // Danh sách access keys cần thu hồi/xóa sạch
}

message BucketVersioningSync {
  string bucket_id = 1;
  string name = 2;
  bool versioning_enabled = 3;
}

message LifecycleRuleSync {
  string id = 1;
  bool enabled = 2;
  string prefix = 3;
  int32 expiration_days = 4;
  int32 noncurrent_version_expiration_days = 5;
  int32 abort_incomplete_multipart_upload_days = 6;
}

message BucketLifecycleSync {
  string bucket_id = 1;
  string name = 2;
  repeated LifecycleRuleSync rules = 3;
}

// Ephemeral access projection written to the Zone-local KV. This contract
// deliberately carries authorization metadata only; it never carries an S3
// secret, STS token, or credential material.
message StorageAccessPrepareRequest {
  string access_session_id = 1;
  string binding_hash = 2;
  string actor_id = 3;
  string resource_id = 4;
  string bucket_name = 5;
  string workspace_id = 6;
  string zone_id = 7;
  repeated string actions = 8;
  string key_prefix = 9;
  uint64 expires_at_unix_seconds = 10;
  uint64 policy_revision = 11;
}

// Auth-State Redis projection consumed by ACR. This is intentionally distinct
// from StorageAccessPrepareRequest: the former is a Central authorization
// record, while the latter is a durable command sent to Dataplane.
message StorageAccessRecord {
  uint32 schema_version = 1;
  string access_session_id = 2;
  string binding_hash = 3;
  string actor_id = 4;
  string resource_id = 5;
  string bucket_name = 6;
  string workspace_id = 7;
  string zone_id = 8;
  repeated string actions = 9;
  string key_prefix = 10;
  uint64 expires_at_unix_seconds = 11;
  uint64 policy_revision = 12;
}

message StorageAccessPrepareResponse {
  string access_session_id = 1;
  string resource_id = 2;
  string zone_id = 3;
  uint64 expires_at_unix_seconds = 4;
  string state = 5;
}
