syntax = "proto3";

package controlplane.storage.v1;

option go_package = "controlplane/internal/storage/transport/proto;storageproto";

// StorageAdmissionChangedV1 is the Storage-owned per-bucket projection sent
// to the bucket's Zone after Controlplane resolves its own resource topology.
message StorageAdmissionChangedV1 {
  string event_id = 1;
  string owner_id = 2;
  string owner_type = 3;
  int64 policy_version = 4;
  string decision = 5;
  string restriction_reason = 6;
  string effective_at = 7;
  string valid_until = 8;
  string resource_id = 9;
  string resource_name = 10;
  string zone_id = 11;
}
