[package]
name = "zone-public-authorizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
prost-build = "0.11"
protoc-bin-vendored = "3"

[dependencies]
async-nats = "0.49"
base64 = "0.22"
bytes = "1.7"
envoy-types = "0.7"
prost = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = "1.8"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
