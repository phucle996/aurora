static_resources:
  listeners:
    - name: zone_public_edge_gateway
      # Streaming buffers stay bounded per connection; TCP flow control applies
      # backpressure instead of letting thousands of uploads consume pod RAM.
      per_connection_buffer_limit_bytes: 65536
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2", "http/1.1"]
                tls_certificates:
                  - certificate_chain: { filename: /etc/aurora/tls/tls.crt }
                    private_key: { filename: /etc/aurora/tls/tls.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: zone_public_edge
                generate_request_id: true
                use_remote_address: true
                normalize_path: false
                merge_slashes: false
                path_with_escaped_slashes_action: KEEP_UNCHANGED
                request_timeout: 0s
                stream_idle_timeout: 900s
                common_http_protocol_options:
                  idle_timeout: 900s
                  max_headers_count: 64
                route_config:
                  name: zone_public_routes
                  virtual_hosts:
                    - name: zone_storage_data
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                regex: "https?://.*\\.aurora\\.local(:[0-9]+)?"
                            - exact: "http://localhost:3000"
                            - exact: "http://localhost:5173"
                          allow_methods: "GET, PUT, OPTIONS"
                          allow_headers: "Accept, Content-Type, X-Aurora-Transfer-Ticket"
                          expose_headers: "ETag, Content-Length, Content-Type"
                          allow_credentials:
                            value: false
                          max_age: "86400"
                      routes:
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-aurora-transfer-ticket
                                present_match: true
                          route:
                            cluster: minio_transfer
                            timeout: 0s
                            idle_timeout: 900s
                        - match: { prefix: "/" }
                          route:
                            cluster: minio
                            timeout: 0s
                            idle_timeout: 900s
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(handle)
                            local transfer_request = handle:headers():get("x-aurora-transfer-ticket") ~= nil
                            local remove = {}
                            for key, _ in pairs(handle:headers()) do
                              if string.sub(string.lower(key), 1, 9) == "x-aurora-" and string.lower(key) ~= "x-aurora-transfer-ticket" then
                                table.insert(remove, key)
                              end
                            end
                            for _, key in ipairs(remove) do
                              handle:headers():remove(key)
                            end
                            handle:headers():remove("cookie")
                            handle:headers():remove("x-csrf-token")
                            handle:headers():remove("x-client-device-id")
                            if transfer_request then
                              handle:headers():remove("authorization")
                              handle:headers():remove("x-amz-security-token")
                              handle:headers():remove("x-amz-date")
                              handle:headers():remove("x-amz-content-sha256")
                            end
                          end
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      status_on_error: { code: ServiceUnavailable }
                      validate_mutations: true
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: { cluster_name: zone_public_authorizer }
                        timeout: 0.5s
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          log_type: zone-public-edge-access
                          timestamp: "%START_TIME%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          status: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          bytes_received: "%BYTES_RECEIVED%"
                          bytes_sent: "%BYTES_SENT%"
                          duration_ms: "%DURATION%"
  clusters:
    - name: minio
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      per_connection_buffer_limit_bytes: 65536
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 4096
            max_pending_requests: 1024
            max_requests: 8192
      outlier_detection:
        consecutive_5xx: 5
        interval: 5s
        base_ejection_time: 15s
        max_ejection_percent: 50
      load_assignment:
        cluster_name: minio
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: minio, port_value: 9000 }
    - name: minio_transfer
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      per_connection_buffer_limit_bytes: 65536
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: envoy.filters.http.aws_request_signing
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.aws_request_signing.v3.AwsRequestSigning
                service_name: s3
                region: us-east-1
                host_rewrite: minio:9000
                use_unsigned_payload: true
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: minio_transfer
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: minio, port_value: 9000 }
    - name: zone_public_authorizer
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: zone_public_authorizer
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: zone-public-authorizer, port_value: 50053 }

admin:
  access_log_path: /dev/null
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
