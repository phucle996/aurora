# Public data-plane template. The Zone overlay must provision the public DNS,
# certificate and provider-specific LoadBalancer/DDoS controls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-public-edge-gateway
  namespace: zone-z1
  labels:
    app.kubernetes.io/name: zone-public-edge-gateway
    app.kubernetes.io/component: public-zone-edge
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: zone-public-edge-gateway }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zone-public-edge-gateway
        app.kubernetes.io/component: public-zone-edge
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 930
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: zone-public-edge-gateway }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: zone-public-edge-gateway }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.38.3
          args: ["-c", "/etc/envoy/envoy.yaml", "-l", "info", "--drain-time-s", "900"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: public, containerPort: 8080 }
            - { name: admin, containerPort: 9901 }
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: zone-public-minio-signer
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: zone-public-minio-signer
                  key: secret-access-key
          volumeMounts:
            - { name: envoy-config, mountPath: /etc/envoy, readOnly: true }
            - { name: gateway-tls, mountPath: /etc/aurora/tls, readOnly: true }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "4", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /server_info, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: envoy-config
          configMap: { name: zone-public-edge-gateway-config }
        - name: gateway-tls
          secret: { secretName: zone-public-edge-gateway-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: zone-public-edge-gateway
  namespace: zone-z1
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - { name: https, port: 443, targetPort: public }
  selector: { app.kubernetes.io/name: zone-public-edge-gateway }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zone-public-edge-gateway
  namespace: zone-z1
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: zone-public-edge-gateway }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zone-public-edge-gateway
  namespace: zone-z1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zone-public-edge-gateway
  minReplicas: 3
  maxReplicas: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zone-public-edge-gateway
  namespace: zone-z1
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: zone-public-edge-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: minio }
      ports: [{ protocol: TCP, port: 9000 }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: zone-runtime-stream }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: zone-public-edge-authorizer }
      ports: [{ protocol: TCP, port: 50053 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# The Public Edge authorizer owns both Storage transfer admission and scoped
# runtime-read verification. It uses only Zone-local JetStream KV buckets;
# Central credentials and Victoria endpoints are intentionally absent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-public-edge-authorizer
  namespace: zone-z1
  labels:
    app.kubernetes.io/name: zone-public-edge-authorizer
    app.kubernetes.io/component: public-zone-security
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: zone-public-edge-authorizer }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zone-public-edge-authorizer
        app.kubernetes.io/component: public-zone-security
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: zone-public-edge-authorizer }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: zone-public-edge-authorizer }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authorizer
          image: aurora/zone-public-edge-authorizer:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: grpc, containerPort: 50053 }
          env:
            - { name: ZONE_PUBLIC_AUTHORIZER_LISTEN, value: "0.0.0.0:50053" }
            - { name: ZONE_STORAGE_AUTHORIZER_MAX_INFLIGHT, value: "768" }
            - { name: ZONE_RUNTIME_AUTHORIZER_MAX_INFLIGHT, value: "256" }
            - { name: ZONE_PUBLIC_KV_REQUIRED_REPLICAS, value: "3" }
            - { name: NATS_ZONE_CONNECT_TIMEOUT_MS, value: "5000" }
            - { name: NATS_ZONE_REQUEST_TIMEOUT_MS, value: "350" }
            - { name: RUST_LOG, value: "info" }
            - name: ZONE_ID
              valueFrom: { configMapKeyRef: { name: zone-identity, key: zone_id } }
            - name: NATS_ZONE_URL
              valueFrom: { configMapKeyRef: { name: zone-identity, key: nats_zone_url } }
            - name: ZONE_RUNTIME_ASSERTION_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: zone-runtime-assertion-public-keys
                  key: keys.json
            - { name: NATS_ZONE_TLS_CA, value: /etc/aurora/nats/ca.crt }
            - { name: NATS_ZONE_TLS_CERT, value: /etc/aurora/nats/tls.crt }
            - { name: NATS_ZONE_TLS_KEY, value: /etc/aurora/nats/tls.key }
            - { name: NATS_ZONE_CREDS, value: /etc/aurora/nats/zone-public-authorizer.creds }
          volumeMounts:
            - { name: nats-tls, mountPath: /etc/aurora/nats, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: nats-tls
          secret: { secretName: zone-nats-client-public-authorizer }
---
apiVersion: v1
kind: Service
metadata:
  name: zone-public-edge-authorizer
  namespace: zone-z1
spec:
  type: ClusterIP
  ports:
    - { name: grpc, port: 50053, targetPort: grpc }
  selector: { app.kubernetes.io/name: zone-public-edge-authorizer }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zone-public-edge-authorizer
  namespace: zone-z1
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: zone-public-edge-authorizer }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zone-public-edge-authorizer
  namespace: zone-z1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zone-public-edge-authorizer
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zone-public-edge-authorizer
  namespace: zone-z1
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: zone-public-edge-authorizer }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: zone-public-edge-gateway }
      ports: [{ protocol: TCP, port: 50053 }]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nats-zone }
      ports: [{ protocol: TCP, port: 4222 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
