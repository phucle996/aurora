# The matching Envoy ConfigMap is rendered from
# zone-control-edge-gateway/envoy.yaml by the Zone overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-control-edge-gateway
  namespace: zone-z1
  labels:
    app.kubernetes.io/name: zone-control-edge-gateway
    app.kubernetes.io/component: private-zone-edge
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: zone-control-edge-gateway }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zone-control-edge-gateway
        app.kubernetes.io/component: private-zone-edge
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: zone-control-edge-gateway }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: zone-control-edge-gateway }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.38.3
          args: ["-c", "/etc/envoy/envoy.yaml", "-l", "info", "--drain-time-s", "30"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: control, containerPort: 8080 }
            - { name: admin, containerPort: 9901 }
          env:
            # This dedicated identity is the downstream side-effect boundary.
            # Rotate it with an overlapping rolling restart.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: zone-control-minio-signer
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: zone-control-minio-signer
                  key: secret-access-key
          volumeMounts:
            - { name: envoy-config, mountPath: /etc/envoy, readOnly: true }
            - { name: gateway-tls, mountPath: /etc/aurora/tls, readOnly: true }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /server_info, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: envoy-config
          configMap: { name: zone-control-edge-gateway-config }
        - name: gateway-tls
          secret: { secretName: zone-control-edge-gateway-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: zone-control-edge-gateway
  namespace: zone-z1
spec:
  # A Zone overlay exposes this Service only through its private network/LB.
  type: ClusterIP
  ports:
    - { name: control, port: 8080, targetPort: control }
  selector: { app.kubernetes.io/name: zone-control-edge-gateway }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zone-control-edge-gateway
  namespace: zone-z1
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: zone-control-edge-gateway }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zone-control-edge-gateway
  namespace: zone-z1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zone-control-edge-gateway
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zone-control-edge-gateway
  namespace: zone-z1
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: zone-control-edge-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: controlplane }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: zone-control-authorizer }
      ports: [{ protocol: TCP, port: 50052 }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: minio }
      ports: [{ protocol: TCP, port: 9000 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
