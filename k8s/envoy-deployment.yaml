# [COMMENT]: Deployment manifest sản xuất cho Envoy Edge Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: controlplane
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/component: edge-gateway
    app.kubernetes.io/part-of: aurora-security
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy
        app.kubernetes.io/component: edge-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.38.3
          imagePullPolicy: IfNotPresent
          command:
            - envoy
            - -c
            - /etc/envoy/envoy.yaml
            - -l
            - info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: admin
              containerPort: 9901
              protocol: TCP
          resources:
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: 2000m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: envoy-routes
              mountPath: /etc/envoy/routes
              readOnly: true
            - name: tls-certs
              mountPath: /etc/envoy/tls
              readOnly: true
            - name: zone-control-client-tls
              mountPath: /etc/envoy/zone-control
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
        - name: envoy-routes
          configMap:
            name: envoy-routes
        - name: tls-certs
          secret:
            secretName: envoy-tls-certs
        - name: zone-control-client-tls
          secret:
            secretName: envoy-zone-control-client-tls
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi

---
# [COMMENT]: Service LoadBalancer public tiếp nhận Ingress HTTPS/HTTP
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: controlplane
  labels:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/component: edge-gateway
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
  selector:
    app.kubernetes.io/name: envoy

---
# [COMMENT]: PodDisruptionBudget cho Envoy Edge Gateway
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envoy-pdb
  namespace: controlplane
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy

---
# [COMMENT]: HPA cho Envoy Gateway
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: envoy-hpa
  namespace: controlplane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: envoy
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
