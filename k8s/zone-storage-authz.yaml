# Zone-local deployment template. The namespace, Secret and ConfigMap are
# provisioned per Zone; no Central Redis/Vault credentials belong here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-storage-authz
  namespace: zone-z1
  labels:
    app.kubernetes.io/name: zone-storage-authz
    app.kubernetes.io/component: storage-security
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zone-storage-authz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zone-storage-authz
        app.kubernetes.io/component: storage-security
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: zone-storage-authz
          image: aurora/zone-storage-authz:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
          env:
            - name: ZONE_STORAGE_AUTHZ_LISTEN
              value: 0.0.0.0:50052
            - name: ZONE_ID
              valueFrom: { configMapKeyRef: { name: zone-identity, key: zone_id } }
            - name: NATS_ZONE_URL
              valueFrom: { configMapKeyRef: { name: zone-identity, key: nats_zone_url } }
            - name: STORAGE_ASSERTION_PUBLIC_KEYS
              valueFrom: { secretKeyRef: { name: storage-assertion-public-keys, key: keys.json } }
            - name: ZONE_STORAGE_AUTHZ_TLS_CERT
              value: /etc/aurora/tls/tls.crt
            - name: ZONE_STORAGE_AUTHZ_TLS_KEY
              value: /etc/aurora/tls/tls.key
            - name: ZONE_STORAGE_AUTHZ_TLS_CLIENT_CA
              value: /etc/aurora/tls/client-ca.crt
            - name: NATS_ZONE_TLS_CA
              value: /etc/aurora/nats/ca.crt
            - name: NATS_ZONE_TLS_CERT
              value: /etc/aurora/nats/tls.crt
            - name: NATS_ZONE_TLS_KEY
              value: /etc/aurora/nats/tls.key
            - name: NATS_ZONE_CREDS
              value: /etc/aurora/nats/zone-storage-authz.creds
          volumeMounts:
            - { name: authz-tls, mountPath: /etc/aurora/tls, readOnly: true }
            - { name: nats-tls, mountPath: /etc/aurora/nats, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: authz-tls
          secret: { secretName: zone-storage-authz-tls }
        - name: nats-tls
          secret: { secretName: zone-nats-client-storage-authz }
---
apiVersion: v1
kind: Service
metadata:
  name: zone-storage-authz
  namespace: zone-z1
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
  selector:
    app.kubernetes.io/name: zone-storage-authz
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zone-storage-authz
  namespace: zone-z1
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zone-storage-authz
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zone-storage-authz
  namespace: zone-z1
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zone-storage-authz
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zone-storage-envoy
      ports:
        - { protocol: TCP, port: 50052 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats-zone
      ports:
        - { protocol: TCP, port: 4222 }

