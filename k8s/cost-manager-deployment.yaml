# [COMMENT]: Vault Kubernetes auth uses this identity through an explicit,
# short-lived projected token. The pod does not receive the default API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-manager
  namespace: controlplane
automountServiceAccountToken: false

---
# [COMMENT]: Deployment manifest sản xuất cho Cost Manager API phục vụ môi trường Cloud Native & HA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-manager
  namespace: controlplane
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: cost-manager
    app.kubernetes.io/component: billing-api
    app.kubernetes.io/part-of: aurora-billing
spec:
  # [COMMENT]: Khởi tạo 3 replicas để duy trì tính sẵn sàng cao (HA) qua các rack/zone
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cost-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cost-manager
        app.kubernetes.io/component: billing-api
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cost-manager
      terminationGracePeriodSeconds: 30
      # [COMMENT]: Rải Pods đều giữa các Availability Zone và Host Node
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cost-manager
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cost-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cost-manager
          image: aurora/cost-manager:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
            - name: grpc
              containerPort: 9094
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: PORT
              value: "8084"
            - name: GRPC_PORT
              value: "9094"
            # API and embedded Engine authenticate independently. Vault returns
            # capability-scoped PostgreSQL/Redis records; raw connection URLs
            # are never injected into this workload.
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_KUBERNETES_ROLE
              value: "cost-manager-api"
            - name: VAULT_KUBERNETES_JWT_PATH
              value: "/var/run/secrets/aurora-vault/token"
            - name: VAULT_ENGINE_KUBERNETES_ROLE
              value: "cost-manager-engine"
            - name: VAULT_ENGINE_KUBERNETES_JWT_PATH
              value: "/var/run/secrets/aurora-vault/token"
            - name: VAULT_TIMEOUT
              value: "5s"
            - name: VAULT_TIMEOUT_SECS
              value: "5"
            - name: VAULT_MAX_RETRIES
              value: "5"
            - name: PG_SSL_MODE
              value: "verify-full"
            - name: PG_SSL_ROOT_CERT
              value: "/etc/aurora/billing-postgres/ca.crt"
            - name: PG_SSL_CLIENT_CERT
              value: "/etc/aurora/billing-postgres/tls.crt"
            - name: PG_SSL_CLIENT_KEY
              value: "/etc/aurora/billing-postgres/tls.key"
            - name: COST_ENGINE_READY_FILE
              value: "/tmp/aurora-cost-engine.ready"
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 800m
              memory: 384Mi
          # [COMMENT]: Liveness probe lặp lại kiểm tra sức khỏe qua HTTP endpoint
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: vault-identity
              mountPath: /var/run/secrets/aurora-vault
              readOnly: true
            - name: billing-postgres-tls
              mountPath: /etc/aurora/billing-postgres
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: vault-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 3600
                  path: token
        - name: billing-postgres-tls
          secret:
            secretName: cost-manager-postgres-client-tls
            defaultMode: 0440

---
# [COMMENT]: Service đại diện cho Cost Manager
apiVersion: v1
kind: Service
metadata:
  name: cost-manager
  namespace: controlplane
  labels:
    app.kubernetes.io/name: cost-manager
    app.kubernetes.io/component: billing-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: grpc
      port: 9094
      targetPort: 9094
      protocol: TCP
  selector:
    app.kubernetes.io/name: cost-manager

---
# [COMMENT]: PodDisruptionBudget bảo vệ uptime của Cost Manager
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cost-manager-pdb
  namespace: controlplane
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cost-manager

---
# [COMMENT]: HPA tự động điều chỉnh số lượng Pods theo tải công việc thực tế
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cost-manager-hpa
  namespace: controlplane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cost-manager
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
