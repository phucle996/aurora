# [COMMENT]: NetworkPolicy sản xuất bảo vệ Cost Manager API
# Thực thi mô hình Zero-Trust: Chỉ cho phép Envoy Pods gọi vào Cost Manager (East-West Trust Boundary).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cost-manager-network-policy
  namespace: controlplane
  labels:
    app.kubernetes.io/name: cost-manager
    app.kubernetes.io/component: security-boundary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cost-manager
  policyTypes:
    - Ingress
    - Egress

  # [COMMENT]: Ingress Rule: Chỉ chấp nhận các request đi qua Envoy Gateway.
  # Ngăn chặn các pod nội bộ bypass Envoy để gửi x-session-proof-verified giả mạo.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 9094

  # [COMMENT]: Egress Rule: Cost chỉ tới Billing DB, Shared L2 Redis và DNS.
  egress:
    # 1. DNS Resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. PostgreSQL Billing Database (Port 5432)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: billing-psql
      ports:
        - protocol: TCP
          port: 5432
    # 3. Cache Redis L2 (Port 6379) — Không được phép truy cập ACR Security-State Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-l2
      ports:
        - protocol: TCP
          port: 6379
