# Zone-local generic runtime read plane. This deployment is intentionally
# separate from Dataplane and has no command, business database or secret path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-runtime-stream
  namespace: zone-z1
  labels:
    app.kubernetes.io/name: zone-runtime-stream
    app.kubernetes.io/component: runtime-read
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: zone-runtime-stream }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zone-runtime-stream
        app.kubernetes.io/component: runtime-read
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 330
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: zone-runtime-stream }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: zone-runtime-stream }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: runtime-stream
          image: aurora/zone-runtime-stream:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: RUNTIME_STREAM_LISTEN, value: "0.0.0.0:8080" }
            - name: ZONE_ID
              valueFrom: { configMapKeyRef: { name: zone-identity, key: zone_id } }
            - { name: VICTORIA_METRICS_URL, value: "http://zone-victoriametrics:8428" }
            - { name: VICTORIA_LOGS_URL, value: "http://zone-victorialogs:9428" }
            - { name: RUNTIME_STREAM_MAX_CONNECTIONS, value: "1024" }
            - { name: RUNTIME_STREAM_MAX_FANOUT_GROUPS, value: "256" }
            - { name: RUNTIME_STREAM_MAX_BUFFERED_EVENTS, value: "128" }
            - { name: RUNTIME_STREAM_MAX_LIFETIME_SECONDS, value: "300" }
            - { name: RUNTIME_STREAM_HEARTBEAT_SECONDS, value: "15" }
            - { name: RUNTIME_STREAM_QUERY_INTERVAL_MS, value: "1000" }
            - { name: RUNTIME_STREAM_MAX_SNAPSHOT_SECONDS, value: "300" }
            - { name: RUNTIME_STREAM_MAX_EVENT_BYTES, value: "262144" }
            - { name: RUNTIME_STREAM_MAX_LOG_LINES, value: "100" }
            - { name: RUST_LOG, value: "info" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: zone-runtime-stream
  namespace: zone-z1
  labels:
    app.kubernetes.io/name: zone-runtime-stream
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: http }
  selector: { app.kubernetes.io/name: zone-runtime-stream }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zone-runtime-stream
  namespace: zone-z1
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: zone-runtime-stream }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zone-runtime-stream
  namespace: zone-z1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zone-runtime-stream
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zone-runtime-stream
  namespace: zone-z1
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: zone-runtime-stream }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: zone-public-edge-gateway }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    # Victoria services are the only data source allowed for this read plane.
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: zone-victoriametrics }
      ports: [{ protocol: TCP, port: 8428 }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: zone-victorialogs }
      ports: [{ protocol: TCP, port: 9428 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
